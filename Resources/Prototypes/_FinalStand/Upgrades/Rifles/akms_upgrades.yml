# ── AKMS Shop ────────────────────────────────────────────────────────────────
# The Aggressor. Gets scarier the more enemies it kills. Rewards aggressive play.

- type: entity
  parent: FSWeaponShopBase
  id: FSWeaponShopAkms
  name: AKMS
  description: Battered but reliable combat rifle. Earns its keep through sustained aggression. Uses .30 rifle magazines.
  components:
  - type: FSShopWeapon
    weaponProtoId: FSWeaponRifleAk
    price: 30000
    starterAmmoProtoId: FSMagazineLightRifle
    starterAmmoCount: 2
    category: .30 Full-Auto Rifle
    statDamage: 65
    statFireRate: 65
    statAccuracy: 50
    statCapacity: 65
    upgrades:
    - id: akms-damage
      name: fs-upgrade-akms-damage
      description: fs-upgrade-akms-damage-desc
      maxLevel: 5
      baseCost: 4500
      type: Damage
      valuePerLevel: 0.15
    - id: akms-fire-rate
      name: fs-upgrade-akms-fire-rate
      description: fs-upgrade-akms-fire-rate-desc
      maxLevel: 3
      baseCost: 4500
      type: FireRate
      valuePerLevel: 0.5
    - id: akms-recoil
      name: fs-upgrade-akms-recoil
      description: fs-upgrade-akms-recoil-desc
      maxLevel: 3
      baseCost: 4500
      type: Accuracy
      valuePerLevel: 0.5
    - id: akms-incendiary
      name: fs-upgrade-akms-incendiary
      description: fs-upgrade-akms-incendiary-desc
      maxLevel: 1
      baseCost: 7900
      type: SetOnFire
      valuePerLevel: 1
    - id: akms-battle-trance
      name: fs-upgrade-akms-battle-trance
      description: fs-upgrade-akms-battle-trance-desc
      maxLevel: 3
      baseCost: 13500
      type: BattleTrance
      valuePerLevel: 1
    - id: akms-suppression
      name: fs-upgrade-akms-suppression
      description: fs-upgrade-akms-suppression-desc
      maxLevel: 2
      baseCost: 7900
      type: Suppression
      valuePerLevel: 1
    - id: akms-pierce
      name: fs-upgrade-akms-pierce
      description: fs-upgrade-akms-pierce-desc
      maxLevel: 4
      baseCost: 6000
      type: Pierce
      valuePerLevel: 1
  - type: Sprite
    sprite: Objects/Weapons/Guns/Rifles/ak.rsi
    state: base
    scale: 1,1
