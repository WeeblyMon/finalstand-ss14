# Barricades ported from RMC-14. The fixture only occupies the facing edge, so rotation sets which approach it blocks.

- type: localizedDataset
  id: FSBarricadeMessages
  values:
    prefix: fs-barricade-damaged-
    count: 4

- type: entity
  abstract: true
  parent: BaseStructure
  id: FSBarricadeBase
  components:
  - type: Rotatable
  - type: Anchorable
  - type: Climbable
  - type: Appearance
  - type: InteractionOutline
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,-0.38"
        density: 500
        mask:
        - FullTileMask
        layer:
        - TableLayer
  - type: Damageable
    damageModifierSet: FSBarricade
  - type: Injurable
    damageContainer: Inorganic
  - type: ExaminableDamage
    messages: FSBarricadeMessages
  - type: Flammable
    fireSpread: false
    maximumFireStacks: 0.5
    damage:
      types:
        Heat: 2

# ── Metal ─────────────────────────────────────────────────────────────────────
- type: entity
  parent: FSBarricadeBase
  id: FSBarricadeMetal
  name: metal barricade
  description: A sturdy and easily assembled barricade made of metal plates, often used for quick fortifications.
  components:
  - type: Sprite
    sprite: _FinalStand/Structures/Walls/Barricades/barricade.rsi
    drawdepth: WallTops
    layers:
    - state: metal
  - type: DamageVisuals
    thresholds: [4, 8, 12]
    damageDivisor: 28.125
    trackAllDamage: true
    damageOverlay:
      sprite: _FinalStand/Structures/Walls/Barricades/metal_barricade_cracks.rsi
  - type: MeleeSound
    soundGroups:
      Brute:
        path: /Audio/_FinalStand/Structures/metalhit.ogg
  - type: InteractionPopup
    interactSuccessString: fence-rattle-success
    messagePerceivedByOthers: fence-rattle-success
    interactSuccessSound:
      collection: FenceRattle
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 450
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 2
            max: 2
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: FSBarricadeMetal
  id: FSBarricadeMetalReinforced
  suffix: Reinforced
  components:
  - type: Damageable
    damageModifierSet: FSBruteBarricade

- type: entity
  parent: FSBarricadeMetal
  id: FSBarricadeMetalBiohazard
  suffix: Biohazard
  components:
  - type: Damageable
    damageModifierSet: FSBurnBarricade
  - type: Flammable
    fireSpread: false
    maximumFireStacks: 0.5
    damage:
      types:
        Heat: 1.5

- type: entity
  parent: FSBarricadeMetal
  id: FSBarricadeMetalComposite
  suffix: Composite
  components:
  - type: ExplosionResistance
    damageCoefficient: 0.5
  - type: Flammable
    fireSpread: false
    maximumFireStacks: 0.5
    damage:
      types:
        Heat: 1

