# Shotgun overrides — adds AkimboEligible tag for shops that offer the Akimbo upgrade.

- type: entity
  id: FSWeaponShotgunBulldog
  parent: WeaponShotgunBulldog
  suffix: FinalStand
  components:
  - type: Tag
    tags:
    - AkimboEligible

# Hushpup override — uses FS pellets for +40% base damage.
- type: entity
  id: FSWeaponShotgunHushpup
  parent: WeaponShotgunHushpup
  suffix: FinalStand
  components:
  - type: BallisticAmmoProvider
    proto: FSShellShotgunHushpup
    capacity: 4

# E-shottie override — upstream has no self-recharge; needed for the Rapid Charge upgrade to work.
# Also uses FS laser projectiles for +50% base damage.

- type: entity
  id: FSWeaponEnergyShotgun
  parent: WeaponEnergyShotgun
  suffix: FinalStand
  components:
  - type: BatterySelfRecharger
    autoRechargeRate: 25
    autoRechargePauseTime: 3
  - type: BatteryAmmoProvider
    proto: FSBulletLaserShotgunSpread
    fireCost: 80
  - type: BatteryWeaponFireModes
    fireModes:
    - proto: FSBulletLaserShotgunSpread
      fireCost: 80
    - proto: BulletDisablerSmgSpread
      fireCost: 48
      pacifismAllowedMode: true

# Laser Carbine override — adds self-recharge and spread for upgrade interactions.

- type: entity
  id: FSWeaponLaserCarbine
  parent: WeaponLaserCarbine
  suffix: FinalStand
  components:
  - type: BatterySelfRecharger
    autoRechargeRate: 50
    autoRechargePauseTime: 1.5
  - type: Gun
    minAngle: 21
    maxAngle: 32
    angleIncrease: 1.5
  - type: GunWieldBonus
    minAngle: -21
    maxAngle: -24

# Pulse Rifle override — perfectly accurate, semi-auto by default; FullAuto upgrade unlocks full auto.

- type: entity
  id: FSWeaponPulseRifle
  parent: WeaponPulseRifle
  suffix: FinalStand
  components:
  - type: BatterySelfRecharger
    autoRechargeRate: 200
    autoRechargePauseTime: 2
  - type: Gun
    minAngle: 0
    maxAngle: 0
    angleIncrease: 0
  - type: GunWieldBonus
    minAngle: 0
    maxAngle: 0
  - type: BatteryAmmoProvider
    proto: FSPulse
    fireCost: 100

