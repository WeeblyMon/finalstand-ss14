- type: entity
  parent: AppearanceHuman
  id: AppearanceDwarf
  categories: [ HideSpawnMenu ]
  name: dwarf appearance
  components:
  - type: InitialBody
    organs:
      Torso: OrganDwarfTorso
      Head: OrganDwarfHead
      ArmLeft: OrganDwarfArmLeft
      ArmRight: OrganDwarfArmRight
      HandRight: OrganDwarfHandRight
      HandLeft: OrganDwarfHandLeft
      LegLeft: OrganDwarfLegLeft
      LegRight: OrganDwarfLegRight
      FootLeft: OrganDwarfFootLeft
      FootRight: OrganDwarfFootRight
      Brain: OrganHumanBrain
      Eyes: OrganDwarfEyes
      Tongue: OrganHumanTongue
      Appendix: OrganHumanAppendix
      Ears: OrganHumanEars
      Lungs: OrganHumanLungs
      Heart: OrganDwarfHeart
      Stomach: OrganDwarfStomach
      Liver: OrganDwarfLiver
      Kidneys: OrganHumanKidneys
  - type: HumanoidProfile
    species: Dwarf

- type: entity
  parent:
  - AppearanceDwarf
  - MobHuman
  id: MobDwarf
  name: Urist McHands the Dwarf
  components:
  - type: Fixtures
    fixtures: # TODO: This needs a second fixture just for mob collisions.
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        # they r smaller
        density: 120
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Vocal
    emoteSounds: UnisexDwarf
  - type: ReplacementAccent
    accent: scottish
  - type: Speech
    speechSounds: Bass

- type: entity
  parent: OrganBaseOrganic
  id: OrganDwarf
  abstract: true
  suffix: Dwarf

- type: entity
  parent: OrganDwarf
  id: OrganDwarfAppearance
  abstract: true
  suffix: Dwarf
  components:
  - type: VisualOrgan
    data:
      sprite: Mobs/Species/Human/parts.rsi

- type: entity
  parent: OrganDwarf
  id: OrganDwarfMetabolizer
  abstract: true
  components:
  - type: Metabolizer
    metabolizerTypes: [ Dwarf ]

- type: entity
