# Monorail

- type: entity
  id: FSMonorailStraight
  name: monorail track
  description: The rail system for the CORSAT monorail.
  placement:
    mode: SnapgridCenter
  components:
  - type: Clickable
  - type: Sprite
    sprite: _FinalStand/Structures/catwalk.rsi
    drawdepth: FloorTiles
    state: monorailStraight
    noRot: false
  - type: Icon
    sprite: _FinalStand/Structures/catwalk.rsi
    state: monorailStraight
  - type: Transform
    anchored: true
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepCatwalk
      params:
        volume: 8
  - type: Tag
    tags:
    - Catwalk

- type: entity
  parent: FSMonorailStraight
  id: FSMonorailBend
  components:
  - type: Sprite
    sprite: _FinalStand/Structures/catwalk.rsi
    drawdepth: FloorTiles
    state: monorailBend
  - type: Icon
    sprite: _FinalStand/Structures/catwalk.rsi
    state: monorailBend

# Minecart Track

- type: entity
  parent: FSMonorailStraight
  id: FSRailroadStraight
  name: rails
  description: Minecarts and rail vehicles go on these.
  components:
  - type: Sprite
    sprite: _FinalStand/Structures/catwalk.rsi
    drawdepth: FloorTiles
    state: railroadStraight
  - type: Icon
    sprite: _FinalStand/Structures/catwalk.rsi
    state: railroadStraight

- type: entity
  parent: FSRailroadStraight
  id: FSRailroadBend
  components:
