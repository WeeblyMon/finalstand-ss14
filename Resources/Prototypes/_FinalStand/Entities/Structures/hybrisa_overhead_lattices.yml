- type: entity
  id: FSOverheadLattice
  abstract: true
  name: lattice
  description: A support lattice.
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: SpriteFade
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: _FinalStand/Structures/overhead_lattice.rsi
    state: lattice1
    drawdepth: Overdoors
    offset: 0,0.5
  - type: Icon
    sprite: _FinalStand/Structures/overhead_lattice.rsi
    state: lattice1
  - type: Anchorable
  - type: Clickable

