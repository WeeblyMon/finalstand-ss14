# ── Sniper Shops ──────────────────────────────────────────────────────────────

- type: entity
  parent: FSWeaponShopBase
  id: FSWeaponShopMosin
  name: Kardashev-Mosin
  description: A legendary bolt-action relic. Hits hard and hits true. Uses .30 light rifle rounds.
  components:
  - type: FSShopWeapon
    weaponProtoId: WeaponSniperMosin
    price: 10000
    starterAmmoProtoId: FSStripperClipMosin
    starterAmmoCount: 4
    category: fs-weapon-shop-category-30-bolt-action-sniper
    statDamage: 80
    statFireRate: 20
    statAccuracy: 85
    statCapacity: 35
    upgrades:
    - id: mosin-marksmans-rhythm
      name: fs-upgrade-mosin-marksmans-rhythm
      description: fs-upgrade-mosin-marksmans-rhythm-desc
      maxLevel: 1
      baseCost: 6000
      type: MarksmansRhythm
      valuePerLevel: 1
    - id: mosin-full-auto
      name: fs-upgrade-mosin-full-auto
      description: fs-upgrade-mosin-full-auto-desc
      maxLevel: 1
      baseCost: 8000
      type: FullAuto
      valuePerLevel: 2
    - id: mosin-lucky-shot
      name: fs-upgrade-mosin-lucky-shot
      description: fs-upgrade-mosin-lucky-shot-desc
      maxLevel: 5
      baseCost: 4000
      type: CritChance
      valuePerLevel: 0.15
    - id: mosin-damage
      name: fs-upgrade-mosin-damage
      description: fs-upgrade-mosin-damage-desc
      maxLevel: 3
      baseCost: 5500
      type: Damage
      valuePerLevel: 0.5
    - id: mosin-skull-breaker
      name: fs-upgrade-mosin-skull-breaker
      description: fs-upgrade-mosin-skull-breaker-desc
      maxLevel: 2
      baseCost: 6000
      type: CritDamage
      valuePerLevel: 0.5
    - id: mosin-extended-mag
      name: fs-upgrade-mosin-extended-mag
      description: fs-upgrade-mosin-extended-mag-desc
      maxLevel: 2
      baseCost: 4500
      type: MagazineSize
      valuePerLevel: 5
    - id: mosin-fast-hands
      name: fs-upgrade-mosin-fast-hands
      description: fs-upgrade-mosin-fast-hands-desc
      maxLevel: 2
      baseCost: 4500
      type: ReloadSpeed
      valuePerLevel: 0.25
    - id: mosin-pierce
      name: fs-upgrade-mosin-pierce
      description: fs-upgrade-mosin-pierce-desc
      maxLevel: 3
      baseCost: 6000
      type: Pierce
      valuePerLevel: 1
    - id: mosin-stripper-clip
      name: fs-upgrade-mosin-stripper-clip
      description: fs-upgrade-mosin-stripper-clip-desc
      maxLevel: 5
      baseCost: 500
      type: SpawnItem
      spawnProtoId: FSStripperClipMosin
      spawnCountPerLevel: 1
  - type: Sprite
    sprite: Objects/Weapons/Guns/Snipers/bolt_gun_wood.rsi
    layers:
    - state: base
    scale: 1,1

