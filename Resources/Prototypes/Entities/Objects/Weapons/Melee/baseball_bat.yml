- type: entity
  name: baseball bat
  parent: [BaseItem, BaseMinorContraband]
  id: BaseBallBat
  description: A robust baseball bat.
  components:
  - type: FSMeleeCharge # FINALSTAND
    maxChargeTime: 1.2
    minDamage: 0.6
    maxDamage: 2
    minForce: 0.35
    maxForce: 1.25
    chargeSound:
      path: /Audio/_FinalStand/Melee/charge_bat.ogg
      params:
        volume: -4
    fullSound:
      path: /Audio/_FinalStand/Melee/charge_full.ogg
      params:
        volume: -2
    fullHitSound:
      path: /Audio/_FinalStand/Melee/crowd_cheer.ogg
      params:
        volume: 2
  - type: FSMeleeBlood # FINALSTAND
  - type: FSMeleeJuice # FINALSTAND
    hint: fs-melee-hint-bat
    critWhen: Crash
    heavyRecovery: 1
    light:
      anticipation: 0.07
      hitstop: 0.06
      reach: 1.1
      trauma: 0.3
      knockback: 9
      knockbackDuration: 0.2
      flinchDuration: 0.25
      flinchSpeed: 0.3
      hitEffect: FSMeleeHitBurst
      killEffect: FSMeleeKillBlood
      hitEmitter: FSMeleeBluntDust
      killEmitter: FSMeleeBloodBurst
      killSound:
        collection: FSMeleeBoneBreak
      trailColor: "#c8c0b088"
      trailWidth: 0.07
      trailDuration: 0.12
      slashEffect: FSMeleeSlashWarriorArcTinted
      slashColor: "#efe4cf"
      slashScale: 0.8
    heavy:
      anticipation: 0.06
      hitstop: 0.12
      killHitstopBonus: 0.04
      reach: 1.2
      trauma: 0.6
      knockback: 40
      knockbackDuration: 0.4
      flinchDuration: 1.2
      flinchSpeed: 0.15
      maxTargets: 1
      damageMultiplier: 1.5
      launch: 0.6
      hitEffect: FSMeleeHitShatter
      killEffect: FSMeleeKillBlood
      hitEmitter: FSMeleeBluntDust
      killEmitter: FSMeleeBloodBurst
      killSound:
        collection: FSMeleeBoneBreak
      impactSound:
        collection: FSMeleeBoneBreak
        params:
          volume: 3
      trailColor: "#efe4cfbb"
      trailWidth: 0.1
      trailDuration: 0.2
      slashEffect: FSMeleeSlashWarriorBurstTinted
      slashColor: "#efe4cf"
      slashScale: 1.0
      slashOffset: 0.9
      slashGrow: 1.4
      killZoom: 0.07
    comboHits: 2
    comboReadySound:
      path: /Audio/Effects/thudswoosh.ogg
      params:
        volume: -6
    finisher:
      anticipation: 0.12
      hitstop: 0.1
      reach: 1.2
      trauma: 0.55
      knockback: 18
      knockbackDuration: 0.2
      flinchDuration: 1.15
      flinchSpeed: 0.2
      hitEffect: FSMeleeHitShatter
      killEffect: FSMeleeKillBlood
      hitEmitter: FSMeleeBluntDust
      killEmitter: FSMeleeBloodBurst
      killSound:
        collection: FSMeleeBoneBreak
      trailColor: "#c8c0b088"
      trailWidth: 0.07
      trailDuration: 0.12
      damageMultiplier: 1.5
      slashEffect: FSMeleeSlashWarriorBurstTinted
      slashColor: "#fff2d6"
      slashScale: 0.95
      slashGrow: 1.35
      slashOffset: 0.9
      impactSound:
        collection: FSMeleeBoneBreak
        params:
          volume: 2
  - type: Sprite
    sprite: Objects/Weapons/Melee/baseball_bat.rsi
    state: icon
  - type: MeleeWeapon
    range: 1.9 # FINALSTAND: reach zombie claws
    soundSwing: # FINALSTAND
      collection: FSMeleeSwishHeavy
      params:
        volume: -5
        variation: 0.05
    animation: FSWeaponArcSwing # FINALSTAND: light attacks swing
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 10
    soundHit: # FINALSTAND
      collection: FSMeleeBluntHit
      params:
        volume: -3
        variation: 0.06
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 5
  - type: Item
    size: Normal
    shape:
    - 0,0,0,3
    storedSprite:
      state: storage
      sprite: Objects/Weapons/Melee/baseball_bat.rsi
  - type: Tool
    qualities:
    - Rolling
    speedModifier: 0.75 # a bit unwieldly but does the job
  - type: Clothing
    quickEquip: false
    slots:
    - back
    - suitStorage
  - type: Construction
    graph: WoodenBat
    node: bat
  - type: UseDelay
    delay: 1
  - type: PhysicalComposition
    materialComposition:
      Wood: 250
  - type: Tag
    tags:
    - BaseballBat
  - type: Crit
    baseCritChance: 0.05

- type: entity
  name: incomplete baseball bat
  parent: BaseItem
  id: IncompleteBaseBallBat
  description: A few planks of wood stuck together.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/incomplete_bat.rsi
    state: icon
  - type: Item
    size: Normal
    shape:
    - 0,0,0,3
    storedSprite:
      state: storage
      sprite: Objects/Weapons/Melee/incomplete_bat.rsi
    sprite: Objects/Weapons/Melee/incomplete_bat.rsi
  - type: Construction
    graph: WoodenBat
    node: incompleteBat

- type: entity
  name: knockback stick
  parent: BaseBallBat
  id: WeaponMeleeKnockbackStick
  description: And then he spleefed all over.
  categories: [ DoNotMap ]
  components:
  - type: MeleeThrowOnHit
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 1
