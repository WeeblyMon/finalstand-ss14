  components:
  - type: Sprite
    sprite: Objects/Specific/Chemistry/bottle.rsi
    layers:
    - state: bottle-2
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 30
        reagents:
        - ReagentId: FSCatalystSalt
          Quantity: 30

- type: latheRecipe
  id: FSCatalystBottle
  result: FSCatalystBottle
  completetime: 3
  materials:
    Steel: 100
    Plastic: 100
    Silver: 50
