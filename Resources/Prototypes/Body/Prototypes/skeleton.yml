- type: body
  id: Skeleton
  name: "skeleton"
  root: chest
  slots:
    head:
      part: HeadSkeleton
      connections:
      - chest
      organs:
        visualHead: OrganSkeletonVisualHead
    chest:
      part: ChestSkeleton
      connections:
      - right arm
      - left arm
      - head # Shitmed
      - groin # Shitmed
      organs:
        visualChest: OrganSkeletonVisualChest
    groin:
      part: GroinSkeleton
      connections:
      - right leg
      - left leg
      organs:
        visualGroin: OrganSkeletonVisualGroin
    right arm:
      part: RightArmSkeleton
      connections:
      - right hand
      organs:
        visualRArm: OrganSkeletonVisualRArm
    left arm:
      part: LeftArmSkeleton
      connections:
      - left hand
      organs:
        visualLArm: OrganSkeletonVisualLArm
    right hand:
      part: RightHandSkeleton
      organs:
        visualRHand: OrganSkeletonVisualRHand
    left hand:
      part: LeftHandSkeleton
      organs:
        visualLHand: OrganSkeletonVisualLHand
    right leg:
      part: RightLegSkeleton
      connections:
      - right foot
      organs:
        visualRLeg: OrganSkeletonVisualRLeg
    left leg:
      part: LeftLegSkeleton
      connections:
      - left foot
      organs:
        visualLLeg: OrganSkeletonVisualLLeg
    right foot:
      part: RightFootSkeleton
      organs:
        visualRFoot: OrganSkeletonVisualRFoot
    left foot:
      part: LeftFootSkeleton
      organs:
        visualLFoot: OrganSkeletonVisualLFoot
