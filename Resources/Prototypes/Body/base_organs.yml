- type: entity
  parent: OrganBase
  id: OrganBaseBrain
  name: brain
  abstract: true
  components:
  - type: GibbableOrgan
  - type: Organ
  - type: Sprite
    layers:
    - state: brain
  - type: Item
    heldPrefix: brain
  - type: Input
    context: "ghost"
  - type: Brain
  - type: InputMover
  - type: Examiner
  - type: BlockMovement
  - type: BadFood
  - type: FoodSequenceElement
    entries:
      Burger: Brain
      Taco: Brain

