- type: entity
  id: FSRevenantBoltProjectile
  categories: [ HideSpawnMenu ]
  components:
  - type: FSRevenantBolt
    damage: 15.15
  - type: Sprite
    sprite: _FinalStand/Effects/Revenant/revenant_bolt.rsi
    drawdepth: Effects
    # 72px frame is centred on the entity; shift the art forward so the beam is drawn ahead of
    # the spawn point instead of trailing a tile behind it.
    offset: 1.125, 0
    layers:
    - state: bolt
      shader: unshaded
  - type: Physics
    bodyType: Dynamic
    canCollide: true
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.1
        density: 10
        mask:
        - Impassable
  - type: TimedDespawn
    lifetime: 1.26
  - type: Tag
    tags:
    - HideContextMenu
