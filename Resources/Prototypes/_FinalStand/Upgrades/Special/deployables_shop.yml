# ── SCI Deployables ──────────────────────────────────────────────────────────────────────────
- type: entity
  parent: FSWeaponShopBase
  id: FSDeployableShopNullField
  name: Null Field Emitter
  description: A portable stasis-field emitter. Slows enemies caught in its radius. Diminishing returns - overlapping fields don't stack.
  components:
  - type: FSShopWeapon
    weaponProtoId: FSNullFieldItem
    requiresScience: true
    singlePurchase: true
    price: 3000
    category: Area Denial Deployable
    statDamage: 0
    statFireRate: 0
    statAccuracy: 0
    statCapacity: 0
    upgrades:
    - id: null-field-capacity
      name: fs-upgrade-null-field-capacity
      description: fs-upgrade-null-field-capacity-desc
      maxLevel: 1
      baseCost: 3000
      type: DeployableCapacity
      valuePerLevel: 1
  - type: Sprite
    sprite: _FinalStand/Objects/Devices/NullField.rsi
    state: icon
    scale: 1,1

- type: entity
  parent: FSWeaponShopBase
  id: FSDeployableShopDamageBeacon
  name: Damage Beacon
  description: A portable targeting beacon. Amplifies damage dealt to enemies in its radius. Diminishing returns - overlapping beacons don't stack.
  components:
  - type: FSShopWeapon
    weaponProtoId: FSDamageBeaconItem
    requiresScience: true
    singlePurchase: true
    price: 3500
    category: Area Denial Deployable
    statDamage: 0
    statFireRate: 0
    statAccuracy: 0
    statCapacity: 0
    upgrades:
    - id: damage-beacon-capacity
      name: fs-upgrade-damage-beacon-capacity
      description: fs-upgrade-damage-beacon-capacity-desc
      maxLevel: 1
      baseCost: 3000
      type: DeployableCapacity
      valuePerLevel: 1
  - type: Sprite
    sprite: _FinalStand/Objects/Devices/DamageBeacon.rsi
    state: icon
    scale: 1,1

- type: entity
  parent: FSWeaponShopBase
  id: FSDeployableShopLandmine
  name: Landmines
  description: Proximity mines that arm a few seconds after planting and detonate once. They shred anything organic in the blast and leave the station untouched.
  components:
  - type: FSShopWeapon
    weaponProtoId: FSLandmineItem
    requiresScience: false
    singlePurchase: true
    price: 6500
    category: Area Denial Deployable
    statDamage: 70
    statFireRate: 0
    statAccuracy: 0
    statCapacity: 30
    upgrades:
    - id: landmine-capacity
      name: fs-upgrade-landmine-capacity
      description: fs-upgrade-landmine-capacity-desc
      maxLevel: 2
      baseCost: 4000
      type: DeployableCapacity
      valuePerLevel: 1
    - id: landmine-damage
      name: fs-upgrade-landmine-damage
      description: fs-upgrade-landmine-damage-desc
      maxLevel: 3
      baseCost: 5000
      type: LandmineDamage
      valuePerLevel: 2.5
    - id: landmine-detonations
      name: fs-upgrade-landmine-detonations
      description: fs-upgrade-landmine-detonations-desc
      maxLevel: 2
      baseCost: 3000
      type: LandmineDetonations
      valuePerLevel: 1
    - id: landmine-regen
      name: fs-upgrade-landmine-regen
      description: fs-upgrade-landmine-regen-desc
      maxLevel: 2
      baseCost: 4000
      type: DeployableRegen
      valuePerLevel: 1
    - id: landmine-he
      name: fs-upgrade-landmine-he
      description: fs-upgrade-landmine-he-desc
      maxLevel: 1
      baseCost: 10000
      type: LandmineHighExplosive
      valuePerLevel: 1
  - type: Sprite
    sprite: Objects/Misc/landmine.rsi
    state: landmine
    scale: 1,1

- type: entity
  parent: FSWeaponShopBase
  id: FSDeployableShopAmmoBox
  name: Ammo Resupply Box
  description: A portable resupply crate with a limited pool of uses. Its owner can lock it so only they can draw from it.
  components:
  - type: FSShopWeapon
    weaponProtoId: FSAmmoBoxItem
    requiresScience: false
    singlePurchase: true
    price: 5000
    category: Support Deployable
    statDamage: 0
    statFireRate: 0
    statAccuracy: 0
    statCapacity: 40
    upgrades:
    - id: ammo-box-uses
      name: fs-upgrade-ammo-box-uses
      description: fs-upgrade-ammo-box-uses-desc
      maxLevel: 2
      baseCost: 4000
      type: AmmoBoxUses
      valuePerLevel: 1
    - id: ammo-box-speed
      name: fs-upgrade-ammo-box-speed
      description: fs-upgrade-ammo-box-speed-desc
      maxLevel: 3
      baseCost: 3000
      type: AmmoBoxSpeed
      valuePerLevel: 0.7
  - type: Sprite
    sprite: _FinalStand/Objects/Devices/AmmoBox.rsi
    state: base
    scale: 1,1

# ── Medical Deployables ──────────────────────────────────────────────────────────────────────
- type: entity
  parent: FSWeaponShopBase
  id: FSDeployableShopMediDrone
  name: Medi-Drone
  description: A healing drone that follows you and beams wounded allies nearby up to half health. Burns out when its charge runs dry.
  components:
  - type: FSShopWeapon
    weaponProtoId: FSMediDroneItem
    requiresResearch: FSMedicalMediDrone
    requiresMedical: true
    singlePurchase: true
    price: 3000
    category: Medical Deployable
    statDamage: 0
    statFireRate: 0
    statAccuracy: 0
    statCapacity: 0
    upgrades:
    - id: medi-drone-capacity
      name: fs-upgrade-medi-drone-capacity
      description: fs-upgrade-medi-drone-capacity-desc
      maxLevel: 1
      baseCost: 3000
      type: DeployableCapacity
      valuePerLevel: 1
  - type: Sprite
    sprite: _FinalStand/Objects/Medical/medidrone.rsi
    state: full
    scale: 1,1
