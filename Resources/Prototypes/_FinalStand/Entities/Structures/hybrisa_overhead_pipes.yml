    sprite: _FinalStand/Structures/overhead_pipes.rsi
    state: intact-scrubbers_corners
  - type: Icon
    sprite: _FinalStand/Structures/overhead_pipes.rsi
    state: intact-scrubbers_corners

- type: entity
  parent: FSOverheadPipe
