- type: entity
  id: FSAugmentShop
  name: Perk Machine
  description: Unlock and upgrade perks to enhance your combat capabilities.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.2,-0.2,0.2,0.2"
        density: 100
        mask:
        - ItemMask
        layer:
        - WallLayer
  - type: Sprite
    drawdepth: SmallObjects
    sprite: _FinalStand/Structures/augment_shop.rsi
    state: icon
    scale: 1,1
  - type: FSAugmentShop
