- type: entity
  id: FSLadderBoard
  name: record board
  description: The station's best defences, wave by wave. Use it to see the server records.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.3,-0.2,0.3,0.2"
        density: 100
        mask:
        - ItemMask
        layer:
        - WallLayer
  - type: Sprite
    drawdepth: SmallObjects
    sprite: Structures/Wallmounts/noticeboard.rsi
    layers:
    - state: noticeboard
    - state: notice-5
  - type: FSLadderBoard
