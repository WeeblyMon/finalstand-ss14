# ── Shotgun Shops ─────────────────────────────────────────────────────────────

- type: entity
  id: FSWeaponShopBlunderbuss
  parent: FSWeaponShopBase
  name: Blunderbuss
  description: A pirate's room-clearer. Single-shot, but devastating at close range. Uses .50 shotgun shells.
  components:
  - type: FSShopWeapon
    weaponProtoId: FSWeaponShotgunBlunderbuss
    price: 8000
    starterAmmoProtoId: FSBoxShotgunStandard
    starterAmmoCount: 1
    category: .50 Single-Shot Shotgun
    statDamage: 80
    statFireRate: 20
    statAccuracy: 35
    statCapacity: 10
    upgrades:
    - id: blunderbuss-damage
      name: Powder Charge
      description: Heavier load increases damage dealt by 15% per level.
      maxLevel: 5
      baseCost: 1200
      type: Damage
      valuePerLevel: 0.15
    - id: blunderbuss-reload-speed
      name: Speed Loader
      description: Faster reload per level.
      maxLevel: 5
      baseCost: 1200
      type: ReloadSpeed
      valuePerLevel: 0.1
    - id: blunderbuss-extra-pellets
      name: Spread Shot
      description: Adds 2 extra pellets per shot per level. More shot, more gore.
      maxLevel: 3
      baseCost: 1200
      type: PelletCount
      valuePerLevel: 2
    - id: blunderbuss-stopping-power
      name: Stopping Power
      description: Blasts knock enemies back. Level 1 staggers; higher levels add increasing knockback.
      maxLevel: 3
      baseCost: 2100
      type: Knockback
      valuePerLevel: 1
    - id: blunderbuss-scrapshot
      name: Scrapshot
      description: Load the barrel with scrap metal. Massively widens the spread and adds 3 extra pellets for brutal room-clearing.
      maxLevel: 1
      baseCost: 2100
      type: Scrapshot
      valuePerLevel: 1
    - id: blunderbuss-dragonbreath
      name: Dragon's Breath
      description: Incendiary shells. Hits ignite targets on fire.
      maxLevel: 1
      baseCost: 2100
      type: SetOnFire
      valuePerLevel: 1
    - id: blunderbuss-point-blank-crit
      name: Point-Blank
      description: Shots under 2 tiles always crit. Get in close.
      maxLevel: 1
      baseCost: 3500
      type: PointBlankCrit
      valuePerLevel: 1
  - type: Sprite
    sprite: Objects/Weapons/Guns/Shotguns/blunderbuss.rsi
    state: icon
    scale: 1,1

- type: entity
  id: FSWeaponShopKammerer
  parent: FSWeaponShopBase
  name: Kammerer
  description: An old pump-action workhorse. Reliable, punishing, and loves armor shredding upgrades. Uses .50 shotgun shells.
  components:
  - type: FSShopWeapon
    weaponProtoId: FSWeaponShotgunKammerer
    price: 13000
    starterAmmoProtoId: FSBoxShotgunStandard
    starterAmmoCount: 1
    category: .50 Pump-Action Shotgun
    statDamage: 70
    statFireRate: 25
    statAccuracy: 55
    statCapacity: 65
    upgrades:
    - id: kammerer-damage
      name: Powder Charge
      description: Heavier load increases damage dealt by 15% per level.
      maxLevel: 5
      baseCost: 1950
      type: Damage
      valuePerLevel: 0.15
    - id: kammerer-reload-speed
      name: Speed Loader
      description: Faster reload per level.
      maxLevel: 5
      baseCost: 1950
      type: ReloadSpeed
      valuePerLevel: 0.1
    - id: kammerer-tight-choke
      name: Tight Choke
      description: Narrows the choke by 1° per level. Tighter pattern at range.
      maxLevel: 3
      baseCost: 1950
      type: AngleMax
      valuePerLevel: 1.0
    - id: kammerer-slamfire
      name: Slam Fire
      description: Rapid-cycling modification. Empties the tube fast, but devastates anything in the way.
      maxLevel: 1
      baseCost: 5850
      type: SlamFire
      valuePerLevel: 1
    - id: kammerer-ap-slugs
      name: AP Slugs
      description: Armor-piercing ammunition. Slugs bypass enemy armor entirely.
      maxLevel: 1
      baseCost: 3400
      type: APRounds
      valuePerLevel: 1
    - id: kammerer-bleed
      name: Serrated Shot
      description: Pellets cause bleeding on hit. Higher levels bleed harder.
      maxLevel: 3
      baseCost: 3400
      type: Bleed
      valuePerLevel: 1
  - type: Sprite
    sprite: Objects/Weapons/Guns/Shotguns/pump.rsi
    state: icon
    scale: 1,1

- type: entity
  id: FSWeaponShopBulldog
  parent: FSWeaponShopBase
  name: Bulldog
  description: A full-auto mag-fed shotgun. Kicks like a mule; kills like one too. Uses .50 shotgun drum magazines.
  components:
  - type: FSShopWeapon
    weaponProtoId: FSWeaponShotgunBulldog
    price: 25000
    starterAmmoProtoId: FSMagazineShotgun
    starterAmmoCount: 2
    category: .50 Full-Auto Shotgun
    statDamage: 60
    statFireRate: 70
    statAccuracy: 50
    statCapacity: 100
    upgrades:
    - id: bulldog-fire-rate
      name: Hair Trigger
      description: Tuned action increases fire rate by 0.5/level.
      maxLevel: 3
      baseCost: 5250
      type: FireRate
      valuePerLevel: 0.5
    - id: bulldog-drum-capacity
      name: High-Cap Drum
      description: Adds 3 shells to drum magazine capacity per level.
      maxLevel: 3
      baseCost: 5250
      type: MagazineSize
      valuePerLevel: 3
    - id: bulldog-recoil-comp
      name: Recoil Compensator
      description: Reduces max spread by 0.5° per level for tighter full-auto bursts.
      maxLevel: 2
      baseCost: 5250
      type: AngleMax
      valuePerLevel: 0.5
    - id: bulldog-flechette
      name: Flechette Rounds
      description: Load flechettes. Each pellet pierces one extra target; pellet count doubles.
      maxLevel: 1
      baseCost: 9200
      type: FlechetteRounds
      valuePerLevel: 1
    - id: bulldog-incendiary
      name: Incendiary Shells
      description: Pellets ignite targets on hit.
      maxLevel: 1
      baseCost: 9200
      type: SetOnFire
      valuePerLevel: 1
  - type: Sprite
    sprite: Objects/Weapons/Guns/Shotguns/bulldog.rsi
    state: base
    scale: 1,1

