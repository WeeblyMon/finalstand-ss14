# ─── Grenade Shop Structures ───────────────────────────────────────────────────

- type: entity
  id: FSGrenadeShopFrag
  parent: FSWeaponShopBase
  name: Frag Grenade Shop
  description: High-explosive fragmentation grenades. Shreds zombie clusters.
  components:
  - type: FSShopWeapon
    weaponProtoId: FSGrenadePackFrag
    price: 5000
    category: Grenades
    statDamage: 70
    statFireRate: 30
    statAccuracy: 60
    statCapacity: 30
    upgrades:
    - id: frag-blast-bonus
      name: Overcharge
      description: +25% explosion intensity per level.
      maxLevel: 3
      baseCost: 5000
      type: GrenadeBlastBonus
      valuePerLevel: 0.25
    - id: frag-extra-charges
      name: Extra Charges
      description: +2 max grenades per level.
      maxLevel: 2
      baseCost: 2500
      type: GrenadeCapacity
      valuePerLevel: 2
    - id: frag-faster-regen
      name: Faster Regen
      description: Refill +2 extra grenades each prep phase per level.
      maxLevel: 2
      baseCost: 3000
      type: GrenadeRegen
      valuePerLevel: 2
    - id: frag-impact-fuse
      name: Impact Fuse
      description: Grenade detonates on contact instead of waiting for the timer.
      maxLevel: 1
      baseCost: 2500
      type: GrenadeImpactFuse
      valuePerLevel: 1
    - id: frag-cluster
      name: Cluster Grenade
      description: Detonates into 3 sub-munitions. Costs 1 max capacity slot.
      maxLevel: 1
      baseCost: 20000
      type: GrenadeCluster
      valuePerLevel: 1
  - type: Sprite
    sprite: _FinalStand/Objects/Weapons/Grenades/FragGrenade.rsi
    state: icon
    scale: 1,1

- type: entity
  id: FSGrenadeShopIncendiary
  parent: FSWeaponShopBase
  name: Incendiary Grenade Shop
  description: Incendiary grenades that create persistent fire zones.
  components:
  - type: FSShopWeapon
    weaponProtoId: FSGrenadePackIncendiary
    price: 6000
    category: Grenades
    statDamage: 60
    statFireRate: 20
    statAccuracy: 50
    statCapacity: 30
    upgrades:
    - id: incendiary-blast-bonus
      name: Inferno
      description: +25% fire damage (ignite rate) per level.
      maxLevel: 2
      baseCost: 5000
      type: GrenadeBlastBonus
      valuePerLevel: 0.25
    - id: incendiary-burn-duration
      name: Prolonged Burn
      description: Fire zone lasts +5 seconds per level.
      maxLevel: 2
      baseCost: 5000
      type: GrenadeBurnDuration
      valuePerLevel: 5
    - id: incendiary-extra-charges
      name: Extra Charges
      description: +2 max grenades per level.
      maxLevel: 2
      baseCost: 2500
      type: GrenadeCapacity
      valuePerLevel: 2
    - id: incendiary-faster-regen
      name: Faster Regen
      description: Refill +2 extra grenades each prep phase per level.
      maxLevel: 2
      baseCost: 3000
      type: GrenadeRegen
      valuePerLevel: 2
    - id: incendiary-effect-radius
      name: Wide Burn
      description: Fire zone radius +1 tile.
      maxLevel: 1
      baseCost: 3000
      type: GrenadeEffectRadius
      valuePerLevel: 1.0
  - type: Sprite
    sprite: _FinalStand/Objects/Weapons/Grenades/Incendiary.rsi
    state: icon
    scale: 1,1

