# Cutlass override — doubled base damage (16 → 32 Slash).
- type: entity
  id: FSWeaponCutlass
  parent: Cutlass
  suffix: FinalStand
  components:
  - type: MeleeWeapon
    damage:
      types:
        Slash: 32
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg

# Chainsaw override — doubled base damage (4/4 → 8/8 Slash/Blunt, wield bonus 4 → 8 Slash).
- type: entity
  id: FSWeaponChainsaw
  parent: Chainsaw
  suffix: FinalStand
  components:
  - type: MeleeWeapon
    autoAttack: true
    angle: 0
    wideAnimationRotation: -135
    attackRate: 4
    damage:
      types:
        Slash: 8
        Blunt: 8
    soundHit:
      path: /Audio/Weapons/chainsaw.ogg
      params:
        volume: -3
  - type: IncreaseDamageOnWield
    damage:
      types:
        Slash: 8
