# The Mech Bay: Engineering builds it with the RCD, then the Durand goes on part by part: welded frame and limbs, Science boards, armour last.
- type: entity
  id: FSMechBay
  name: mech bay
  description: A 3x3 assembly gantry. A Durand goes on it part by part, and a mech parked on it recharges and gets patched up.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    drawdepth: FloorObjects
    layers:
    - sprite: _FinalStand/Structures/MechBay/mech_bay.rsi
      state: pad
    - sprite: _FinalStand/Structures/MechBay/durand_construction.rsi
      state: durand0
      visible: false
      map: [ "enum.FSMechBayVisualLayers.Stage" ]
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.45,-1.45,1.45,1.45"
        hard: false
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: FSPlayerDamageImmune
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 800
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: RCDDeconstructable
    cost: 0
    delay: 6
    fx: EffectRCDDeconstruct6
  - type: FSMechBay
    slots:
    - id: chassis
      name: fs-mech-bay-slot-chassis
      role: Engineering
      first: true
      materials:
        Steel: 10
        Plasteel: 5
      time: 6
      icon: durand_chassis
    - id: left-leg
      name: fs-mech-bay-slot-left-leg
      role: Engineering
      materials:
        Steel: 3
      icon: durand_l_leg
    - id: right-leg
      name: fs-mech-bay-slot-right-leg
      role: Engineering
      materials:
        Steel: 3
      icon: durand_r_leg
    - id: left-arm
      name: fs-mech-bay-slot-left-arm
      role: Engineering
      materials:
        Steel: 3
      icon: durand_l_arm
    - id: right-arm
      name: fs-mech-bay-slot-right-arm
      role: Engineering
      materials:
        Steel: 3
      icon: durand_r_arm
    - id: core
      name: fs-mech-bay-slot-core
      role: Science
      parts: [ FSDurandControlModule ]
      icon: durand_harness
    - id: targeting
      name: fs-mech-bay-slot-targeting
      role: Science
      parts: [ FSDurandTargetingModule ]
      icon: durand_head
    - id: armour
      name: fs-mech-bay-slot-armour
      role: Engineering
      last: true
      materials:
        Plasteel: 10
        Uranium: 3
        Diamond: 1
      plate: FSDurandBossPlate
      time: 8
      icon: durand_armor
    crafts:
    - proto: FSMechWeaponAutocannon
      materials:
        Steel: 8
        Plasteel: 2
    - proto: FSMechWeaponRotary
      materials:
        Steel: 8
        Plasteel: 2
        Brass: 2
    - proto: FSMechWeaponShotgun
      materials:
        Steel: 8
        Plasteel: 2
    - proto: FSMechWeaponDMR
      materials:
        Steel: 12
        Plasteel: 4
        Gunpowder: 2
    - proto: FSMechWeaponMetronome
      materials:
        Steel: 15
        Plasteel: 6
        Gunpowder: 4
    - proto: FSMechWeaponSkyfall
      materials:
        Steel: 15
        Plasteel: 6
        Gold: 2
        Gunpowder: 6
      time: 8
    - proto: FSMechWeaponBazooka
      materials:
        Steel: 12
        Plasteel: 6
        Gold: 2
        Gunpowder: 4

- type: entity
  parent: BaseItem
  id: FSDurandControlModule
  name: Durand control core
  description: The central control and peripherals boards for a Durand. Fit it at the Mech Bay.
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    state: cpuboard_adv
  - type: Item
    size: Small

- type: entity
  parent: BaseItem
  id: FSDurandTargetingModule
  name: Durand targeting and power module
  description: Weapon targeting boards with a power cell already wired in. Fit it at the Mech Bay.
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    state: cpuboard_super
  - type: Item
    size: Small

- type: entity
  parent: BaseItem
  id: FSDurandBossPlate
  name: giant hide plate
  description: A slab of armour torn off a Giant. Too heavy to carry with one hand. Haul it to the Mech Bay to plate a Durand with a tougher hull.
  components:
  - type: Sprite
    sprite: _FinalStand/Structures/MechBay/durand_construction.rsi
    state: durand_armor
    color: "#c9b79a"
  - type: Item
    size: Huge
  - type: MultiHandedItem
  - type: HeldSpeedModifier
    walkModifier: 0.6
    sprintModifier: 0.6
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Effects/metal_thud1.ogg

