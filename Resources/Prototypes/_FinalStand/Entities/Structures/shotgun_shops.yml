      valuePerLevel: 1
  - type: Sprite
    sprite: Objects/Weapons/Guns/Shotguns/hushpup.rsi
    state: icon
    scale: 1,1

- type: entity
  id: FSWeaponShopEnergyShotgun
  parent: FSWeaponShopBase
  name: Energy Shotgun
  description: A prototype energy weapon. Hold the trigger to charge - a longer hold means bigger, harder-hitting bolts that punch through more targets. Self-powered, no ammo needed.
  components:
  - type: FSShopWeapon
    weaponProtoId: FSWeaponEnergyShotgun
    price: 50000
    category: Self-Recharging Energy Shotgun
    statDamage: 65
    statFireRate: 30
    statAccuracy: 50
    statCapacity: 100
    upgrades:
    - id: eshottie-capacitor-coils
      name: Capacitor Coils
      description: Reaches full charge 25% faster per level.
      maxLevel: 3
      baseCost: 8000
      type: ChargeSpeed
      valuePerLevel: 0.25
    - id: eshottie-ricochet-plating
      name: Ricochet Plating
      description: Fully charged bolts bounce one extra time per level.
      maxLevel: 2
      baseCost: 11000
      type: BounceCount
      valuePerLevel: 1
    - id: eshottie-elastic-rounds
      name: Elastic Rounds
      description: Bolts keep 7% more damage and speed through every bounce, per level.
      maxLevel: 2
      baseCost: 10000
      type: BounceRetention
      valuePerLevel: 0.07
    - id: eshottie-superconductor
      name: Superconductor
      description: Fully charged bolts punch through one extra target per level.
      maxLevel: 2
      baseCost: 10500
      type: ChargePierce
      valuePerLevel: 1
    - id: eshottie-cell-regulator
      name: Cell Regulator
      description: Self-recharge rate x1.8 per level.
      maxLevel: 2
      baseCost: 9000
      type: SelfChargeSpeed
      valuePerLevel: 1.8
    - id: eshottie-kinetic-feedback
      name: Kinetic Feedback
      description: Every bounced bolt that finds a target feeds a quarter of a shot back into the cell.
      maxLevel: 1
      baseCost: 17000
      type: BounceRefund
      valuePerLevel: 1
    - id: eshottie-resonant-cascade
      name: Resonant Cascade
      description: A bolt that comes back around and strikes the same target again critically hits.
      maxLevel: 1
      baseCost: 20000
      type: BounceCrit
      valuePerLevel: 1
    - id: eshottie-fracture-rounds
      name: Fracture Rounds
      description: On its final bounce a bolt shatters into two fragments instead of burning out.
      maxLevel: 1
      baseCost: 32000
      type: FractureRounds
      valuePerLevel: 1
  - type: Sprite
    sprite: Objects/Weapons/Guns/Battery/energy_shotgun.rsi
    state: base
    scale: 1,1
