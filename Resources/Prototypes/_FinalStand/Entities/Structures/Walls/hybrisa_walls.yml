# Rocks

- type: entity
  parent: BaseWall
  id: FSWallHybrisaRock
  name: rock wall
  description: Massive columns comprised of ancient sedimentary rocks loom before you.
  components:
  - type: Sprite
    sprite: _FinalStand/Structures/Walls/hybrisa_rock.rsi
    state: rock
  - type: Icon
    sprite: _FinalStand/Structures/Walls/hybrisa_rock.rsi
    state: rock
  - type: IconSmooth
    key: walls
    additionalKeys:
    - windows
    - doors
    base: rock

- type: entity
  parent: FSWallHybrisaRock
  id: FSWallHybrisaRockBorder
  suffix: border
  components:
  - type: Sprite
    sprite: _FinalStand/Structures/Walls/hybrisa_rock.rsi
    state: rock_border
  - type: Icon
    sprite: _FinalStand/Structures/Walls/hybrisa_rock.rsi
    state: rock_border
  - type: IconSmooth
    key: walls
    additionalKeys:
    - windows
    - doors
    base: rock_border

- type: entity
  parent: BaseWall
  id: FSWallEngineer
  name: strange metal wall
  description: Nigh indestructible walls that make up the hull of an unknown ancient ship, looks like nothing you can do will penetrate the hull.
  components:
  - type: Sprite
    sprite: _FinalStand/Structures/Walls/hybrisa_engineership.rsi
    state: metal
  - type: Icon
    sprite: _FinalStand/Structures/Walls/hybrisa_engineership.rsi
    state: metal
  - type: IconSmooth
    key: walls
    additionalKeys:
    - windows
    - doors
    base: metal

