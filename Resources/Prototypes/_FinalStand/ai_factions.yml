# FinalStand faction definitions.
# FSPlayer: assigned at runtime to all spawned players so they cannot damage each other.
# Friendly to itself only — enemies (Xeno, Zombie, etc.) remain hostile.

- type: npcFaction
  id: FSPlayer
  friendly:
  - FSPlayer

# FSZombie: wave enemy faction. Hostile to FSPlayer and NanoTrasen.
# All FSZombie prototypes set NpcFactionMember to this faction.
- type: npcFaction
  id: FSZombie
  hostile:
  - FSPlayer
  - NanoTrasen
