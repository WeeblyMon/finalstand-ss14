- type: entity
  parent: BaseStructure
  id: FSWindowFrameHybrisa
  name: window frame
  description: A metal frame, waiting for a pane.
  components:
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          PartRodMetal1:
            min: 2
            max: 2
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Sprite
    sprite: _FinalStand/Structures/Windows/Frames/hybrisa_frame.rsi
    state: strata_frame0
  - type: Icon
    sprite: _FinalStand/Structures/Windows/Frames/hybrisa_frame.rsi
    state: strata_frame0
  - type: IconSmooth
    key: windows
    additionalKeys:
    - doors
    base: strata_frame
    mode: CardinalFlags

