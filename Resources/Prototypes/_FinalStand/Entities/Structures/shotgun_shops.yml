# ── Shotgun Shops ─────────────────────────────────────────────────────────────

- type: entity
  parent: FSWeaponShopBase
  id: FSWeaponShopBlunderbuss
  name: Blunderbuss
  description: A pirate's room-clearer. Single-shot, but devastating at close range. Uses .50 shotgun shells.
  components:
  - type: FSShopWeapon
    weaponProtoId: FSWeaponShotgunBlunderbuss
    price: 8000
    starterAmmoProtoId: FSBoxShotgunStandard
    starterAmmoCount: 1
    category: .50 Single-Shot Shotgun
    statDamage: 80
    statFireRate: 20
    statAccuracy: 35
    statCapacity: 10
    upgrades:
    - id: blunderbuss-damage
      name: fs-upgrade-blunderbuss-damage
      description: fs-upgrade-blunderbuss-damage-desc
      maxLevel: 5
      baseCost: 1200
      type: Damage
      valuePerLevel: 0.15
    - id: blunderbuss-reload-speed
      name: fs-upgrade-blunderbuss-reload-speed
      description: fs-upgrade-blunderbuss-reload-speed-desc
      maxLevel: 5
      baseCost: 1200
      type: ReloadSpeed
      valuePerLevel: 0.1
    - id: blunderbuss-extra-pellets
      name: fs-upgrade-blunderbuss-extra-pellets
      description: fs-upgrade-blunderbuss-extra-pellets-desc
      maxLevel: 3
      baseCost: 1200
      type: PelletCount
      valuePerLevel: 2
    - id: blunderbuss-stopping-power
      name: fs-upgrade-blunderbuss-stopping-power
      description: fs-upgrade-blunderbuss-stopping-power-desc
      maxLevel: 3
      baseCost: 2100
      type: Knockback
      valuePerLevel: 1
    - id: blunderbuss-scrapshot
      name: fs-upgrade-blunderbuss-scrapshot
      description: fs-upgrade-blunderbuss-scrapshot-desc
      maxLevel: 1
      baseCost: 2100
      type: Scrapshot
      valuePerLevel: 1
    - id: blunderbuss-dragonbreath
      name: fs-upgrade-blunderbuss-dragonbreath
      description: fs-upgrade-blunderbuss-dragonbreath-desc
      maxLevel: 1
      baseCost: 2100
      type: SetOnFire
      valuePerLevel: 1
    - id: blunderbuss-point-blank-crit
      name: fs-upgrade-blunderbuss-point-blank-crit
      description: fs-upgrade-blunderbuss-point-blank-crit-desc
      maxLevel: 1
      baseCost: 3500
      type: PointBlankCrit
      valuePerLevel: 1
  - type: Sprite
    sprite: Objects/Weapons/Guns/Shotguns/blunderbuss.rsi
    state: icon
    scale: 1,1

