# ─── Grenade Shop Structures ───────────────────────────────────────────────────

- type: entity
  parent: FSWeaponShopBase
  id: FSGrenadeShopFrag
  name: Frag Grenade Shop
  description: High-explosive fragmentation grenades. Shreds zombie clusters.
  components:
  - type: FSShopWeapon
    weaponProtoId: FSGrenadePackFrag
    price: 5000
    category: Grenades
    statDamage: 70
    statFireRate: 30
    statAccuracy: 60
    statCapacity: 30
    upgrades:
    - id: frag-blast-bonus
      name: fs-upgrade-frag-blast-bonus
      description: fs-upgrade-frag-blast-bonus-desc
      maxLevel: 3
      baseCost: 5000
      type: GrenadeBlastBonus
      valuePerLevel: 0.25
    - id: frag-extra-charges
      name: fs-upgrade-frag-extra-charges
      description: fs-upgrade-frag-extra-charges-desc
      maxLevel: 2
      baseCost: 2500
      type: GrenadeCapacity
      valuePerLevel: 2
    - id: frag-faster-regen
      name: fs-upgrade-frag-faster-regen
      description: fs-upgrade-frag-faster-regen-desc
      maxLevel: 2
      baseCost: 3000
      type: GrenadeRegen
      valuePerLevel: 2
    - id: frag-impact-fuse
      name: fs-upgrade-frag-impact-fuse
      description: fs-upgrade-frag-impact-fuse-desc
      maxLevel: 1
      baseCost: 2500
      type: GrenadeImpactFuse
      valuePerLevel: 1
    - id: frag-cluster
      name: fs-upgrade-frag-cluster
      description: fs-upgrade-frag-cluster-desc
      maxLevel: 1
      baseCost: 20000
      type: GrenadeCluster
      valuePerLevel: 1
      requiresResearch: FSOrdnanceClusterMunitions
  - type: Sprite
    sprite: _FinalStand/Objects/Weapons/Grenades/FragGrenade.rsi
    state: icon
    scale: 1,1

