- type: entity
  id: WaveAmmoBox
  parent: BaseWallmountMachine
  name: Ammo Resupply Box
  description: Interact to refill your magazines once per wave.
  components:
  - type: WaveAmmoBox
  - type: WaveAmmoBoxTag
  - type: WallMount
    arc: 360
  - type: ApcPowerReceiver
    powerLoad: 200
  - type: Sprite
    drawdepth: WallMountedItems
    sprite: _FinalStand/Structures/wave_ammo_box.rsi
    state: base
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
