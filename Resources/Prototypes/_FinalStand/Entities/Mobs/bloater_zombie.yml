# FINALSTAND: Bloater — exploding zombie that prioritises players and detonates on death.
# Spawns wave 7+, weighted at ~25% of wave composition via FSFlamethrowerSystem weighted selection.
- type: entity
  id: FSZombieBloater
  parent: FSZombieFootsoldierBase
  suffix: Bloater
  name: bloater
  components:
  - type: FSSignatureAilment
    ailments:
      Bloater: 0
    examine: fs-signature-bloater
  - type: FSMaterialDrop
    materials:
    - SheetPlasma1
    - SheetPlasma1
    - SheetPlastic1
    - SheetPlastic1
    - MaterialGunpowder
  - type: FSSpecialZombie
  - type: FSEnemyIcon
    iconPath: /Textures/_FinalStand/Mobs/ZombieIcons/boomer.png
  - type: FSBoomOnDeath
    explosionRadius: 4.5
    explosionDamage: 15
    causticDamage: 30
    injury:
      poison: true
  - type: MobThresholds
    thresholds:
      0: Alive
      150: Dead
  - type: FSEnemyValue
    killCredits: 800
  - type: Sprite
    drawdepth: Mobs
    sprite: _FinalStand/Mobs/Zombies/Bloater/fat_zombie.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: base
  - type: FSZombieVisuals
    simpleSpriteMode: true
  - type: FSDeathLoot
    drops:
    - proto: FSResearchDisk
      chance: 0.0005
