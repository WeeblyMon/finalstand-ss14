- type: entity
  parent: MiniSyringe
  id: FSChemistSyringe
  name: support syringe
  description: A reshaped syringe keyed to crew biometrics. Fired from a syringe gun to deliver chemicals to a teammate at range.
  components:
  - type: FSAllyProjectile
  - type: Solution
    solution:
      maxVol: 10
  - type: SolutionInjectOnEmbed
    transferAmount: 10
    solution: injector

- type: latheRecipe
  id: FSChemistSyringe
  result: FSChemistSyringe
  completetime: 2
  materials:
    Steel: 100
    Plastic: 50

- type: entity
  parent: BaseItem
  id: FSSyringePack
  name: syringe magazine
  description: A sealed reservoir of support serum. Slots into a syringe gun and doses every dart from the same batch. Refill it from a beaker.
  components:
  - type: Sprite
    sprite: Objects/Specific/Chemistry/syringe.rsi
    layers:
    - state: syringe_base0
    - state: syringe1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
  - type: Item
    size: Small
  - type: SolutionContainerManager
    solutions:
      pack:
        maxVol: 60
  - type: SolutionAmmoProvider
    solutionId: pack
    fireCost: 5
    proto: FSChemistSyringe
  - type: RefillableSolution
    solution: pack
    refillTime: 4
  - type: DrainableSolution
    solution: pack
  - type: ExaminableSolution
    solution: pack
  - type: SolutionContainerVisuals
    maxFillLevels: 3
    fillBaseName: minisyringe
    solutionName: pack
    changeColor: true
  - type: Appearance
  - type: Tag
    tags:
    - FSSyringeMagazine

- type: entity
  parent: FSSyringePack
  id: FSSyringePackBicaridine
  suffix: Bicaridine
  components:
  - type: SolutionContainerManager
    solutions:
      pack:
        maxVol: 60
        reagents:
        - ReagentId: Bicaridine
          Quantity: 60

- type: entity
  parent: FSSyringePack
  id: FSSyringePackKelotane
  suffix: Kelotane
  components:
  - type: SolutionContainerManager
    solutions:
      pack:
        maxVol: 60
        reagents:
        - ReagentId: Kelotane
          Quantity: 60

- type: latheRecipe
  id: FSSyringePack
  result: FSSyringePack
  completetime: 3
  materials:
    Steel: 150
    Plastic: 100
