# ── Sniper Shops ──────────────────────────────────────────────────────────────

- type: entity
  id: FSWeaponShopMosin
  parent: FSWeaponShopBase
  name: Kardashev-Mosin
  description: A legendary bolt-action relic. Hits hard and hits true. Uses .30 light rifle rounds.
  components:
  - type: FSShopWeapon
    weaponProtoId: WeaponSniperMosin
    price: 10000
    starterAmmoProtoId: FSMagazineBoxMosin
    starterAmmoCount: 1
    category: .30 Bolt-Action Sniper
    statDamage: 80
    statFireRate: 20
    statAccuracy: 85
    statCapacity: 35
    upgrades:
    - id: mosin-marksmans-rhythm
      name: Marksman's Rhythm
      description: Each consecutive hit builds a stack. Each stack adds 10% damage. Miss a shot and lose all stacks. Stacks decay after 10 seconds of not firing.
      maxLevel: 1
      baseCost: 6000
      type: MarksmansRhythm
      valuePerLevel: 1
    - id: mosin-full-auto
      name: Custom Receiver
      description: Fully automatic conversion. Enables full-auto and doubles fire rate.
      maxLevel: 1
      baseCost: 8000
      type: FullAuto
      valuePerLevel: 2
    - id: mosin-lucky-shot
      name: Lucky Shot
      description: Adds a 15% critical hit chance per level. Maxes out at 100%.
      maxLevel: 5
      baseCost: 4000
      type: CritChance
      valuePerLevel: 0.15
    - id: mosin-damage
      name: Heavy Grain
      description: Higher-grain ammunition increases damage by 50% per level.
      maxLevel: 3
      baseCost: 5500
      type: Damage
      valuePerLevel: 0.5
    - id: mosin-skull-breaker
      name: Skull Breaker
      description: Critical hits deal 50% additional damage per level.
      maxLevel: 2
      baseCost: 6000
      type: CritDamage
      valuePerLevel: 0.5
    - id: mosin-extended-mag
      name: Extended Magazine
      description: Extended internal magazine adds 5 rounds per level.
      maxLevel: 2
      baseCost: 4500
      type: MagazineSize
      valuePerLevel: 5
    - id: mosin-fast-hands
      name: Fast Hands
      description: Decreases reload time by 25% per level.
      maxLevel: 2
      baseCost: 4500
      type: ReloadSpeed
      valuePerLevel: 0.25
    - id: mosin-pierce
      name: Piercing Rounds
      description: Armor-piercing rounds pierce through enemies. Each level adds one additional target.
      maxLevel: 3
      baseCost: 6000
      type: Pierce
      valuePerLevel: 1
  - type: Sprite
    sprite: Objects/Weapons/Guns/Snipers/bolt_gun_wood.rsi
    layers:
    - state: base
    scale: 1,1

- type: entity
  id: FSWeaponShopEstoc
  parent: FSWeaponShopBase
  name: Estoc DMR
  description: Precision burst-fire DMR. Three rounds, one target, zero survivors. Uses .20 rifle magazines.
