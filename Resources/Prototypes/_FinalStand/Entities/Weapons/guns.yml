# FinalStand-specific gun overrides.

# ── Mosin ammo chain — 30 Piercing ───────────────────────────────────────────
- type: entity
  parent: CartridgeLightRifle
  id: FSCartridgeMosin
  categories: [ HideSpawnMenu ]
  components:
  - type: CartridgeAmmo
    proto: FSBulletMosin

- type: entity
  parent: MagazineBoxLightRifle
  id: FSMagazineBoxMosin
  name: ammunition box (.30 mosin)
  description: A box of heavy-grain .30 Mosin cartridges.
  components:
  - type: BallisticAmmoProvider
    proto: FSCartridgeMosin
    whitelist:
      tags:
      - CartridgeLightRifle

# ── Double Barrel (no-structural ammo chain) ──────────────────────────────────
- type: entity
  parent: BaseShellShotgun
  id: FSShellDoubleBarrel
  name: shell (.50 pellet)
  categories: [ HideSpawnMenu ]
  components:
  - type: Tag
    tags:
    - ShellShotgun
    - ShellDoubleBarrelFS
  - type: CartridgeAmmo
    proto: FSPelletDoubleBarrelSpread

- type: entity
  parent: AmmoProviderShotgunShell
  id: FSBoxDoubleBarrel
  name: ammo box (.50 DB pellet)
  description: A cardboard box of .50 shotgun shells loaded for the double barrel.
  components:
  - type: BallisticAmmoProvider
    proto: FSShellDoubleBarrel
    whitelist:
      tags:
      - ShellDoubleBarrelFS
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
    - state: lethal

- type: entity
  parent: WeaponShotgunDoubleBarreled
  id: FSWeaponDoubleBarrel
  categories: [ HideSpawnMenu ]
  components:
  - type: Tag
    tags:
    - WeaponGunShotgun
    - WeaponGunBallistic
  - type: BallisticAmmoProvider
    proto: FSShellDoubleBarrel
    whitelist:
      tags:
      - ShellDoubleBarrelFS
  - type: Crit
    baseCritChance: 0.05

- type: entity
  parent: CartridgeMagnum
  id: FSCartridgeFlintlock
  categories: [ HideSpawnMenu ]
  components:
  - type: CartridgeAmmo
    proto: FSBulletFlintlock
# FSWeaponMateba: replaces RevolverAmmoProvider with BallisticAmmoProvider so players
# can reload by dragging MagazineBoxMagnum onto the gun instead of one cartridge at a time.

- type: entity
  id: FSWeaponMateba
  parent: BaseItem
  name: Mateba
  description: A modern revolver used by Nanotrasen's elite Death Squad. Its unique trigger action enables a high fire rate with minimal muzzle flip. Loads 6 rounds of .45 magnum.
  components:
  - type: Tag
    tags:
      - Sidearm
      - AkimboEligible
      - WeaponGunBallistic
  - type: Sprite
    sprite: Objects/Weapons/Guns/Revolvers/mateba.rsi
    state: icon
  - type: Item
    size: Small
    shape:
    - 0,0,1,0
    - 0,1,0,1
    storedOffset: 0,-3
  - type: Clothing
    sprite: Objects/Weapons/Guns/Revolvers/mateba.rsi
    quickEquip: false
    slots:
    - suitStorage
    - Belt
  - type: AmmoCounter
  - type: Gun
    selectedMode: SemiAuto
    fireRate: 3
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/mateba.ogg
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: BallisticAmmoProvider
    whitelist:
      tags:
        - CartridgeMagnum
    capacity: 6
    proto: CartridgeMagnum
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/revolver_magin.ogg
    soundEject:
      path: /Audio/Weapons/Guns/MagOut/revolver_magout.ogg
  - type: StaticPrice
    price: 500
  - type: Crit
    baseCritChance: 0.15

# WeaponLauncherHydraFS: replaces RevolverAmmoProvider with BallisticAmmoProvider
# so the SmartReload system can tube-feed grenades one at a time (same fix as FSWeaponMateba).
- type: entity
  id: WeaponLauncherHydraFS
  parent: [ BaseWeaponLauncher, BaseMajorContraband ]
  name: hydra
  description: PLOOP... FSSSSSS...
  components:
  - type: Tag
    tags:
    - WeaponGunLauncher
  - type: Sprite
    sprite: Objects/Weapons/Guns/Launchers/hydra_launcher.rsi
    layers:
    - state: icon
      map: [ "enum.GunVisualLayers.Base" ]
  - type: Clothing
    sprite: Objects/Weapons/Guns/Launchers/hydra_launcher.rsi
    slots:
    - Back
    - suitStorage
  - type: Item
    size: Huge
  - type: AmmoCounter
  - type: GunRequiresWield
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - Grenade
    capacity: 6
    proto: FSLauncherGrenadeFrag
    unspawnedCount: 6
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/sfrifle_magin.ogg
    soundEject:
      path: /Audio/Weapons/Guns/MagOut/sfrifle_magout.ogg
  - type: Crit
    baseCritChance: 0.05

