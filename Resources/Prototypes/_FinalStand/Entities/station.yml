# FinalStand station: StandardNanotrasenStation without arrivals (players spawn via cryo pods), CentComm or an emergency
# shuttle (rounds end at the CCC), and without the ruins, debris and asteroid field the vanilla shuttles base scatters
# round the station, which cost server time all round.
- type: entity
  parent:
    - BaseStation
    - BaseStationNews
    - BaseStationCargo
    - BaseStationJobsSpawning
    - BaseStationRecords
    - FSBaseStationShuttles
    - BaseStationAlertLevels
    - BaseStationMagnet
    - BaseStationExpeditions
    - BaseStationSalvageJobs
    - BaseStationSiliconLawCrewsimov
    - BaseStationAllEventsEligible
    - BaseStationNanotrasen
    - BaseStationDeliveries
  id: FinalStandStation
  categories: [ HideSpawnMenu ]

# Cargo still gets its shuttle and the Automated Trading Station to fly it to.
- type: entity
  id: FSBaseStationShuttles
  abstract: true
  components:
  - type: StationCargoShuttle
    path: /Maps/Shuttles/cargo.yml
  - type: GridSpawn
    groups:
      trade: !type:GridSpawnGroup
        addComponents:
        - type: ProtectedGrid
        - type: TradeStation
        paths:
        - /Maps/Shuttles/trading_outpost.yml
