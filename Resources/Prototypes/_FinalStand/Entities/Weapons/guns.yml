# FinalStand-specific gun overrides.
# FSWeaponMateba: replaces RevolverAmmoProvider with BallisticAmmoProvider so players
# can reload by dragging MagazineBoxMagnum onto the gun instead of one cartridge at a time.

- type: entity
  id: FSWeaponMateba
  parent: BaseItem
  name: Mateba
  description: A modern revolver used by Nanotrasen's elite Death Squad. Its unique trigger action enables a high fire rate with minimal muzzle flip. Loads 6 rounds of .45 magnum.
  components:
  - type: Tag
    tags:
      - Sidearm
      - AkimboEligible
  - type: Sprite
    sprite: Objects/Weapons/Guns/Revolvers/mateba.rsi
    state: icon
  - type: Item
    size: Small
    shape:
    - 0,0,1,0
    - 0,1,0,1
    storedOffset: 0,-3
  - type: Clothing
    sprite: Objects/Weapons/Guns/Revolvers/mateba.rsi
    quickEquip: false
    slots:
    - suitStorage
    - Belt
  - type: AmmoCounter
  - type: Gun
    selectedMode: SemiAuto
    fireRate: 3
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/mateba.ogg
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: BallisticAmmoProvider
    whitelist:
      tags:
        - CartridgeMagnum
    capacity: 6
    proto: CartridgeMagnum
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/revolver_magin.ogg
    soundEject:
      path: /Audio/Weapons/Guns/MagOut/revolver_magout.ogg
  - type: StaticPrice
    price: 500

# SMG overrides — adds AkimboEligible tag for shops that offer the Akimbo upgrade.

- type: entity
  id: FSWeaponAtreides
  parent: WeaponSubMachineGunAtreides
  suffix: FinalStand
  components:
  - type: Tag
    tags:
    - Sidearm
    - AkimboEligible

- type: entity
  id: FSWeaponWt550
  parent: WeaponSubMachineGunWt550
  suffix: FinalStand
  components:
  - type: Tag
    tags:
    - Sidearm
    - AkimboEligible

- type: entity
  id: FSWeaponC20r
  parent: WeaponSubMachineGunC20r
  suffix: FinalStand
  components:
  - type: Tag
    tags:
    - Sidearm
    - AkimboEligible

# Shotgun overrides — adds AkimboEligible tag for shops that offer the Akimbo upgrade.

- type: entity
  id: FSWeaponShotgunBulldog
  parent: WeaponShotgunBulldog
  suffix: FinalStand
  components:
  - type: Tag
    tags:
    - AkimboEligible

# E-shottie override — upstream has no self-recharge; needed for the Rapid Charge upgrade to work.

- type: entity
  id: FSWeaponEnergyShotgun
  parent: WeaponEnergyShotgun
  suffix: FinalStand
  components:
  - type: BatterySelfRecharger
    autoRechargeRate: 25
    autoRechargePauseTime: 3

# Laser Carbine override — adds self-recharge and spread for upgrade interactions.

- type: entity
  id: FSWeaponLaserCarbine
  parent: WeaponLaserCarbine
  suffix: FinalStand
  components:
  - type: BatterySelfRecharger
    autoRechargeRate: 50
    autoRechargePauseTime: 1.5
  - type: Gun
    minAngle: 0
    maxAngle: 8
    angleIncrease: 1.5

# Pulse Rifle override — perfectly accurate, semi-auto by default; FullAuto upgrade unlocks full auto.

- type: entity
  id: FSWeaponPulseRifle
  parent: WeaponPulseRifle
  suffix: FinalStand
  components:
  - type: BatterySelfRecharger
    autoRechargeRate: 200
    autoRechargePauseTime: 2
  - type: Gun
    minAngle: 0
    maxAngle: 0
    angleIncrease: 0
  - type: BatteryAmmoProvider
    proto: FSPulse
    fireCost: 100
