      valuePerLevel: 1
    - id: hristov-pierce
      name: Piercing Rounds
      description: Your shots pierce through enemies. Each level adds one additional target.
      maxLevel: 5
      baseCost: 10000
      type: Pierce
      valuePerLevel: 1
    - id: hristov-hv-rounds
