- type: entity
  abstract: true
  id: FSWeaponShopBase
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.2,-0.2,0.2,0.2"
        density: 100
        mask:
        - ItemMask
        layer:
        - WallLayer
  - type: Sprite
    drawdepth: SmallObjects
  - type: ActivatableUI
    key: enum.FSShopWeaponUiKey.Key
  - type: UserInterface
    interfaces:
      enum.FSShopWeaponUiKey.Key:
        type: FSShopWeaponBoundUserInterface

- type: entity
  parent: FSWeaponShopBase
  id: FSWeaponShopViper
  name: Viper
  description: A Syndicate-modified 9mm pistol. Semi-auto and full-auto.
  components:
  - type: FSShopWeapon
    weaponProtoId: WeaponPistolViper
    price: 500
    starterAmmoProtoId: MagazinePistolHighCapacity
    starterAmmoCount: 2
    category: 9mm Semi/Full-Auto Pistol
    statDamage: 35
    statFireRate: 80
    statAccuracy: 55
    statCapacity: 75
    upgrades:
    - id: viper-hair-trigger
      name: fs-upgrade-viper-hair-trigger
      description: fs-upgrade-viper-hair-trigger-desc
      maxLevel: 5
      baseCost: 450
      type: FireRate
      valuePerLevel: 1.5
    - id: viper-extended-mag
      name: fs-upgrade-viper-extended-mag
      description: fs-upgrade-viper-extended-mag-desc
      maxLevel: 5
      baseCost: 450
      type: MagazineSize
      valuePerLevel: 5
    - id: viper-recoil-pad
