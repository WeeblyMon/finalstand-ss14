  - type: Organ
  - type: Sprite
    layers:
    - state: eyeball-l
    - state: eyeball-r
- type: entity
  parent: OrganBase
  id: OrganBaseTongue
  name: tongue
  abstract: true
  components:
  - type: GibbableOrgan
  - type: Organ
  - type: Sprite
    layers:
    - state: tongue

- type: entity
  parent: OrganBase
  id: OrganBaseAppendix
  name: appendix
  abstract: true
  components:
  - type: GibbableOrgan
  - type: Organ
  - type: Sprite
    layers:
    - state: appendix

- type: entity
  parent: OrganBase
  id: OrganBaseEars
  name: ears
  abstract: true
  components:
  - type: GibbableOrgan
  - type: Organ
  - type: Sprite
    layers:
    - state: ears

- type: entity
  parent: OrganBase
  id: OrganBaseLungs
  name: lungs
  abstract: true
  components:
  - type: GibbableOrgan
  - type: Organ
  - type: Lung
  - type: Metabolizer
    stages: [ Respiration ]
  - type: Sprite
    layers:
    - state: lung-l
    - state: lung-r
  - type: Item
    heldPrefix: lungs

- type: entity
  parent: Solution
  id: SolutionLungGas # TODO: Metabolize directly from gasses :(
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    id: Lung
    solution:
      maxVol: 100.0
      canReact: false

- type: entity
  parent: OrganBase
  id: OrganBaseHeart
  name: heart
  abstract: true
  components:
  - type: GibbableOrgan
  - type: Organ
  - type: Sprite
    layers:
    - state: heart-on
  - type: Metabolizer
    maxReagents: 2
    stages: [ Bloodstream ]

- type: entity
  parent: OrganBase
  id: OrganBaseStomach
  name: stomach
  abstract: true
  components:
  - type: GibbableOrgan
  - type: Organ
  - type: Stomach
  - type: SolutionManager
    solutions:
    - SolutionStomach
  - type: Metabolizer
    maxReagents: 3
    stages: [ Digestion ]
  - type: Sprite
    layers:
    - state: stomach
  - type: Item
    heldPrefix: stomach

- type: entity
  parent: Solution
  id: SolutionStomach
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    id: stomach
    solution:
      maxVol: 150 # 1.25 liters which is average for a human

- type: entity
  parent: OrganBase
  id: OrganBaseLiver
  name: liver
  abstract: true
  components:
  - type: GibbableOrgan
  - type: Organ
  - type: Sprite
    layers:
    - state: liver
  - type: Item
    heldPrefix: liver
  - type: Metabolizer
    maxReagents: 1
    stages: [ Metabolites ]

- type: entity
  parent: OrganBase
  id: OrganBaseKidneys
  name: kidneys
  abstract: true
  components:
  - type: GibbableOrgan
  - type: Organ
  - type: Sprite
    layers:
      - state: kidney-l
      - state: kidney-r
  - type: Item
    heldPrefix: kidneys
  - type: Metabolizer
    maxReagents: 5

- type: entity
  id: OrganSpriteHumanInternal
  abstract: true
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/organs.rsi

- type: entity
  id: OrganBaseHeadSexed
  abstract: true
  components:
