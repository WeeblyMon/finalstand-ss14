# ── Fire Axe Shop ────────────────────────────────────────────────────────────
# Heavy chopper. Big damage + fire synergies (Axtinguish / Fireman / Fire Man).

- type: entity
  parent: FSWeaponShopBase
  id: FSWeaponShopFireAxe
  name: Fire Axe
  description: Truly, the weapon of a madman. Fight fire with steel.
  components:
  - type: FSShopWeapon
    weaponProtoId: FireAxe
    price: 7000
    category: fs-weapon-shop-category-melee-heavy
    statDamage: 55
    statFireRate: 30
    statAccuracy: 0
    statCapacity: 0
    upgrades:
    - id: fireaxe-sharpened
      name: fs-upgrade-fireaxe-sharpened
      description: fs-upgrade-fireaxe-sharpened-desc
      maxLevel: 2
      baseCost: 10500
      type: Damage
      valuePerLevel: 1.0
    - id: fireaxe-axtinguish
      name: fs-upgrade-fireaxe-axtinguish
      description: fs-upgrade-fireaxe-axtinguish-desc
      maxLevel: 1
      baseCost: 10000
      type: CritVsBurning
      valuePerLevel: 1
    - id: fireaxe-fireman
      name: fs-upgrade-fireaxe-fireman
      description: fs-upgrade-fireaxe-fireman-desc
      maxLevel: 1
      baseCost: 8000
      type: FireResist
      valuePerLevel: 1.0
    - id: fireaxe-fire-man
      name: fs-upgrade-fireaxe-fire-man
      description: fs-upgrade-fireaxe-fire-man-desc
      maxLevel: 1
      baseCost: 10000
      type: WhileBurningBuff
      valuePerLevel: 1
  - type: Sprite
    sprite: Objects/Weapons/Melee/fireaxe.rsi
    state: icon
    scale: 1,1
