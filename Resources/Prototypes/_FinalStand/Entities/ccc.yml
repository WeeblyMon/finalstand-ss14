- type: entity
  id: FinalStandCCC
  name: Central Command Console
  description: The heart of the station. Defend it at all costs.
  placement:
    mode: SnapgridCenter
  components:
  - type: FinalStandCCC
  - type: FinalStandCCCTag
  - type: FSPlayerDamageImmune
  - type: FSBreachCostOverride
    cost: 999  # FINALSTAND: exclude CCC from breach target selection. MobState filter already handles this but belt-and-suspenders.
  - type: ReadyCheck
  - type: AccessReader
    access:
    - [ Captain ]
  - type: StationMap
    showLocation: false
  - type: PowerMonitoringConsole
  - type: PowerMonitoringCableNetworks
  - type: ActivatableUI
    key: enum.CCCUiKey.Key
  - type: UserInterface
    interfaces:
      enum.CCCUiKey.Key:
        type: CCCBoundUserInterface
  - type: Transform
    anchored: true
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.0,-1.0,1.0,1.0"
        density: 100
        mask:
        - LargeMobMask
        layer:
        - WallLayer
  - type: Sprite
    drawdepth: Mobs
    sprite: _FinalStand/Structures/ccc.rsi
    layers:
    - state: base
      scale: 0.5, 0.5
  - type: MobState
    allowedStates:
    - Alive
  - type: NpcFactionMember
    factions:
    - NanoTrasen
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 2000 # FINALSTAND: 4x vanilla 500 — TODO(finalstand): tune CCC health during playtests
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
