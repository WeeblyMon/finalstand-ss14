- type: fsAilmentRules
  id: Default
  injuryFloor: 5
  majorBleedLevel: 2
  broken: FSAilmentBroken
  burned: FSAilmentBurned
  bleedDamage:
    types:
      Bloodloss: 0.5
  downDrain:
    types:
      Asphyxiation: 1
  meters:
    Bleed:
      slot: Bleeding
      drainPerSecond: 30
      injury:
        bleed: 1
    Burn:
      slot: Burn
      drainPerSecond: 10
      injury:
        burn: true
  slots:
    Bleeding:
      label: fs-ailment-bleeding
      name: fs-ailment-bleeding
      advice: fs-forecast-advice-bleeding
      pip:
        sprite: _FinalStand/Interface/Ailments/pips.rsi
        state: drop
      need: fs-need-gauze
      effect: fs-ailment-bleeding-effect
      fixHint: fs-ailment-bleeding-fix
      fixIcon:
        sprite: Objects/Specific/Medical/medical.rsi
        state: gauze
      sound:
        path: /Audio/Effects/Fluids/blood1.ogg
      fixed: true
    Bone:
      label: fs-slot-bone
      name: fs-ailment-broken
      advice: fs-forecast-advice-bone
      pip:
        sprite: _FinalStand/Interface/Ailments/pips.rsi
        state: bone
      need: fs-need-stapler
      fixIcon:
        sprite: _FinalStand/Objects/Medical/splint.rsi
        state: icon
      sound:
        collection: FSMeleeBoneBreak
      fixed: true
    Burn:
      label: fs-slot-burn
      name: fs-ailment-burned
      advice: fs-forecast-advice-burn
      pip:
        sprite: _FinalStand/Interface/Ailments/pips.rsi
        state: flame
      need: fs-need-ointment
      fixIcon:
        sprite: Objects/Specific/Medical/medical.rsi
        state: ointment
      sound:
        path: /Audio/Effects/sizzle.ogg
      fixed: true
    Bloater:
      label: fs-slot-bloat
      name: fs-ailment-soaked
      advice: fs-forecast-advice-bloat
      pip:
        sprite: _FinalStand/Interface/Ailments/pips.rsi
        state: drop
      sound:
        path: /Audio/Effects/Fluids/splat.ogg
  clearedSound:
    path: /Audio/Effects/chime.ogg
    params:
      volume: -4

- type: entity
  parent: MobStatusEffectDebuff
  id: FSAilmentBase
  abstract: true
  components:
  - type: StatusEffect
    whitelist:
      components:
      - MobState
      - FSAilmentState
      requireAll: true

- type: entity
  parent: FSAilmentBase
  id: FSAilmentBroken
  name: broken bone
  components:
  - type: FSAilment
    slot: Bone
    name: fs-ailment-broken
    examine: fs-ailment-broken-examine
    effect: fs-ailment-broken-effect
    fixHint: fs-ailment-broken-fix
    duration: 30
    tier: Major
    becomesOnExpire: FSAilmentSplinted
  - type: MovementModStatusEffect
    walkSpeedModifier: 0.65
    sprintSpeedModifier: 0.65

- type: entity
  parent: FSAilmentBase
  id: FSAilmentSplinted
  name: splinted bone
  components:
  - type: FSAilment
    slot: Bone
    name: fs-ailment-splinted
    examine: fs-ailment-splinted-examine
    effect: fs-ailment-splinted-effect
    fixHint: fs-ailment-splinted-fix
    duration: 90
    tier: Minor
  - type: MovementModStatusEffect
    walkSpeedModifier: 0.85
    sprintSpeedModifier: 0.85

- type: entity
  parent: FSAilmentBase
  id: FSAilmentSplintedFieldOps
  name: splinted bone
  components:
  - type: FSAilment
    slot: Bone
    name: fs-ailment-splinted
    examine: fs-ailment-splinted-examine
    effect: fs-ailment-splinted-fieldops-effect
    fixHint: fs-ailment-splinted-fix
    duration: 90

- type: entity
  parent: FSAilmentBase
  id: FSAilmentBurned
  name: burns
  components:
  - type: FSAilment
    slot: Burn
    name: fs-ailment-burned
    examine: fs-ailment-burned-examine
    effect: fs-ailment-burned-effect
    fixHint: fs-ailment-burned-fix
    duration: 45
    tier: Minor
    blocksRegen: true
    incomingHealScale: 0.5

- type: entity
  parent: FSAilmentBase
  id: FSAilmentSoaked
  name: soaked
  components:
  - type: FSAilment
    slot: Bloater
    name: fs-ailment-soaked
    examine: fs-ailment-soaked-examine
    effect: fs-ailment-soaked-effect
    duration: 5
  - type: MovementModStatusEffect
    walkSpeedModifier: 0.775
    sprintSpeedModifier: 0.775
  - type: DamageModifierStatusEffect
    modifiers:
      coefficients:
        Asphyxiation: 2
        Bloodloss: 2
        Blunt: 2
        Caustic: 2
        Cellular: 2
        Cold: 2
        Heat: 2
        Holy: 2
        Ion: 2
        Piercing: 2
        Poison: 2
        Radiation: 2
        Shock: 2
        Slash: 2
        Structural: 2

- type: entity
  parent: FSAilmentBase
  id: FSWardClotted
  name: clotted
  components:
  - type: FSAilmentWard
    blocks: Bleeding
    name: fs-ward-clotted
    effect: fs-ward-clotted-effect
    duration: 20

- type: entity
  parent: FSAilmentBase
  id: FSWardBraced
  name: braced
  components:
  - type: FSAilmentWard
    blocks: Bone
    name: fs-ward-braced
    effect: fs-ward-braced-effect
    duration: 60

- type: entity
  parent: FSAilmentBase
  id: FSWardCharred
  name: warded
  components:
  - type: FSAilmentWard
    blocks: Burn
    name: fs-ward-warded
    effect: fs-ward-warded-effect
    duration: 45
