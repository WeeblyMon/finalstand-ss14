- type: body
  id: Vox
  name: "vox"
  root: chest
  slots:
    head:
      part: HeadVox
      connections:
      - chest
      organs:
        brain: OrganHumanBrain
        eyes: OrganHumanEyes
        visualHead: OrganVoxVisualHead
        visualEyes: OrganVoxVisualEyes
    chest:
      part: ChestVox
      connections:
      - right arm
      - left arm
      - groin
      - head # Shitmed
      organs:
        heart: OrganVoxHeart
        lungs: OrganVoxLungs
        visualChest: OrganVoxVisualChest
    groin:
      part: GroinVox
      connections:
      - right leg
      - left leg
      organs:
        stomach: OrganVoxStomach
        liver: OrganHumanLiver
        kidneys: OrganHumanKidneys
        visualGroin: OrganVoxVisualGroin
    right arm:
      part: RightArmVox
      connections:
      - right hand
      organs:
        visualRArm: OrganVoxVisualRArm
    left arm:
      part: LeftArmVox
      connections:
      - left hand
      organs:
        visualLArm: OrganVoxVisualLArm
    right hand:
      part: RightHandVox
      organs:
        visualRHand: OrganVoxVisualRHand
    left hand:
      part: LeftHandVox
      organs:
        visualLHand: OrganVoxVisualLHand
    right leg:
      part: RightLegVox
      connections:
      - right foot
      organs:
        visualRLeg: OrganVoxVisualRLeg
    left leg:
      part: LeftLegVox
      connections:
      - left foot
      organs:
        visualLLeg: OrganVoxVisualLLeg
    right foot:
      part: RightFootVox
      organs:
        visualRFoot: OrganVoxVisualRFoot
    left foot:
      part: LeftFootVox
      organs:
        visualLFoot: OrganVoxVisualLFoot
