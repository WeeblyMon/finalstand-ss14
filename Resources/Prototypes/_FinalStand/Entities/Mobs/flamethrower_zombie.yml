# FINALSTAND: Flamethrower zombie — stops moving and sprays a fire cone when players are in range.
# Spawns wave 9+, weighted at ~12.5% of wave composition via weighted selection.
- type: entity
  parent: FSZombieFootsoldierBase
  id: FSZombieFlamethrower
  name: flamethrower zombie
  suffix: Flamethrower
  description: A corpse rigged with a flamethrower. It plants its feet, then hoses everything in front of it with fire.
  components:
  - type: FSMaterialDrop
    materials:
    - SheetPlasma1
    - SheetPlasma1
    - SheetPlastic1
    - SheetPlastic1
    - MaterialGunpowder
  - type: FSSpecialZombie
  - type: FSEnemyIcon
    iconPath: /Textures/_FinalStand/Mobs/ZombieIcons/flamethrowerzombie.png
  - type: FSFlamethrower
    flameRange: 8
    fireProjectileSpeed: 14
    fireStacks: 0.3
    attackCooldown: 3
    trackingRotationSpeed: 4.5
  - type: MobThresholds
    thresholds:
      0: Alive
      650: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.3    # FSZombieNormal (2.0) + 15%
    baseSprintSpeed: 2.9   # FSZombieNormal (2.5) + 15%
  - type: FSEnemyValue
    killCredits: 1100
  - type: Sprite
    drawdepth: Mobs
    sprite: _FinalStand/Mobs/Zombies/Flamethrower/flamethrower_zombie.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: base
  - type: FSZombieVisuals
    simpleSpriteMode: true
  - type: PointLight
    enabled: false
    color: "#FF5500"
    radius: 5.0
    energy: 8.0
    softness: 1.0
  - type: FSDeathLoot
    drops:
    - proto: FSResearchDisk
      chance: 0.0005
