# Final Stand sprint dust VFX entity prototypes.
# Ported from Goob-Station Resources/Prototypes/_Goobstation/Sprinting/sprinting.yml
# Sprite paths remapped from _Goobstation/ → _FinalStand/.

- type: entity
  id: SprintAnimation
  categories: [ HideSpawnMenu ]
  name: Dust cloud
  description: Whoa, watch out!
  components:
  - type: Sprite
    drawdepth: WallMountedItems
    sprite: _FinalStand/Effects/sprinting.rsi
    layers:
    - state: sprint_cloud
  - type: TimedDespawn
    lifetime: 0.48
  - type: Tag
    tags:
    - HideContextMenu
  - type: AnimationPlayer

