name: "Labels: Size"
permissions:
  contents: read
  pull-requests: write
  # size-label-action creates the XS/S/M/L/XL labels when they are missing, and label
  # creation goes through the issues API — without this it 403s before doing anything.
  issues: write

on: pull_request_target
jobs:
  size-label:
    runs-on: ubuntu-latest
    steps:
      - name: size-label
        uses: "pascalgn/size-label-action@v0.5.5"
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        with:
          # Custom size configuration
          sizes: >
            {
              "0": "XS",
              "10": "S",
              "100": "M",
              "1000": "L",
              "5000": "XL"
            }
