# ── Folding doors ─────────────────────────────────────────────────────────────
- type: entity
  parent: FSBarricadeBase
  id: FSBarricadeMetalDoor
  name: folding metal barricade
  description: A folding metal barricade weaker than the non-folding counterpart. Able to be opened and closed at a moment's notice.
  components:
  - type: Sprite
    sprite: _FinalStand/Structures/Walls/Barricades/barricade.rsi
    drawdepth: WallTops
    layers:
    - state: folding_metal
      map: [ "enum.DoorVisualLayers.Base" ]
  - type: DamageVisuals
    thresholds: [4, 8, 12]
    damageDivisor: 25
    trackAllDamage: true
    damageOverlay:
      sprite: _FinalStand/Structures/Walls/Barricades/folding_metal_cracks.rsi
  - type: AnimationPlayer
  - type: UseDelay
    delay: 0.3
  - type: MeleeSound
    soundGroups:
      Brute:
        path: /Audio/_FinalStand/Structures/metalhit.ogg
  - type: Door
    openSpriteState: folding_metal_closed
    closedSpriteState: folding_metal
    openingSpriteState: folding_metal_closed
    closingSpriteState: folding_metal
    canPry: false
    occludes: false
    changeAirtight: false
    bumpOpen: false
    clickOpen: true
    canCrush: false
    closeTimeOne: 0
    closeTimeTwo: 0
    openTimeOne: 0
    openTimeTwo: 0
    openingAnimationTime: 0
    closingAnimationTime: 0
    performCollisionCheck: false
    openSound:
      path: /Audio/Items/ratchet.ogg
    closeSound:
      path: /Audio/Items/ratchet.ogg
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 3
            max: 3
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: FSBarricadeMetalDoor
  id: FSBarricadePlasteelDoor
  name: folding plasteel barricade
  description: A tough folding plasteel barricade stronger than its metal counterpart. Can be closed and opened at a moment's notice.
  components:
  - type: Sprite
    sprite: _FinalStand/Structures/Walls/Barricades/barricade.rsi
    drawdepth: WallTops
    layers:
    - state: folding_plasteel
      map: [ "enum.DoorVisualLayers.Base" ]
  - type: DamageVisuals
    thresholds: [4, 8, 12]
    damageDivisor: 50
    trackAllDamage: true
    damageOverlay:
      sprite: _FinalStand/Structures/Walls/Barricades/folding_plasteel_cracks.rsi
  - type: Door
    openSpriteState: folding_plasteel_closed
    closedSpriteState: folding_plasteel
    openingSpriteState: folding_plasteel_closed
    closingSpriteState: folding_plasteel
    canPry: false
    occludes: false
    changeAirtight: false
    bumpOpen: false
    clickOpen: true
    canCrush: false
    closeTimeOne: 0
    closeTimeTwo: 0
    openTimeOne: 0
    openTimeTwo: 0
    openingAnimationTime: 0
    closingAnimationTime: 0
    performCollisionCheck: false
    openSound:
      path: /Audio/Items/ratchet.ogg
    closeSound:
      path: /Audio/Items/ratchet.ogg
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 800
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetPlasteel1:
            min: 4
            max: 4
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

