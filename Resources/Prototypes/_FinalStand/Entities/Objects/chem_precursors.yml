- type: entity
  abstract: true
  parent: BaseItem
  id: FSPrecursorBottle
  components:
  - type: Item
    size: Tiny
  - type: DrainableSolution
    solution: drink
  - type: ExaminableSolution
    solution: drink
  - type: SolutionTransfer
    transferAmount: 30
    maxTransferAmount: 30
    canReceive: false

- type: entity
  parent: FSPrecursorBottle
  id: FSCatalystBottle
  name: etching catalyst
  description: A sealed vial of corrosive catalyst. The base for armour-etching chemistry.
  components:
  - type: Sprite
    sprite: Objects/Specific/Chemistry/bottle.rsi
    layers:
    - state: bottle-2
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 30
        reagents:
        - ReagentId: FSCatalystSalt
          Quantity: 30

- type: latheRecipe
  id: FSCatalystBottle
  result: FSCatalystBottle
  completetime: 3
  materials:
    Steel: 100
    Plastic: 100
    Silver: 50

