- type: body
  id: Slime
  name: "slime"
  root: chest
  slots:
    head:
      part: HeadSlime
      connections:
      - chest
      organs:
        visualHead: OrganSlimeVisualHead
    chest:
      part: ChestSlime
      connections:
      - right arm
      - left arm
      - groin
      - head # Shitmed
      organs:
        lungs: OrganSlimeLungs
        visualChest: OrganSlimeVisualChest
    groin:
      part: GroinSlime
      organs:
        core: SentientSlimeCore
        visualGroin: OrganSlimeVisualGroin
      connections:
      - right leg
      - left leg
    right arm:
      part: RightArmSlime
      connections:
      - right hand
      organs:
        visualRArm: OrganSlimeVisualRArm
    left arm:
      part: LeftArmSlime
      connections:
      - left hand
      organs:
        visualLArm: OrganSlimeVisualLArm
    right hand:
      part: RightHandSlime
      organs:
        visualRHand: OrganSlimeVisualRHand
    left hand:
      part: LeftHandSlime
      organs:
        visualLHand: OrganSlimeVisualLHand
    right leg:
      part: RightLegSlime
      connections:
      - right foot
      organs:
        visualRLeg: OrganSlimeVisualRLeg
    left leg:
      part: LeftLegSlime
      connections:
      - left foot
      organs:
        visualLLeg: OrganSlimeVisualLLeg
    right foot:
      part: RightFootSlime
      organs:
        visualRFoot: OrganSlimeVisualRFoot
    left foot:
      part: LeftFootSlime
      organs:
        visualLFoot: OrganSlimeVisualLFoot
