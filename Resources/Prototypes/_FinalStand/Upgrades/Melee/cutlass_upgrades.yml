# ── Cutlass Shop ─────────────────────────────────────────────────────────────
# Pirate sabre. Slash-and-stamina playstyle, plus flintlock crit synergy via Pirate.

- type: entity
  parent: FSWeaponShopBase
  id: FSWeaponShopCutlass
  name: Cutlass
  description: A wickedly curved blade. Pairs well with flintlocks and a sense of dread.
  components:
  - type: FSShopWeapon
    weaponProtoId: FSWeaponCutlass
    price: 4000
    category: fs-weapon-shop-category-melee-sword
    statDamage: 40
    statFireRate: 55
    statAccuracy: 0
    statCapacity: 0
    upgrades:
    - id: cutlass-quick-slash
      name: fs-upgrade-cutlass-quick-slash
      description: fs-upgrade-cutlass-quick-slash-desc
      maxLevel: 3
      baseCost: 6000
      type: AttackSpeed
      valuePerLevel: 0.2
    - id: cutlass-sharpened
      name: fs-upgrade-cutlass-sharpened
      description: fs-upgrade-cutlass-sharpened-desc
      maxLevel: 3
      baseCost: 4750
      type: Damage
      valuePerLevel: 1.45
    - id: cutlass-plunder
      name: fs-upgrade-cutlass-plunder
      description: fs-upgrade-cutlass-plunder-desc
      maxLevel: 1
      baseCost: 5000
      type: MoneyGainBonusPercent
      valuePerLevel: 0.25
    - id: cutlass-hyper-saber
      name: fs-upgrade-cutlass-hyper-saber
      description: fs-upgrade-cutlass-hyper-saber-desc
      maxLevel: 1
      baseCost: 5000
      type: StaminaSteal
      valuePerLevel: 15
    - id: cutlass-swashbuckler
      name: fs-upgrade-cutlass-swashbuckler
      description: fs-upgrade-cutlass-swashbuckler-desc
      maxLevel: 3
      baseCost: 4000
      type: CritChance
      valuePerLevel: 0.1
    - id: cutlass-pirate
      name: fs-upgrade-cutlass-pirate
      description: fs-upgrade-cutlass-pirate-desc
      maxLevel: 1
      baseCost: 6500
      type: FlintlockCritSynergy
      valuePerLevel: 5
      spawnProtoId: WeaponPistolFlintlock
      spawnCountPerLevel: 1
    # ── Flintlock upgrades (hidden until Pirate is bought; applied to the held Flintlock) ─────
    # Recovered from the removed FSWeaponShopFlintlock (commit 34e27bcbd9).
    - id: flintlock-extra-load
      name: fs-upgrade-flintlock-extra-load
      description: fs-upgrade-flintlock-extra-load-desc
      maxLevel: 5
      baseCost: 100
      type: MagazineSize
      valuePerLevel: 1
      requiresUpgrade: cutlass-pirate
      targetWeaponProtoId: WeaponPistolFlintlock
    - id: flintlock-ball-and-powder
      name: fs-upgrade-flintlock-ball-and-powder
      description: fs-upgrade-flintlock-ball-and-powder-desc
      maxLevel: 5
      baseCost: 100
      type: SpawnItem
      spawnProtoId: MagazineBoxMagnum
      spawnCountPerLevel: 1
      requiresUpgrade: cutlass-pirate
      targetWeaponProtoId: WeaponPistolFlintlock
    - id: flintlock-steady-hand
      name: fs-upgrade-flintlock-steady-hand
      description: fs-upgrade-flintlock-steady-hand-desc
      maxLevel: 5
      baseCost: 100
      type: Accuracy
      valuePerLevel: 0.5
      requiresUpgrade: cutlass-pirate
      targetWeaponProtoId: WeaponPistolFlintlock
    - id: flintlock-heavier-load
      name: fs-upgrade-flintlock-heavier-load
      description: fs-upgrade-flintlock-heavier-load-desc
      maxLevel: 3
      baseCost: 250
      type: Damage
      valuePerLevel: 0.25
      requiresUpgrade: cutlass-pirate
      targetWeaponProtoId: WeaponPistolFlintlock
    - id: flintlock-explosive-shot
      name: fs-upgrade-flintlock-explosive-shot
      description: fs-upgrade-flintlock-explosive-shot-desc
      maxLevel: 3
      baseCost: 150
      type: ExplosiveShot
      valuePerLevel: 1
      requiresUpgrade: cutlass-pirate
      targetWeaponProtoId: WeaponPistolFlintlock
    - id: flintlock-payday
      name: fs-upgrade-flintlock-payday
      description: fs-upgrade-flintlock-payday-desc
      maxLevel: 4
      baseCost: 100
      type: MoneyGainBonus
      valuePerLevel: 50
      requiresUpgrade: cutlass-pirate
      targetWeaponProtoId: WeaponPistolFlintlock
  - type: Sprite
    sprite: Objects/Weapons/Melee/cutlass.rsi
    state: icon
    scale: 1,1
