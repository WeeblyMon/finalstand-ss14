# No requiresResearch - the Harvester is the RP source that feeds the research tree itself.
- type: entity
  parent: FSWeaponShopBase
  id: FSWeaponShopHarvester
  name: Harvester
  description: An experimental purple energy weapon that harvests residual bio-radiation from its targets, feeding it back to the station's research systems.
  components:
  - type: FSShopWeapon
    weaponProtoId: WeaponHarvesterFS
    weaponProtoIdAliases:
    - WeaponXrayCannonFS
    requiresScience: true
    price: 500
    category: fs-weapon-shop-category-sustained-fire-bio-radiation-beam
    statDamage: 35
    statFireRate: 100
    statAccuracy: 90
    statCapacity: 80
    upgrades:
    - id: harvester-damage
      name: fs-upgrade-harvester-damage
      description: fs-upgrade-harvester-damage-desc
      maxLevel: 5
      baseCost: 12000
      type: Damage
      valuePerLevel: 0.15
    - id: harvester-xray-conversion
      name: fs-upgrade-harvester-xray-conversion
      description: fs-upgrade-harvester-xray-conversion-desc
      maxLevel: 1
      baseCost: 60000
      targetWeaponProtoId: WeaponHarvesterFS
      type: ConvertWeapon
      spawnProtoId: WeaponXrayCannonFS
      requiresResearch: FSOrdnanceXrayCannon
    - id: xray-self-charge
      name: fs-upgrade-xray-self-charge
      description: fs-upgrade-xray-self-charge-desc
      maxLevel: 3
      baseCost: 11000
      targetWeaponProtoId: WeaponXrayCannonFS
      requiresResearch: FSOrdnanceXrayCannon
      type: SelfChargeSpeed
      valuePerLevel: 3.2
    - id: xray-fire-rate
      name: fs-upgrade-xray-fire-rate
      description: fs-upgrade-xray-fire-rate-desc
      maxLevel: 3
      baseCost: 11000
      targetWeaponProtoId: WeaponXrayCannonFS
      requiresResearch: FSOrdnanceXrayCannon
      type: FireRate
      valuePerLevel: 0.5
    - id: xray-damage
      name: fs-upgrade-xray-damage
      description: fs-upgrade-xray-damage-desc
      maxLevel: 4
      baseCost: 12000
      targetWeaponProtoId: WeaponXrayCannonFS
      requiresResearch: FSOrdnanceXrayCannon
      type: Damage
      valuePerLevel: 0.2
    - id: xray-pierce
      name: fs-upgrade-xray-pierce
      description: fs-upgrade-xray-pierce-desc
      maxLevel: 3
      baseCost: 13000
      targetWeaponProtoId: WeaponXrayCannonFS
      requiresResearch: FSOrdnanceXrayCannon
      type: Pierce
      valuePerLevel: 1
    - id: xray-dot
      name: fs-upgrade-xray-dot
      description: fs-upgrade-xray-dot-desc
      maxLevel: 3
      baseCost: 16000
      targetWeaponProtoId: WeaponXrayCannonFS
      requiresResearch: FSOrdnanceXrayCannon
      type: RadiationCoating
      valuePerLevel: 1
  - type: Sprite
    sprite: _FinalStand/Objects/Weapons/Guns/Harvester.rsi
    state: icon
    scale: 1,1
