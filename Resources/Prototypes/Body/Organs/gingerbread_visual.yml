# Gingerbread has no species markings group, so VisualOrganMarkings uses group: None
# to satisfy the required field while rendering no markings.

- type: entity
  id: OrganGingerbreadVisualHead
  parent: OrganBaseHead
  name: head
  categories: [ HideSpawnMenu ]
  components:
  - type: VisualOrgan
    data:
      sprite: Mobs/Species/Gingerbread/parts.rsi
      state: head_m
    sexStateOverrides:
      Male: head_m
      Female: head_f
  - type: VisualOrganMarkings
    hideableLayers:
    - enum.HumanoidVisualLayers.Hair
    markingData:
      group: None
      layers:
      - Head
      - Hair
      - FacialHair
      - Snout
      - SnoutCover
      - HeadSide
      - HeadTop

