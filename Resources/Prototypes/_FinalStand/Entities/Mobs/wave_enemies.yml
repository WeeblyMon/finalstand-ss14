# ── Non-zombie wave enemies ──────────────────────────────────────────────────
# NavPry: false — do not pry airlocks (would let them open locked doors).
# NavSmash: true — pathfinder routes through walls; FSBreachTargetSystem handles smash targeting.
# No Prying component — these mobs smash obstacles, they do not pry.

- type: entity
  id: FSMobXeno
  parent: MobXeno
  suffix: FinalStand
  components:
  - type: HTN
    rootTask:
      task: FinalStandEnemyCompound
    blackboard:
