# ── FSZombie types ──────────────────────────────────────────────────────────

- type: entity
  id: FSZombieBase
  parent: SimpleSpaceMobBase
  abstract: true
  suffix: FinalStand
  components:
  - type: InputMover
  - type: MobMover
  - type: HTN
    rootTask:
      task: FinalStandEnemyCompound
    blackboard:
      NavPry: !type:Bool
        false
      NavSmash: !type:Bool
        true
  - type: NpcFactionMember
    factions:
    - FSZombie
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    animation: WeaponArcClaw
    soundHit:
      path: /Audio/Weapons/Xeno/alien_claw_flesh3.ogg
    damage:
      types:
        Slash: 10
  - type: Sprite
    drawdepth: Mobs
    sprite: _FinalStand/Mobs/Zombies/zombie.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: base
  - type: FSZombieVisuals
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.25
        density: 235
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Blood
        Quantity: 20
  - type: MovementIgnoreGravity
  - type: Stamina
    baseCritThreshold: 100
    stunTime: 0.3
    decay: 45
  - type: WaveSpawnedTag

- type: entity
  id: FSZombieNormal
  parent: FSZombieBase
  suffix: Normal
  name: zombie
  components:
  - type: MobThresholds
    thresholds:
      0: Alive
      75: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.0
    baseSprintSpeed: 2.5
  - type: FSEnemyValue
    killCredits: 100

- type: entity
  id: FSZombieRunner
  parent: FSZombieNormal
  suffix: Runner
  name: runner zombie
  components:
  - type: Sprite
    color: "#dde8ff"
  - type: MobThresholds
    thresholds:
      0: Alive
      40: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 4.5
    baseSprintSpeed: 5.5
  - type: FSEnemyValue
    killCredits: 120

- type: entity
  id: FSZombieArmoured
  parent: FSZombieNormal
  suffix: Armoured
  name: armoured zombie
  components:
  - type: Sprite
    color: "#c8c8c8"
  - type: MobThresholds
    thresholds:
      0: Alive
      300: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 1.2
    baseSprintSpeed: 1.5
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.5
        Slash: 0.6
        Piercing: 0.7
  - type: FSEnemyValue
    killCredits: 200
  - type: FSArmor
    maxHPRatio: 0.5
    regenRate: 10

# TODO(finalstand): add ArmorComponent when FSZombieDestroyer is implemented
# maxHPRatio: 0.7, regenRate: 10 (tankier by design — targets infrastructure)
- type: entity
  id: FSZombieDestroyer
  parent: FSZombieBase
  suffix: Destroyer
  name: destroyer zombie
  abstract: true
  components:
  - type: MobThresholds
    thresholds:
      0: Alive
      500: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 1.0
    baseSprintSpeed: 1.3
  - type: FSEnemyValue
    killCredits: 350

# TODO(finalstand): add ArmorComponent when FSZombieBerserker is implemented
# maxHPRatio: 0.2, regenRate: 10 (light armor — enrage mechanic is the real threat)
# NOTE: Berserker enrages at 50% HP regardless of armor state.
- type: entity
  id: FSZombieBerserker
  parent: FSZombieBase
  suffix: Berserker
  name: berserker zombie
  abstract: true
  components:
  - type: MobThresholds
    thresholds:
      0: Alive
      200: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.5
    baseSprintSpeed: 3.5
  - type: FSEnemyValue
    killCredits: 300

# TODO(finalstand): add ArmorComponent when FSZombieGiant is implemented
# maxHPRatio: 0.4, regenRate: 10 (heavy but not as armored as Destroyer)
- type: entity
  id: FSZombieGiant
  parent: FSZombieBase
  suffix: Giant
  name: giant zombie
  abstract: true
  components:
  - type: MobThresholds
    thresholds:
      0: Alive
      1500: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 0.8
    baseSprintSpeed: 1.0
  - type: FSEnemyValue
    killCredits: 1000

# ── Shared prying config for all wave enemies ────────────────────────────────
# pryPowered: can open powered airlocks, force: bypass bolted doors,
# speedModifier: 8.0 = ~0.6s pry so BreakOnMove rarely cancels it.
- type: entity
  id: FSMobXeno
  parent: MobXeno
  suffix: FinalStand
  components:
  - type: HTN
    rootTask:
      task: FinalStandEnemyCompound
  - type: Prying
    pryPowered: true
    force: true
    speedModifier: 8.0
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 235
        mask:
        - MobMask
        layer:
        - MobLayer

