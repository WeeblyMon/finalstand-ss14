- type: entity
  id: WaveAmmoBox
  name: Ammo Resupply Box
  description: Interact to refill your magazines once per wave.
  placement:
    mode: SnapgridCenter
  components:
  - type: WaveAmmoBox
  - type: WaveAmmoBoxTag
  - type: Transform
    anchored: true
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    sprite: _FinalStand/Objects/wave_ammo_box.rsi
    state: base-big
  - type: ApcPowerReceiver
    powerLoad: 200
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
