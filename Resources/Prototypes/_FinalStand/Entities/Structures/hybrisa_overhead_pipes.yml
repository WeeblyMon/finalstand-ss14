- type: entity
  id: FSOverheadPipe
  name: overhead pipe segment
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: _FinalStand/Structures/overhead_pipes.rsi
    state: intact-scrubbers
    drawdepth: Overdoors
  - type: Icon
    sprite: _FinalStand/Structures/overhead_pipes.rsi
    state: intact-scrubbers
  - type: Anchorable
  - type: Clickable
  - type: SpriteFade

- type: entity
  parent: FSOverheadPipe
  id: FSOverheadPipeCorner
  suffix: Corner
  components:
