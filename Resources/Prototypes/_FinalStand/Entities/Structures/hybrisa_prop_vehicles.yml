# Temporary until we get actual vehicle code

- type: entity
  id: FSCarPileup
  name: burned out vehicle pileup
  description: Burned-out vehicles block your path, their charred frames and shattered glass hinting at recent chaos. The acrid smell of smoke lingers.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,0.5,3.5,2"
        density: 190
        layer:
        - MobMask
  - type: Sprite
    sprite: _FinalStand/Structures/vehicle_pileup.rsi
    state: car_pileup
    offset: 1.5, 1
  - type: Clickable
  - type: InteractionOutline
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1200
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  abstract: true
  id: FSPropVehicleBase
  components:
  - type: Transform
    noRot: true
  - type: Physics
    bodyType: Static
    fixedRotation: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,1.4,0.5"
        density: 190
        layer:
        - MobMask
  - type: Sprite
    sprite: _FinalStand/Structures/Vehicles/vehicles.rsi
    offset: 0.5, 0.5
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 800
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Clickable
  - type: InteractionOutline
  - type: RequireProjectileTarget

