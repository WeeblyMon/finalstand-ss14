- type: entity
  parent: BaseWall
  id: FSWallHybrisaRockDestructible
  name: cracked rock wall
  description: Ancient sedimentary rock, fractured enough that it could be broken through.
  suffix: Destructible
  components:
  - type: Sprite
    sprite: _FinalStand/Structures/Walls/hybrisa_rock.rsi
    state: rock
  - type: Icon
    sprite: _FinalStand/Structures/Walls/hybrisa_rock.rsi
    state: rock
  - type: IconSmooth
    key: walls
    additionalKeys:
    - windows
    - doors
    base: rock
  - type: Damageable
    damageModifierSet: Rock
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 120
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
          params:
            volume: -6
