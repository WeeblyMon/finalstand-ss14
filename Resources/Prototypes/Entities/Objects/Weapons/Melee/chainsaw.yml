- type: entity
  name: chainsaw
  parent: BaseItem
  id: Chainsaw
  description: A very large chainsaw. Usually you use this for cutting down trees... usually.
  components:
  - type: Wieldable
    wieldSound: !type:SoundPathSpecifier
      path: /Audio/Weapons/chainsawwield.ogg
      params:
        volume: -3
  - type: Sharp
  - type: Sprite
    sprite: Objects/Weapons/Melee/chainsaw.rsi
    state: icon
  - type: MeleeWeapon
    autoAttack: true
    angle: 0
    wideAnimationRotation: -135
    attackRate: 4
    damage:
      types:
        Slash: 4
        Blunt: 4

    soundHit:
      path: /Audio/Weapons/chainsaw.ogg
      params:
        volume: -3
  - type: IncreaseDamageOnWield
    damage:
      types:
        Slash: 4

  - type: Item
    size: Large
    shape:
    - 0,0,2,2
    sprite: Objects/Weapons/Melee/chainsaw.rsi
  - type: Clothing
    sprite: Objects/Weapons/Melee/chainsaw.rsi
    quickEquip: false
    slots:
    - suitStorage
  - type: DisarmMalus
  - type: UseDelay
    delay: 1
  # FS: chainsaw fuel mechanic — drives the Fuel Efficiency / Fuel Capacity upgrades.
  # Refill by clicking the chainsaw with a welding tool that has WeldingFuel.
  - type: FSChainsawFuel
    currentFuel: 50
    baseMaxFuel: 50
    baseFuelPerSwing: 1.0
