## Augments

- type: entity
  abstract: true
  parent: SurgeryBase
  id: SurgeryOpenCavityBase
  components:
  - type: Surgery
    requirement: SurgeryOpenRibcage
    steps:
    - SurgeryStepSawBones
    - SurgeryStepOpenOrganSlot
  - type: SurgeryOrganSlotCondition
    inverse: true

- type: entity
  abstract: true
  parent: SurgeryBase
  id: SurgeryInstallAugmentBase
  components:
  - type: Surgery
    requirement: SurgeryOpenRibcage
  - type: SurgeryOrganCondition
    inverse: true
    reattaching: true

- type: entity
  abstract: true
  parent: SurgeryBase
  id: SurgeryRemoveAugmentBase
  components:
  - type: Surgery
    requirement: SurgeryOpenRibcage
    steps:
    - SurgeryStepSawBones
    - SurgeryStepClampInternalBleeders
    - SurgeryStepRemoveOrgan

