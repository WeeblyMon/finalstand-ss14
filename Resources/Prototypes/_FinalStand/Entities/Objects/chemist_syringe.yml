- type: entity
  parent: MiniSyringe
  id: FSChemistSyringe
  name: support syringe
  description: A reshaped syringe keyed to crew biometrics. Fired from a syringe gun to deliver chemicals to a teammate at range.
  components:
  - type: FSAllyProjectile
  - type: Solution
    solution:
      maxVol: 15
  - type: SolutionInjectOnEmbed
    transferAmount: 15
    solution: injector

- type: latheRecipe
  id: FSChemistSyringe
  result: FSChemistSyringe
  completetime: 2
  materials:
    Steel: 100
    Plastic: 50

- type: entity
  parent: BaseStorageItem
  id: FSSyringePack
  name: syringe pack
  description: A pre-loaded rack of support syringes. Use it on a beaker to fill every syringe at once, or on a syringe gun to load the whole rack.
  components:
  - type: Sprite
    sprite: Objects/Specific/Chemistry/syringe.rsi
    layers:
    - state: syringe_base0
  - type: Item
    size: Small
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,5,0
    whitelist:
      tags:
      - SyringeGunAmmo
  - type: FSSyringePack
  - type: ContainerContainer

- type: entity
  parent: FSSyringePack
  id: FSSyringePackFilled
  suffix: Filled
  components:
  - type: StorageFill
    contents:
    - id: FSChemistSyringe
      amount: 6

- type: latheRecipe
  id: FSSyringePack
  result: FSSyringePackFilled
  completetime: 3
  materials:
    Steel: 150
    Plastic: 100
