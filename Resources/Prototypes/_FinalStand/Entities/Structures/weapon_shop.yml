- type: entity
  id: FSWeaponShopBase
  abstract: true
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.2,-0.2,0.2,0.2"
        density: 100
        mask:
        - ItemMask
        layer:
        - WallLayer
  - type: ActivatableUI
    key: enum.FSShopWeaponUiKey.Key
  - type: UserInterface
    interfaces:
      enum.FSShopWeaponUiKey.Key:
        type: FSShopWeaponBoundUserInterface

- type: entity
  id: FSWeaponShopViper
  parent: FSWeaponShopBase
  name: Viper
  description: A Syndicate-modified 9mm pistol. Semi-auto and full-auto.
  components:
  - type: FSShopWeapon
    weaponProtoId: WeaponPistolViper
    price: 1000
    upgrades:
    - id: viper-hair-trigger
      name: Hair Trigger
      description: Lighter pull increases fire rate by 1.5/level.
      maxLevel: 5
      baseCost: 200
      type: FireRate
      valuePerLevel: 1.5
    - id: viper-extended-mag
      name: Extended Mag
      description: Spare high-cap magazine spawned on each purchase.
      maxLevel: 5
      baseCost: 150
      type: SpawnItem
      spawnProtoId: MagazinePistolHighCapacity
      spawnCountPerLevel: 1
    - id: viper-recoil-pad
      name: Recoil Pad
      description: Reduces max spread by 0.3° per level for tighter bursts.
      maxLevel: 5
      baseCost: 100
      type: Accuracy
      valuePerLevel: 0.3
    - id: viper-akimbo
      name: Akimbo
      description: Dual wield. A second Viper spawns in your off-hand. Fire alternates between both. Accuracy suffers.
      maxLevel: 1
      baseCost: 500
      type: Akimbo
      valuePerLevel: 1
  - type: Sprite
    sprite: Objects/Weapons/Guns/Pistols/viper.rsi
    state: base
    scale: 1,1

