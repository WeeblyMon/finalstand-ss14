# FINALSTAND: Devastator — chainsaw-wielding berserker that grows faster and stronger as it takes damage.
# Spawns wave 13+. 800 HP, lifesteal on hit, berserk scaling up to 3.5× speed and 3× damage. 50% armor bypass, stun-resistant.
- type: entity
  parent: FSZombieFootsoldierBase
  id: FSZombieDevastator
  name: devastator zombie
  suffix: Devastator
  description: A hulking corpse swinging a chainsaw. The more you hurt it, the faster and harder it comes, and it shrugs off knockback and stuns.
  components:
  - type: FSSignatureAilment
    ailments:
      Bleeding: 3
    examine: fs-signature-devastator
  - type: FSSpecialZombie
  - type: FSEnemyIcon
    iconPath: /Textures/_FinalStand/Mobs/ZombieIcons/devastatorzombie.png
  - type: FSDevastator
    maxKnockbackResist: 0.9
    maxDamageMultiplier: 4
    lifestealAmount: 30
  - type: MobThresholds
    thresholds:
      0: Alive
      1500: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.6
    baseSprintSpeed: 3.25
  - type: FSStunResist
    durationMultiplier: 0.25
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    animation: WeaponArcClaw
    soundHit:
      path: /Audio/_FinalStand/Mobs/Devastator/chainsawattack.ogg
    damage:
      types:
        Slash: 14.4
  - type: FSInjuryOnHit
    injury:
      bleed: 3
  - type: FSEnemyValue
    killCredits: 1500
  - type: FSMoneyOnHitCap
    maxMoneyPerPlayer: 1200
  - type: Sprite
    drawdepth: Mobs
    sprite: _FinalStand/Mobs/Zombies/Devastator/devastator_zombie.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: base
  - type: AmbientSound
    enabled: true
    volume: -3
    range: 8
    sound:
      path: /Audio/_FinalStand/Mobs/Devastator/chainsawidle.ogg
  - type: FSZombieVisuals
    simpleSpriteMode: true
  - type: FSDeathLoot
    drops:
    - proto: FSResearchDisk
      chance: 0.0005
