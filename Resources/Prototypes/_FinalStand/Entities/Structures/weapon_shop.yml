- type: entity
  id: FSWeaponShopBase
  abstract: true
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.2,-0.2,0.2,0.2"
        density: 100
        mask:
        - ItemMask
        layer:
        - WallLayer
  - type: ActivatableUI
    key: enum.FSShopWeaponUiKey.Key
  - type: UserInterface
    interfaces:
      enum.FSShopWeaponUiKey.Key:
        type: FSShopWeaponBoundUserInterface

- type: entity
  id: FSWeaponShopViper
  parent: FSWeaponShopBase
  name: Viper
  description: A Syndicate-modified 9mm pistol. Semi-auto and full-auto.
  components:
  - type: FSShopWeapon
    weaponProtoId: WeaponPistolViper
    price: 1000
    starterAmmoProtoId: MagazinePistolHighCapacity
    starterAmmoCount: 2
    category: 9mm Semi/Full-Auto Pistol
    statDamage: 35
    statFireRate: 80
    statAccuracy: 55
    statCapacity: 75
    upgrades:
    - id: viper-hair-trigger
      name: Hair Trigger
      description: Lighter pull increases fire rate by 1.5/level.
      maxLevel: 5
      baseCost: 200
      type: FireRate
      valuePerLevel: 1.5
    - id: viper-extended-mag
      name: Extended Mag
      description: Spare high-cap magazine spawned on each purchase.
      maxLevel: 5
      baseCost: 150
      type: SpawnItem
      spawnProtoId: MagazinePistolHighCapacity
      spawnCountPerLevel: 1
    - id: viper-recoil-pad
      name: Recoil Pad
      description: Reduces max spread by 0.3° per level for tighter bursts.
      maxLevel: 5
      baseCost: 100
      type: Accuracy
      valuePerLevel: 0.3
    - id: viper-akimbo
      name: Akimbo
      description: Dual wield. A second Viper spawns in your off-hand. Fire alternates between both. Accuracy suffers.
      maxLevel: 1
      baseCost: 500
      type: Akimbo
      valuePerLevel: 1
    - id: viper-hollow-point
      name: Hollow Point
      description: Bullets slow hit enemies by 30% for 2 seconds. Hitting again resets the timer.
      maxLevel: 1
      baseCost: 350
      type: Slowing
      valuePerLevel: 1
    - id: viper-recoil-comp
      name: Recoil Compensator
      description: Dynamic recoil reduction. (Coming soon.)
      maxLevel: 1
      baseCost: 200
      type: Recoil
      valuePerLevel: 1
      isStub: true
  - type: Sprite
    sprite: Objects/Weapons/Guns/Pistols/viper.rsi
    state: base
    scale: 1,1

- type: entity
  id: FSWeaponShopMateba
  parent: FSWeaponShopBase
  name: Mateba
  description: Nanotrasen Death Squad revolver. High fire rate, .45 magnum.
  components:
  - type: FSShopWeapon
    weaponProtoId: FSWeaponMateba
    price: 500
    starterAmmoProtoId: MagazineBoxMagnum
    starterAmmoCount: 1
    category: .45 Magnum Revolver
    statDamage: 70
    statFireRate: 55
    statAccuracy: 75
    statCapacity: 25
    upgrades:
    - id: mateba-hair-trigger
      name: Hair Trigger
      description: Tuned action increases fire rate by 0.5/level.
      maxLevel: 5
      baseCost: 200
      type: FireRate
      valuePerLevel: 0.5
    - id: mateba-ammo-box
      name: Ammo Box
      description: A .45 magnum ammo box (12 rounds) spawned on each purchase per level.
      maxLevel: 5
      baseCost: 100
      type: SpawnItem
      spawnProtoId: MagazineBoxMagnum
      spawnCountPerLevel: 1
    - id: mateba-steady-aim
      name: Steady Aim
      description: Reduces max spread by 0.3° per level for precise follow-up shots.
      maxLevel: 5
      baseCost: 100
      type: Accuracy
      valuePerLevel: 0.3
    - id: mateba-dead-eye
      name: Dead Eye
      description: Increases critical hit chance by 5% per level. Crits deal 2× damage.
      maxLevel: 5
      baseCost: 300
      type: CritChance
      valuePerLevel: 0.05
    - id: mateba-akimbo
      name: Akimbo
      description: Dual wield. A second Mateba spawns in your off-hand. Fire alternates between both. Accuracy suffers.
      maxLevel: 1
      baseCost: 500
      type: Akimbo
      valuePerLevel: 1
    - id: mateba-critical-mass
      name: Critical Mass
      description: Crits hit harder. Each level adds +0.25× crit damage multiplier.
      maxLevel: 5
      baseCost: 300
      type: CritDamage
      # TODO(finalstand): tune crit multiplier per level
      valuePerLevel: 0.25
  - type: Sprite
    sprite: Objects/Weapons/Guns/Revolvers/mateba.rsi
    state: icon
    scale: 1,1

- type: entity
  id: FSWeaponShopFlintlock
  parent: FSWeaponShopBase
  name: Flintlock Pistol
  description: A pirate's companion. Single-shot .45 magnum. Slow, but hits like a cannonball.
  components:
  - type: FSShopWeapon
    weaponProtoId: WeaponPistolFlintlock
    price: 300
    starterAmmoProtoId: MagazineBoxMagnum
    starterAmmoCount: 1
    category: .45 Single-Shot Pistol
    statDamage: 90
    statFireRate: 10
    statAccuracy: 80
    statCapacity: 15
    upgrades:
    - id: flintlock-extra-load
      name: Extra Load
      description: Expands the barrel capacity by 1 round per level. Up to 6 shots before reloading.
      maxLevel: 5
      baseCost: 150
      type: MagazineSize
      valuePerLevel: 1
    - id: flintlock-ball-and-powder
      name: Ball & Powder
      description: Spawns a .45 ammo box per purchase per level. Each box holds 12 rounds and is refilled by the wave ammo resupply.
      maxLevel: 5
      baseCost: 75
      type: SpawnItem
      spawnProtoId: MagazineBoxMagnum
      spawnCountPerLevel: 1
    - id: flintlock-steady-hand
      name: Steady Hand
      description: Reduces max spread by 0.5° per level for that one perfect shot.
      maxLevel: 5
      baseCost: 100
      type: Accuracy
      valuePerLevel: 0.5
    - id: flintlock-akimbo
      name: Akimbo
      description: Dual wield. A second Flintlock spawns in your off-hand. Fire alternates between both. Accuracy suffers.
      maxLevel: 1
      baseCost: 300
      type: Akimbo
      valuePerLevel: 1
    - id: flintlock-explosive-shot
      name: Explosive Shot
      description: Bullets detonate on impact. AoE damage scales with gun damage × level.
      maxLevel: 3
      baseCost: 400
      type: ExplosiveShot
      valuePerLevel: 1
    - id: flintlock-payday
      name: Payday
      description: +50 bonus credits per kill with this gun per level.
      maxLevel: 4
      baseCost: 250
      type: MoneyGainBonus
      valuePerLevel: 50
  - type: Sprite
    sprite: Objects/Weapons/Guns/Snipers/flintlock.rsi
    state: base
    scale: 1,1

