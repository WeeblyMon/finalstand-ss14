# Hardsuits spawned by the Armor Vendor. Not loot items; FSArmorShopSystem manages equip/removal.

- type: entity
  parent: ClothingOuterHardsuitBase
  id: FSArmorTierSecurityHardsuit
  name: security hardsuit
  description: A tier-1 combat hardsuit from the Armor Vendor.
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/Hardsuits/security.rsi
  - type: Clothing
    sprite: Clothing/OuterClothing/Hardsuits/security.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.60
        Slash: 0.60
        Piercing: 0.60
        Heat: 0.80
        Caustic: 0.70
        Shock: 0.80
        Explosion: 0.40
  - type: ClothingSpeedModifier
    walkModifier: 0.75
    sprintModifier: 0.75
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHelmetHardsuitSecurity
  - type: Tag
    tags:
    - FSArmorTierItem
    - Hardsuit
    - WhitelistChameleon

