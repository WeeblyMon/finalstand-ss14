- type: entity
  name: fireaxe
  parent: [BaseItem, BaseEngineeringContraband]
  id: FireAxe
  description: Truly, the weapon of a madman. Who would think to fight fire with an axe?
  components:
  - type: FSMeleeJuice # FINALSTAND
    light:
      anticipation: 0.12
      hitstop: 0.09
      reach: 1.2
      trauma: 0.55
      shakeMode: Radial
      knockback: 15
      knockbackDuration: 0.3
      flinchDuration: 0.4
      flinchSpeed: 0.15
      hitEffect: FSMeleeHitHeavySlash
      killEffect: FSMeleeKillBlood
      hitEmitter: FSMeleeBlood
      killEmitter: FSMeleeBloodBurst
      killSound:
        collection: gib
      moveAnticipation: 0.6
      moveImpact: 0.4
      moveRecovery: 0.8
      recoveryTime: 0.5
      trailColor: "#b02020cc"
      trailWidth: 0.12
      trailDuration: 0.18
    comboHits: 2
    finisher:
      anticipation: 0.2
      hitstop: 0.12
      reach: 1.2
      trauma: 0.8
      shakeMode: Radial
      knockback: 15
      knockbackDuration: 0.3
      flinchDuration: 0.6
      flinchSpeed: 0.15
      hitEffect: FSMeleeHitShatter
      killEffect: FSMeleeKillBlood
      hitEmitter: FSMeleeBlood
      killEmitter: FSMeleeBloodBurst
      killSound:
        collection: gib
      moveAnticipation: 0.6
      moveImpact: 0.4
      moveRecovery: 0.8
      recoveryTime: 0.5
      trailColor: "#b02020cc"
      trailWidth: 0.12
      trailDuration: 0.18
      damageMultiplier: 1.4
      staggerRadius: 1.6
  - type: Tag
    tags:
    - FireAxe
  - type: Execution
    doAfterDuration: 4.0
  - type: Sprite
    sprite: Objects/Weapons/Melee/fireaxe.rsi
    state: icon
  - type: MeleeWeapon
    soundSwing: # FINALSTAND
      collection: FSMeleeSwishHeavy
      params:
        volume: -2
        pitch: 0.8
        variation: 0.04
    wideAnimationRotation: 135
    swingLeft: true
    attackRate: 0.75
    damage:
      types:
        Blunt: 25
        Slash: 50
    soundHit:
      collection: MetalThud
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Slash: 10
  - type: Item
    shape:
    - 1,0,2,5
    - 0,0,0,2
    storedSprite:
      state: storage
      sprite: Objects/Weapons/Melee/fireaxe.rsi
    size: Ginormous
  - type: Clothing
    sprite: Objects/Weapons/Melee/fireaxe.rsi
    quickEquip: false
    slots:
    - back
    - suitStorage
  - type: Tool
    qualities:
    - Prying
    - Slicing
    - Sawing
  - type: ToolTileCompatible
  - type: Prying
  - type: UseDelay
    delay: 1
  - type: StealTarget
    stealGroup: FireAxe
  - type: IgniteOnMeleeHit
    fireStacks: -4
  - type: Crit
    baseCritChance: 0.05

- type: entity
  id: FireAxeFlaming
  name: fire axe
  parent: [ BaseSyndicateContraband, FireAxe ]
  description: Why fight fire with an axe when you can fight with fire and axe? Now featuring rugged rubberized handle!
  components:
  - type: MeleeWeapon
    wideAnimationRotation: 135
    swingLeft: true
  - type: Item
    shape:
    - 1,0,2,5
    - 0,0,0,2
    storedSprite:
      state: storage
      sprite: Objects/Weapons/Melee/fireaxeflaming.rsi
    size: Ginormous
  - type: IgniteOnMeleeHit
    fireStacks: 1
  - type: Sprite
    sprite: Objects/Weapons/Melee/fireaxeflaming.rsi
    state: icon
  - type: Clothing
    sprite: Objects/Weapons/Melee/fireaxeflaming.rsi
    quickEquip: false
    slots:
    - back
    - suitStorage
