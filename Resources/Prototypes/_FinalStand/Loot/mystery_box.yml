- type: entity
  id: FSMysteryBox
  parent: BaseStructure
  name: mystery box
  description: A battered crate that hums with something that isn't electricity. Feed it credits and it hands you something, usually a weapon. What you get is up to the box.
  components:
  - type: Sprite
    drawdepth: Objects
    sprite: _FinalStand/Structures/mystery_box.rsi
    offset: 0.5,0
    layers:
    - state: base
    - state: lid
      map: [ "lid" ]
  - type: InteractionOutline
  - type: PointLight
    enabled: false
    radius: 3
    energy: 2
    color: "#9FD8FF"
  - type: FSMysteryBox
    tiers:
    - pool: FSGachaMisc
      weight: 15
    - pool: FSGachaImprovised
      weight: 19
    - pool: FSGachaSurplus
      weight: 10
    - pool: FSMysteryBoxUncommon
      weight: 17
    - pool: FSGachaJackpot
      weight: 4
    - pool: FSMysteryBoxRare
      weight: 15
    - pool: FSMysteryBoxVeryRare
      weight: 11
    - pool: FSMysteryBoxReallyRare
      weight: 5
    - pool: FSMysteryBoxWonder
      weight: 4
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.4,1.45,0.3"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer

- type: entity
  id: FSMysteryBoxTopper
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    drawdepth: Overdoors
    sprite: _FinalStand/Structures/mystery_box.rsi
    offset: 0.5,0
    layers:
    - state: lid
      map: [ "lid" ]
    - map: [ "display" ]
      visible: false
      shader: unshaded
