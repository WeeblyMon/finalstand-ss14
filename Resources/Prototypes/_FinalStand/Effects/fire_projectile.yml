- type: entity
  id: FSFireProjectile
  categories: [ HideSpawnMenu ]
  components:
  - type: FSFireProjectile
  - type: Sprite
    noRot: false
    drawdepth: Effects
    sprite: _FinalStand/Effects/Flamethrower/fire.rsi
    layers:
    - state: fire
      shader: unshaded
  - type: Physics
    bodyType: Dynamic
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeCircle
          radius: 0.1
        density: 5
        mask:
        - Impassable
        layer: []
  - type: TileFrictionModifier
    modifier: 0
  - type: TimedDespawn
    lifetime: 0.6
  # No PointLight: ~15 of these are alive at once per firing zombie. FSFlamethrowerSystem
  # lights the cone with a single FSFlamethrowerGlow.
