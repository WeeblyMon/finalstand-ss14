    organs:
      Head: HeadMonkey
      Brain: OrganAnimalBrain
      Eyes: OrganAnimalEyes
      Torso: ChestMonkey
      Heart: OrganAnimalHeart
      Lungs: OrganAnimalLungs
      Groin: GroinMonkey
      Stomach: OrganAnimalStomach
      Liver: OrganAnimalLiver
      Kidneys: OrganAnimalKidneys
      ArmRight: RightArmMonkey
      ArmLeft: LeftArmMonkey
      HandRight: RightHandMonkey
      HandLeft: LeftHandMonkey
      LegRight: RightLegMonkey
      LegLeft: LeftLegMonkey
      FootRight: RightFootMonkey
      FootLeft: LeftFootMonkey
    relationships:
      Head: [ Brain, Eyes ]
      Torso: [ ArmLeft, ArmRight, Groin, Head, Heart, Lungs ]
      Groin: [ Kidneys, LegLeft, LegRight, Liver, Stomach ]
      ArmRight: [ HandRight ]
      ArmLeft: [ HandLeft ]
      LegRight: [ FootRight ]
      LegLeft: [ FootLeft ]
