# SMG overrides — adds AkimboEligible tag and buffed FS ammo.

- type: entity
  id: FSWeaponAtreides
  parent: WeaponSubMachineGunAtreides
  suffix: FinalStand
  components:
  - type: Tag
    tags:
    - Sidearm
    - AkimboEligible
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: FSMagazinePistolSMG
        insertSound: /Audio/Weapons/Guns/MagIn/smg_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/smg_magout.ogg
        priority: 2
        whitelist:
          tags:
            - MagazinePistolSubMachineGun
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags:
            - CartridgePistol

