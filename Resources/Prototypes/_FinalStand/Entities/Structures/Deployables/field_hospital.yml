- type: entity
  id: FSFieldHospitalItem
  parent: BaseItem
  name: field hospital kit
  description: A folded medical tent. Pitch it anywhere and anyone resting beside it mends. Press Z to aim a placement, click to deploy.
  components:
  - type: GuideHelp
    guides: [ FSInjuries ]
  - type: Item
    size: Large
  - type: Sprite
    sprite: Structures/Furniture/rollerbeds.rsi
    state: rollerbed_folded
  - type: FSMedicalOnly
  - type: FSDeployableItem
    requiresScience: false
    requiresMedical: true
    deployedProtoId: FSFieldHospitalDeployed
  - type: FSPlaceable
    previewProtoId: FSFieldHospitalDeployed
    range: 6

- type: entity
  parent: BaseStructure
  id: FSFieldHospitalDeployed
  name: field hospital
  description: A pitched medical tent. Stand inside its green ring and your injuries mend while you rest.
  categories: [ HideSpawnMenu ]
  components:
  - type: GuideHelp
    guides: [ FSInjuries ]
  - type: Sprite
    sprite: _FinalStand/Structures/field_hospital.rsi
    state: tent
    noRot: true
    drawdepth: BelowMobs
    offset: 0,0.5
  - type: Icon
    sprite: _FinalStand/Structures/field_hospital.rsi
    state: tent
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.05"
        density: 190
        mask:
        - TableMask
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 75
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Transform
    anchored: true
    noRot: true
  - type: Anchorable
  - type: FSRecoveryZone
    radius: 2.5
    offset: 0, 0.5
  - type: FSFieldHospital
  - type: FSArmingDelay
    delay: 6
  - type: FSDeployableLifetime
    lifetime: 600
  - type: FSPackable
    packedProtoId: FSFieldHospitalItem
    packTime: 2.7
  - type: FSPlayerDamageImmune
