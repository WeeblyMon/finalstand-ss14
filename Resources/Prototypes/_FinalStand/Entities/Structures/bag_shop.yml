- type: entity
  id: FSBagShop
  name: Bag Vendor
  description: Dispenses storage bags. Magnetising bags pull nearby stock in on their own.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 100
        mask:
        - ItemMask
        layer:
        - WallLayer
  # Placeholder art until the vendor gets its own sprite.
  - type: Sprite
    drawdepth: SmallObjects
    sprite: Structures/Machines/VendingMachines/engivend.rsi
    state: off
  - type: FSBagShop
    catalog:
    - proto: OreBag
      name: fs-bag-shop-ore-bag
      description: fs-bag-shop-ore-bag-desc
      price: 100
    - proto: FSConstructionBag
      name: fs-bag-shop-fs-construction-bag
      description: fs-bag-shop-fs-construction-bag-desc
      price: 100
    - proto: OreBagOfHolding
      name: fs-bag-shop-ore-bag-of-holding
      description: fs-bag-shop-ore-bag-of-holding-desc
      price: 250
    - proto: FSConstructionBagOfHolding
      name: fs-bag-shop-fs-construction-bag-of-holding
      description: fs-bag-shop-fs-construction-bag-of-holding-desc
      price: 250
    - proto: ClothingBackpackHolding
      name: fs-bag-shop-clothing-backpack-holding
      description: fs-bag-shop-clothing-backpack-holding-desc
      price: 500
  - type: UserInterface
    interfaces:
      enum.FSBagShopUiKey.Key:
        type: FSBagShopBoundUserInterface
  - type: ActivatableUI
    key: enum.FSBagShopUiKey.Key
