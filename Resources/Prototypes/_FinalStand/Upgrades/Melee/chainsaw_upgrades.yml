# Chainsaw shop entry. Top-tier melee.

- type: entity
  id: FSWeaponShopChainsaw
  parent: FSWeaponShopBase
  name: Chainsaw
  description: A very large chainsaw. Every hit in a row builds rev and makes it hit harder. Right click dumps all the rev into one big rip.
  components:
  - type: FSShopWeapon
    weaponProtoId: FSWeaponChainsaw
    price: 15000
    category: Melee Power
    statDamage: 70
    statFireRate: 70
    statAccuracy: 0
    statCapacity: 0
    upgrades:
    - id: chainsaw-overclock
      name: Overclock
      description: Higher RPM increases attack speed by 25% per level.
      maxLevel: 2
      baseCost: 17000
      type: AttackSpeed
      valuePerLevel: 0.25
    - id: chainsaw-steel-chains
      name: Steel Chains
      description: Hardened links add +75% damage per level.
      maxLevel: 3
      baseCost: 12500
      type: Damage
      valuePerLevel: 0.75
    - id: chainsaw-hungry-chains
      name: Hungry Chains
      description: Saw drinks back +0.5 lifesteal per hit.
      maxLevel: 1
      baseCost: 22000
      type: LifeSteal
      valuePerLevel: 0.5
    - id: chainsaw-rip-and-tear
      name: Rip and Tear
      description: A right click spending 5 or more rev heals you 3 health per zombie it hits, and those kills pay 50% more.
      maxLevel: 1
      baseCost: 18000
      type: MeleeSignature
      signature: RipAndTear
      valuePerLevel: 3
    - id: chainsaw-redline
      name: Redline
      description: Rev builds up to 10 instead of 6.
      maxLevel: 1
      baseCost: 16000
      type: MeleeSignature
      signature: Redline
      valuePerLevel: 4
    - id: chainsaw-bloodthirsty
      name: Bloodthirsty
      description: A kill from a right-click rev dump makes your next grind hit a guaranteed crit.
      maxLevel: 1
      baseCost: 14000
      type: MeleeSignature
      signature: Bloodthirsty
      valuePerLevel: 1
    - id: chainsaw-protective-saw
      name: Protective Saw
      description: While wielded, take 20% less damage.
      maxLevel: 1
      baseCost: 22000
      type: WielderResistance
      valuePerLevel: 0.2
  - type: Sprite
    sprite: Objects/Weapons/Melee/chainsaw.rsi
    state: icon
    scale: 1,1
