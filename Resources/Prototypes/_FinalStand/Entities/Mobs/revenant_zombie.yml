- type: entity
  parent: FSZombieFootsoldierBase
  id: FSZombieRevenant
  name: revenant zombie
  suffix: Revenant
  description: A corpse that drifts through walls. It hunts whoever strays from the group, strikes, then slips back out of sight.
  components:
  - type: FSSpecialZombie
  - type: FSRevenant
  - type: FSNoHealthBar
  - type: HTN
    rootTask:
      task: FSRevenantEnemyCompound
    planCooldown: 1.0
    blackboard:
      NavPry: !type:Bool
        false
      NavSmash: !type:Bool
        false
      NavInteract: !type:Bool
        false
  # Phases: collides with nothing, but keeps MobLayer so bullets and melee still land on it.
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.25
        density: 235
        mask: []
        layer:
        - MobLayer
  - type: FSRevenantPhasing
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    animation: WeaponArcClaw
    soundHit:
      path: /Audio/Weapons/slash.ogg
    damage:
      types: {}
  - type: FSEnemyIcon
    iconPath: /Textures/_FinalStand/Mobs/ZombieIcons/revenanticon.png
  - type: MobThresholds
    thresholds:
      0: Alive
      300: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 7.5
    baseSprintSpeed: 9.6
  - type: Sprite
    drawdepth: Mobs
    sprite: _FinalStand/Mobs/Zombies/Revenant/revenant_zombie.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: base
  - type: FSZombieVisuals
    simpleSpriteMode: false
    damagedState: damaged
    singleStageAt: 0.10
  - type: FSEnemyValue
    killCredits: 1500
  - type: FSMoneyOnHitCap
    maxMoneyPerPlayer: 1100
  - type: FSDeathLoot
    drops:
    - proto: FSResearchDisk
      chance: 0.0008

# Dark wave variant: several of these are alive at once and they respawn for the whole wave,
# so they trade the normal revenant's fragility for twice a giant's 800 HP.
- type: entity
  parent: FSZombieRevenant
  id: FSZombieRevenantDark
  suffix: Revenant, Dark Wave
  components:
  - type: MobThresholds
    thresholds:
      0: Alive
      1600: Dead
