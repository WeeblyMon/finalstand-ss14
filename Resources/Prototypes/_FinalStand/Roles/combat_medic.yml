- type: playTimeTracker
  id: JobCombatMedic

- type: jobIcon
  id: JobIconCombatMedic
  icon:
    sprite: /Textures/Interface/Misc/job_icons.rsi
    state: CombatMedic
  jobName: job-name-combat-medic

- type: job
  id: CombatMedic
  name: job-name-combat-medic
  description: job-description-combat-medic
  playTimeTracker: JobCombatMedic
  requirements:
  - !type:DepartmentTimeRequirement
    department: Security
    time: 1h
  - !type:RoleTimeRequirement
    role: JobMedicalDoctor
    time: 1h
  startingGear: CombatMedicGear
  icon: "JobIconCombatMedic"
  supervisors: job-supervisors-cmo
  access:
  - Medical
  - Maintenance
  extendedAccess:
  - Chemistry

- type: startingGear
  id: CombatMedicGear
  equipment:
    id: CombatMedicPDA
    ears: ClothingHeadsetMedical
    belt: ClothingBeltMedicalEMTFilled
    pocket1: FlashlightSeclite
    pocket2: FSEmergencyDefibrillator
  storage:
    back:
    - FSMedicalBeamGun

- type: entity
  parent: ParamedicPDA
  id: CombatMedicPDA
  name: combat medic PDA
  description: Scuffed, and slightly bloodstained.
  components:
  - type: Appearance
    appearanceDataInit:
     enum.PdaVisuals.PdaType:
       !type:String
       pda-combatmedic
  - type: PdaBorderColor
    borderColor: "#d7d7d0"
    accentVColor: "#7a2b2b"
  - type: Icon
    state: pda-combatmedic

# Paramedic's kit, but the windbreaker is swapped for a vest so they read as frontline on sight.
- type: loadout
  id: CombatMedicVest
  equipment:
    outerClothing: ClothingOuterArmorBulletproof

- type: loadoutGroup
  id: CombatMedicOuterClothing
  name: loadout-group-combat-medic-outerclothing
  loadouts:
  - CombatMedicVest

- type: roleLoadout
  id: JobCombatMedic
  groups:
  - GroupTankHarness
  - ParamedicHead
  - MedicalMask
  - ParamedicJumpsuit
  - MedicalBackpack
  - CombatMedicOuterClothing
  - ParamedicShoes
  - Glasses
  - AssistiveItems
  - SurvivalMedical
  - Trinkets
  - GroupSpeciesBreathToolMedical

- type: entity
  id: SpawnPointCombatMedic
  parent: SpawnPointJobBase
  name: combat medic
  components:
  - type: SpawnPoint
    job_id: CombatMedic
  - type: Sprite
    layers:
      - state: green
      - state: paramedic
      # No combat medic state in the marker RSI, so the vest is layered on to tell it apart from
      # the paramedic spawner at a glance.
      - sprite: Clothing/OuterClothing/Armor/bulletproof.rsi
        state: icon
        scale: 0.6, 0.6
