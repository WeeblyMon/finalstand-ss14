# ── Damage Beacon - held item (planted via use-in-hand) ───────────────────────────────────────
- type: entity
  id: FSDamageBeaconItem
  parent: BaseItem
  name: damage beacon
  description: A portable targeting beacon. Amplifies damage dealt to enemies in its radius. Press Z to aim a placement, click to deploy - or throw it (Ctrl+Q) to deploy where it lands.
  categories: [ HideSpawnMenu ]
  components:
  - type: Item
    size: Small
  - type: Sprite
    sprite: _FinalStand/Objects/Devices/DamageBeacon.rsi
    state: icon
  - type: FSScienceOnly
  - type: FSDeployableItem
    deployedProtoId: FSDamageBeaconDeployed
  - type: FSPlaceable
    previewProtoId: FSDamageBeaconDeployed
    range: 10

# ── Damage Beacon - placed/anchored ───────────────────────────────────────────────────────────
- type: entity
  id: FSDamageBeaconDeployed
  name: damage beacon
  description: A targeting beacon. Amplifies damage dealt to enemies in its radius.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _FinalStand/Objects/Devices/DamageBeacon.rsi
    layers:
    - texture: _FinalStand/Effects/Deployables/damage_beacon_field.png
      shader: unshaded
      map: [ "decal" ]
    - state: base
      map: [ "base" ]
  - type: PointLight
    enabled: true
    radius: 3
    energy: 4
    color: "#FF4422"
  - type: FSDamageBeacon
    radius: 4
    damageMultiplier: 1.5
  - type: FSDeployableLifetime
    lifetime: 45
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.3,-0.3,0.3,0.3"
        density: 100
        mask:
        - ItemMask
        layer:
        - MachineLayer
  - type: Anchorable
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: FSPlayerDamageImmune
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 40
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          FSDamageBeaconDestroyVfx:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
