- type: entity
  parent: BaseAction
  id: FSMassCasualtyProtocolAction
  name: Mass Casualty Protocol
  description: For 45 seconds the whole medical department treats, revives and stabilises a quarter faster, and defibrillators recharge sooner.
  components:
  - type: Action
    useDelay: 120
  - type: Sprite
    sprite: Objects/Specific/Medical/defib.rsi
    state: icon
  - type: InstantAction
    event: !type:FSMassCasualtyProtocolEvent {}

- type: entity
  parent: BaseAction
  id: FSMedicalMobilisationAction
  name: Medical Mobilisation
  description: For 20 seconds medics move faster, drag casualties far faster, treat faster and shrug off hits that would break a treatment.
  components:
  - type: Action
    useDelay: 180
  - type: Sprite
    sprite: Objects/Specific/Medical/medipen.rsi
    state: stimpen
  - type: InstantAction
    event: !type:FSMedicalMobilisationEvent {}

- type: entity
  parent: BaseAction
  abstract: true
  id: FSMedicalDirectiveBase
  components:
  - type: Action
    useDelay: 30

- type: entity
  parent: FSMedicalDirectiveBase
  id: FSMedicalDirectiveTraumaAction
  name: Directive - Trauma
  description: A standing order. Revival, stabilisation and defibrillator recharge improve. Press again to stand it down.
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/defibsmall.rsi
    state: icon
  - type: InstantAction
    event: !type:FSMedicalDirectiveEvent
      directive: Trauma

- type: entity
  parent: FSMedicalDirectiveBase
  id: FSMedicalDirectivePharmaAction
  name: Directive - Pharmaceutical
  description: A standing order. Treatment is faster. Press again to stand it down.
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/hypospray.rsi
    state: hypo
  - type: InstantAction
    event: !type:FSMedicalDirectiveEvent
      directive: Pharma

- type: entity
  parent: FSMedicalDirectiveBase
  id: FSMedicalDirectiveFieldOpsAction
  name: Directive - Field Operations
  description: A standing order. Movement, casualty dragging and resistance to interruption improve. Press again to stand it down.
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/healthanalyzer.rsi
    state: icon
  - type: InstantAction
    event: !type:FSMedicalDirectiveEvent
      directive: FieldOps
