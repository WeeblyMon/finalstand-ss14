# ── Heavy Sentry - deployed ──────────────────────────────────────────────────────────────
- type: entity
  id: FSHeavySentryDeployed
  name: heavy sentry
  description: A deployed emplacement gun. It tracks and fires on hostiles by itself.
  categories: [ HideSpawnMenu ]
  placement:
    mode: SnapgridCenter
  components:
  - type: FSStructureHealth
  - type: FSUpgradeable
    grade: FSGradeSteel
    options: [ FSModuleBelt, FSModuleBeltDouble, FSModuleOptics, FSModuleHardenedRounds, FSModuleUraniumRounds ]
  - type: UserInterface
    interfaces:
      enum.FSUpgradeUiKey.Key:
        type: FSUpgradeBoundUserInterface
  - type: Sprite
    drawdepth: Objects
    noRot: false
    sprite: _FinalStand/Objects/Devices/HeavySentry.rsi
    layers:
    - state: base
      map: [ "turretBase" ]
    - state: turret
      map: [ "gun" ]
  - type: Appearance
  - type: FSSentryTurret
    ammo: 400
    maxAmmo: 400
    range: 6
    fireInterval: 0.3
    damageMultiplier: 3.6
    spriteAngleOffset: 0
    projectileProto: FSHeavySentryRound
    projectileSpeed: 30
    casingProto: FSHeavySentryCasing
    fireSound:
      path: /Audio/_FinalStand/Deployables/HeavySentry/fire.ogg
    targetAcquiredSound:
      path: /Audio/_FinalStand/Deployables/HeavySentry/target_acquired.ogg
  - type: RCDDeconstructable
    cost: 0
    delay: 2
    fx: EffectRCDDeconstruct2
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 190
        # Not hard: a crew-served weapon on the floor, not a barricade. A solid body blocked players
        # from walking past it and stopped their own bullets, per playtester reports.
        hard: false
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: FSPlayerDamageImmune
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 260
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

# Cellular spares structures the way FS explosions do, so a turret cannot chew up the station.
- type: entity
  id: FSHeavySentryRound
  parent: BaseBullet
  name: heavy sentry round
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Cellular: 16

- type: entity
  id: FSHeavySentryCasing
  name: spent casing
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    drawdepth: SmallObjects
    sprite: _FinalStand/Objects/Devices/HeavySentry.rsi
    state: casing
  - type: Physics
    bodyType: Dynamic
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.05
        density: 5
        hard: false
  - type: TimedDespawn
    lifetime: 10
