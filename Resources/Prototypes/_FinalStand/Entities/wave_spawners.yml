- type: entity
  id: WaveEnemySpawner
  name: Wave Enemy Spawner
  description: Marks a location where wave enemies spawn.
  parent: MarkerBase
  components:
  - type: WaveEnemySpawner
  - type: Sprite
    drawdepth: Overdoors
    sprite: Markers/cross.rsi
    layers:
    - state: red

- type: entity
  id: WaveEnemySpawnerNorth
  name: Wave Enemy Spawner (North)
  description: North spawn point. Unlocks wave 1.
  parent: MarkerBase
  components:
