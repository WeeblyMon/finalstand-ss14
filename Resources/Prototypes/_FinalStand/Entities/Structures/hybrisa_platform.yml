- type: entity
  abstract: true
  id: FSPlatformBase
  name: platform
  description: A square metal surface resting on four legs.
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: _FinalStand/Structures/platforms.rsi
  - type: InteractionOutline
  - type: Clickable
  - type: Climbable
    delay: 0.25

- type: entity
  parent: FSPlatformBase
  id: FSPlatform
  name: platform
  description: A square metal surface resting on four legs.
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,-0.36"
        density: 1500
        mask:
        - TableMask
        layer:
        - TableLayer
  - type: Sprite
    state: platform

