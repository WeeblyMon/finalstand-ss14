- type: entity
  parent: BaseItem
  id: FSMedicalBeamGun
  name: medical beam gun
  description: Projects a stream of medical nanites. Closes wounds fast, but the last stretch back to full health is beyond it - that still takes a doctor.
  components:
  - type: Sprite
    sprite: _FinalStand/Objects/Medical/medigun.rsi
    state: icon
  - type: Item
    sprite: _FinalStand/Objects/Medical/medigun.rsi
    size: Large
  - type: Clothing
    quickEquip: false
    slots:
    - back
    - suitStorage
  - type: FSMediGun
    healing:
      types:
        Blunt: -6
        Slash: -6
        Piercing: -6
        Heat: -6
        Cold: -4
        Shock: -6
        Asphyxiation: -6
        Bloodloss: -6
    soundOnTarget:
      path: /Audio/_FinalStand/Effects/medigun.ogg
  - type: Battery
    maxCharge: 30
    startingCharge: 30
  - type: BatterySelfRecharger
    autoRechargeRate: 1.5
    autoRechargePauseTime: 8
  # Two-handed on purpose: a medic should be healing or fighting, not both at once.
  # Wielding is the on switch, so there is no separate toggle competing for use-in-hand.
  - type: Wieldable
    unwieldOnUse: false
  - type: FSMedicalOnly
  - type: UseDelay
    delay: 1.0
  - type: Appearance

- type: entity
  parent: FSMedicalBeamGun
  id: FSMedicalBeamGunOverHealer
  name: overhealer
  description: A refined beam gun. Once a patient is patched as far as the beam allows, it keeps pouring nanites in as a shield that soaks up damage and slowly fades.
  components:
  - type: Sprite
    sprite: _FinalStand/Objects/Medical/overhealer.rsi
    state: icon
  - type: Item
    sprite: _FinalStand/Objects/Medical/overhealer.rsi
    size: Large
  - type: FSMediGun
    variant: OverHealer
    overhealRatio: 0.5
    beamColor: "#3FD7E0"

- type: entity
  parent: FSMedicalBeamGun
  id: FSMedicalBeamGunUberCharger
  name: ubercharger
  description: A cycling beam gun. Healing builds an ÜberCharge; release it to make you and your patient untouchable for a few seconds.
  components:
  - type: Sprite
    sprite: _FinalStand/Objects/Medical/ubercharger.rsi
    state: icon
  - type: Item
    sprite: _FinalStand/Objects/Medical/ubercharger.rsi
    size: Large
  - type: FSMediGun
    variant: UberCharger
    beamColor: "#FF6A3D"
