- type: body
  id: Dwarf
  name: "dwarf"
  root: chest
  slots:
    head:
      part: HeadHuman
      connections:
      - chest
      organs:
        brain: OrganHumanBrain
        eyes: OrganHumanEyes
        visualHead: OrganHumanVisualHead
        visualEyes: OrganHumanVisualEyes
    chest:
      part: ChestHuman
      connections:
      - right arm
      - left arm
      - groin
      - head # Shitmed
      organs:
        heart: OrganDwarfHeart
        lungs: OrganHumanLungs
        visualChest: OrganHumanVisualChest
    groin:
      part: GroinHuman
      connections:
      - right leg
      - left leg
      organs:
        stomach: OrganDwarfStomach
        liver: OrganDwarfLiver
        kidneys: OrganHumanKidneys
        visualGroin: OrganHumanVisualGroin
    right arm:
      part: RightArmHuman
      connections:
      - right hand
      organs:
        visualRArm: OrganHumanVisualRArm
    left arm:
      part: LeftArmHuman
      connections:
      - left hand
      organs:
        visualLArm: OrganHumanVisualLArm
    right hand:
      part: RightHandDwarf # Goob edit
      organs:
        visualRHand: OrganHumanVisualRHand
    left hand:
      part: LeftHandDwarf # Goob edit
      organs:
        visualLHand: OrganHumanVisualLHand
    right leg:
      part: RightLegHuman
      connections:
      - right foot
      organs:
        visualRLeg: OrganHumanVisualRLeg
    left leg:
      part: LeftLegHuman
      connections:
      - left foot
      organs:
        visualLLeg: OrganHumanVisualLLeg
    right foot:
      part: RightFootHuman
      organs:
        visualRFoot: OrganHumanVisualRFoot
    left foot:
      part: LeftFootHuman
      organs:
        visualLFoot: OrganHumanVisualLFoot
