- type: entity
  abstract: true
  id: BodyOrgansSkeleton
  components:
  - type: InitialBody
    organs:
      Head: HeadSkeleton
      Torso: ChestSkeleton
      Groin: GroinSkeleton
      ArmRight: RightArmSkeleton
      ArmLeft: LeftArmSkeleton
      HandRight: RightHandSkeleton
      HandLeft: LeftHandSkeleton
      LegRight: RightLegSkeleton
      LegLeft: LeftLegSkeleton
      FootRight: RightFootSkeleton
      FootLeft: LeftFootSkeleton
    relationships:
      Torso: [ ArmLeft, ArmRight, Groin, Head ]
      Groin: [ LegLeft, LegRight ]
      ArmRight: [ HandRight ]
      ArmLeft: [ HandLeft ]
      LegRight: [ FootRight ]
      LegLeft: [ FootLeft ]
