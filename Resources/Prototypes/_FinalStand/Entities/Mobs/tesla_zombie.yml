# FINALSTAND: Tesla zombie — stops moving and fires a chaining shock beam when players are in range.
# Spawns wave 11+, weighted at ~12.5% of wave composition via weighted selection.
- type: entity
  parent: FSZombieFootsoldierBase
  id: FSZombieTesla
  name: tesla zombie
  suffix: Tesla
  description: A corpse crackling with stolen current. Its lightning jumps between people standing close together.
  components:
  - type: FSMaterialDrop
    materials:
    - IngotSilver1
    - IngotSilver1
    - IngotGold1
  - type: FSSpecialZombie
  - type: FSEnemyIcon
    iconPath: /Textures/_FinalStand/Mobs/ZombieIcons/teslazombie.png
  - type: FSTeslaZombie
    detectionRange: 9
    chainRange: 5.5
    attackCooldown: 3
    maxChainTargets: 5
    primaryDamageShock: 35
    chainDamageShock: 20
  - type: Insulated
  - type: MobThresholds
    thresholds:
      0: Alive
      600: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.2    # FSZombieNormal (2.0) + 10%
    baseSprintSpeed: 2.7   # FSZombieNormal (2.5) + 8%
  - type: FSEnemyValue
    killCredits: 1200
  - type: Sprite
    drawdepth: Mobs
    sprite: _FinalStand/Mobs/Zombies/Tesla/tesla_zombie.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: base
  - type: FSZombieVisuals
    simpleSpriteMode: true
  - type: PointLight
    enabled: false
    color: "#4488FF"
    radius: 5.0
    energy: 8.0
    softness: 1.0
  - type: FSDeathLoot
    drops:
    - proto: FSResearchDisk
      chance: 0.0005
