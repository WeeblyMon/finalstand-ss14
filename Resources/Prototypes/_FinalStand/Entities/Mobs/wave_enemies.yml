# ── FSZombie types ──────────────────────────────────────────────────────────

- type: entity
  id: FSZombieNormal
  parent: MobZombie
  suffix: FinalStand
  name: zombie
  components:
  - type: HTN
    rootTask:
      task: FinalStandEnemyCompound
  - type: NpcFactionMember
    factions:
    - FSZombie
  - type: Prying
    pryPowered: true
    force: true
    speedModifier: 8.0
  - type: MobThresholds
    thresholds:
      0: Alive
      75: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.0
    baseSprintSpeed: 2.5
  - type: FSEnemyValue
    killCredits: 100

- type: entity
  id: FSZombieRunner
  parent: FSZombieNormal
  suffix: Runner
  name: runner zombie
  components:
  - type: MobThresholds
    thresholds:
      0: Alive
      40: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 4.5
    baseSprintSpeed: 5.5
  - type: FSEnemyValue
    killCredits: 120

- type: entity
  id: FSZombieArmoured
  parent: FSZombieNormal
  suffix: Armoured
  name: armoured zombie
  components:
  - type: MobThresholds
    thresholds:
      0: Alive
      300: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 1.2
    baseSprintSpeed: 1.5
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.5
        Slash: 0.6
        Piercing: 0.7
  - type: FSEnemyValue
    killCredits: 200

# ── Shared prying config for all wave enemies ────────────────────────────────
# pryPowered: can open powered airlocks, force: bypass bolted doors,
# speedModifier: 8.0 = ~0.6s pry so BreakOnMove rarely cancels it.
- type: entity
  id: FSMobXeno
  parent: MobXeno
  suffix: FinalStand
  components:
  - type: HTN
    rootTask:
      task: FinalStandEnemyCompound
  - type: Prying
    pryPowered: true
    force: true
    speedModifier: 8.0
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 235
        mask:
        - MobMask
        layer:
        - MobLayer

