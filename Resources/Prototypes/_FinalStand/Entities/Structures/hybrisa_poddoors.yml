- type: entity
  parent: BlastDoor
  id: FSPodDoorHybrisaWhite
  name: podlock
  description: That looks like it doesn't open easily. Maybe look for a button, or bring something heavy.
  components:
  - type: Sprite
    sprite: _FinalStand/Structures/Doors/Shutters/whitepoddoor.rsi
    layers:
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 2
            max: 4
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: FSPodDoorHybrisaWhite
  id: FSPodDoorHybrisaWhiteOpen
  suffix: Open
  components:
  - type: Door
    state: Open
  - type: Occluder
    enabled: false
  - type: Physics
    canCollide: false
  - type: Airtight
    airBlocked: false
  - type: RadiationBlocker
    enabled: false

