# ── Ammo Box - held item (planted via use-in-hand) ────────────────────────────────────────────
- type: entity
  id: FSAmmoBoxItem
  parent: BaseItem
  name: ammo resupply box
  description: A portable resupply crate. Plant it and interact to refill your magazines. Limited uses, and you can lock it to yourself.
  categories: [ HideSpawnMenu ]
  components:
  - type: Item
    size: Normal
  - type: Sprite
    sprite: _FinalStand/Objects/Devices/AmmoBox.rsi
    state: base
  - type: FSDeployableItem
    deployedProtoId: FSAmmoBoxDeployed
    stock: 1
    maxStock: 1
    regenPerWave: 1
    wavesPerRegen: 2
  - type: FSPlaceable
    previewProtoId: FSAmmoBoxDeployed
    range: 6

# ── Ammo Box - placed/anchored ───────────────────────────────────────────────────────────────
- type: entity
  id: FSAmmoBoxDeployed
  name: ammo resupply box
  description: A deployed resupply crate. Interact to refill magazines while it has charges left.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    drawdepth: Objects
    sprite: _FinalStand/Objects/Devices/AmmoBox.rsi
    state: base
  - type: FSAmmoBox
  - type: FSDeployableLifetime
    lifetime: 600
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.35,-0.35,0.35,0.35"
        density: 100
        hard: false
        mask:
        - ItemMask
        layer:
        - MachineLayer
  - type: Anchorable
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: FSPlayerDamageImmune
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 60
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
