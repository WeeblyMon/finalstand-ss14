- type: entity
  id: FSWeaponShopAdvancedLaser
  parent: FSWeaponShopBase
  name: Adv. Laser Pistol
  description: Self-recharging laser pistol. No ammo needed, just point and melt.
  components:
  - type: FSShopWeapon
    weaponProtoId: WeaponAdvancedLaser
    price: 800
    category: Self-Recharging Energy Pistol
    statDamage: 45
    statFireRate: 65
    statAccuracy: 75
    statCapacity: 100
    upgrades:
    - id: advlaser-overcharge-coil
      name: Overcharge Coil
      description: Boosts cycling speed, increasing fire rate by 0.5/level.
      maxLevel: 5
      baseCost: 200
      type: FireRate
      valuePerLevel: 0.5
    - id: advlaser-focusing-lens
      name: Focusing Lens
      description: Narrows beam spread by 0.3° per level for pinpoint accuracy.
      maxLevel: 5
      baseCost: 150
      type: Accuracy
      valuePerLevel: 0.3
    - id: advlaser-rapid-charge
      name: Rapid Charge
      description: Self-recharge rate ×2 per level (×8 at max).
      maxLevel: 3
      baseCost: 300
      type: SelfChargeSpeed
      valuePerLevel: 2.0
    - id: advlaser-ignite
      name: Incendiary Beam
      description: Shots ignite targets on hit.
      maxLevel: 1
      baseCost: 400
      type: SetOnFire
      valuePerLevel: 1
    - id: advlaser-chain-beam
      name: Chain Beam
      description: On hit, damage chains to 1 nearby enemy per level (3 tile range, no falloff, no cascade).
      maxLevel: 3
      baseCost: 450
      type: BeamChaining
      valuePerLevel: 1
  - type: Sprite
    sprite: Objects/Weapons/Guns/Battery/advancedlasergun.rsi
    state: base
    scale: 1,1

