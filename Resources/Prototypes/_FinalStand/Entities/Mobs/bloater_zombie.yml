# FINALSTAND: Bloater — exploding zombie that prioritises players and detonates on death.
# Spawns wave 7+, weighted at ~25% of wave composition via FSFlamethrowerSystem weighted selection.
- type: entity
  parent: FSZombieFootsoldierBase
  id: FSZombieBloater
  name: bloater
  suffix: Bloater
  description: A swollen corpse full of volatile gas. It bursts when it dies, so kill it well away from anyone you like.
  components:
  - type: FSMaterialDrop
    materials:
    - SheetPlasma1
    - SheetPlasma1
    - SheetPlastic1
    - SheetPlastic1
    - MaterialGunpowder
  - type: FSSpecialZombie
  - type: FSEnemyIcon
    iconPath: /Textures/_FinalStand/Mobs/ZombieIcons/boomer.png
  - type: FSBoomOnDeath
    explosionRadius: 4.5
    explosionDamage: 25
    toxinDamage: 75
    slowRadius: 4.5
    slowDuration: 6
    slowAmount: 0.6
  - type: MobThresholds
    thresholds:
      0: Alive
      150: Dead
  - type: FSEnemyValue
    killCredits: 800
  - type: Sprite
    drawdepth: Mobs
    sprite: _FinalStand/Mobs/Zombies/Bloater/fat_zombie.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: base
  - type: FSZombieVisuals
    simpleSpriteMode: true
  - type: FSDeathLoot
    drops:
    - proto: FSResearchDisk
      chance: 0.0005
