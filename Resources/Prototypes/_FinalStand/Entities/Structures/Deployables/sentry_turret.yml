# ── Sentry Turret - deployed ─────────────────────────────────────────────────────────────────
- type: entity
  id: FSSentryTurretDeployed
  name: sentry turret
  description: A deployed autoturret. It tracks and fires on hostiles by itself.
  categories: [ HideSpawnMenu ]
  placement:
    mode: SnapgridCenter
  components:
  - type: FSStructureHealth
  - type: Sprite
    drawdepth: Objects
    noRot: true
    sprite: _FinalStand/Objects/Devices/SentryTurret.rsi
    layers:
    - state: base
      map: [ "turretBase" ]
    - state: turret
      map: [ "gun" ]
  - type: Appearance
  - type: FSSentryTurret
    spriteAngleOffset: 340
  - type: RCDDeconstructable
    cost: 0
    delay: 2
    fx: EffectRCDDeconstruct2
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 190
        # Not hard: a crew-served weapon on the floor, not a barricade. A solid body blocked players
        # from walking past it and stopped their own bullets, per playtester reports.
        hard: false
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: FSPlayerDamageImmune
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

# Cellular spares structures the way FS explosions do, so a turret cannot chew up the station.
- type: entity
  id: FSSentryBullet
  parent: BaseBullet
  name: sentry round
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Cellular: 16
