# ── Baseball Bat Shop ────────────────────────────────────────────────────────
# Crowd-control bruiser. Stun-on-attack via the concussion line.

- type: entity
  id: FSWeaponShopBaseballBat
  parent: FSWeaponShopBase
  name: Baseball Bat
  description: A robust wooden bat. Turns enemies into pulp with the right upgrades.
  components:
  - type: FSShopWeapon
    weaponProtoId: BaseBallBat
    price: 1500
    category: Melee Blunt
    statDamage: 30
    statFireRate: 40
    statAccuracy: 0
    statCapacity: 0
    upgrades:
    - id: bat-heavy-club
      name: Heavy Club
      description: Reinforced barrel adds +80% damage per level.
      maxLevel: 2
      baseCost: 2500
      type: Damage
      valuePerLevel: 0.80
    - id: bat-lucille
      name: Lucille
      description: Enemies hit, and anything a launched body crashes into, bleed for damage over time. +150 bleed per level.
      maxLevel: 3
      baseCost: 1000
      type: Bleed
      valuePerLevel: 1.5
    - id: bat-grand-slam
      name: Grand Slam
      description: A fully charged swing launches twice as far, and its crashes hit for the swing's full damage.
      maxLevel: 1
      baseCost: 6000
      type: MeleeSignature
      signature: GrandSlam
      valuePerLevel: 1
    - id: bat-ricochet
      name: Ricochet
      description: Launched bodies bounce off walls still flying, and can bowl over the same zombies again.
      maxLevel: 1
      baseCost: 5000
      type: MeleeSignature
      signature: Ricochet
      valuePerLevel: 1
    - id: bat-running-start
      name: Running Start
      description: Winding up while sprinting starts the charge half full.
      maxLevel: 1
      baseCost: 3000
      type: MeleeSignature
      signature: RunningStart
      valuePerLevel: 1
    - id: bat-concussion
      name: Concussion
      description: All attacks stun enemies briefly. +2s stun.
      maxLevel: 1
      baseCost: 16000
      type: StunOnHit
      valuePerLevel: 2
    - id: bat-heavy-concussion
      name: Heavy Concussion
      description: Critical hits against stunned enemies.
      maxLevel: 1
      baseCost: 8000
      type: CritVsStunned
      valuePerLevel: 1
  - type: Sprite
    sprite: Objects/Weapons/Melee/baseball_bat.rsi
    state: icon
    scale: 1,1
