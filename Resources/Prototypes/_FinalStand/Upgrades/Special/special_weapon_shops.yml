# ── Special Weapon Shops ──────────────────────────────────────────────────────
# Top-tier end-game weapons. Significantly more expensive than snipers.

- type: entity
  parent: FSWeaponShopBase
  id: FSWeaponShopL6Saw
  name: L6 SAW
  description: Waffle Corp's answer to every problem. 300 rounds of suppressive .30 fire. It doesn't stop.
  components:
  - type: FSShopWeapon
    requiresResearch: FSOrdnanceL6ModernAutomaticSaw
    weaponProtoId: FSWeaponLightMachineGunL6
    price: 140000
    starterAmmoProtoId: FSMagazineLightRifleBox
    starterAmmoCount: 2
    category: fs-weapon-shop-category-30-light-machine-gun
    statDamage: 60
    statFireRate: 75
    statAccuracy: 45
    statCapacity: 90
    upgrades:
    - id: l6-fire-rate
      name: fs-upgrade-l6-fire-rate
      description: fs-upgrade-l6-fire-rate-desc
      maxLevel: 3
      baseCost: 10000
      type: FireRate
      valuePerLevel: 1.5
    - id: l6-accuracy
      name: fs-upgrade-l6-accuracy
      description: fs-upgrade-l6-accuracy-desc
      maxLevel: 3
      baseCost: 9000
      type: Accuracy
      valuePerLevel: 12.0
    - id: l6-mag-size
      name: fs-upgrade-l6-mag-size
      description: fs-upgrade-l6-mag-size-desc
      maxLevel: 3
      baseCost: 10000
      type: MagazineSize
      valuePerLevel: 50
    - id: l6-reload-speed
      name: fs-upgrade-l6-reload-speed
      description: fs-upgrade-l6-reload-speed-desc
      maxLevel: 3
      baseCost: 9000
      type: ReloadSpeed
      valuePerLevel: 0.2
    - id: l6-overclocked
      name: fs-upgrade-l6-overclocked
      description: fs-upgrade-l6-overclocked-desc
      maxLevel: 3
      baseCost: 18000
      type: Overclocked
      valuePerLevel: 1
    - id: l6-damage
      name: fs-upgrade-l6-damage
      description: fs-upgrade-l6-damage-desc
      maxLevel: 4
      baseCost: 11000
      type: Damage
      valuePerLevel: 0.2
  - type: Sprite
    sprite: Objects/Weapons/Guns/LMGs/l6.rsi
    state: base
    scale: 1,1

- type: entity
