- type: entity
  id: WaveSurvivalZombie
  parent: BaseGameRule
  components:
  - type: WaveGameRule
    maxEnemyCap: 800
    killReward: 300
    bossWavePerkReward: 1
    bossPool:
    - FSZombieGiant
    specialEnemyPool:
    - enemyId: FSZombieBloater
      fromWave: 7
      spawnChance: 0.05
    - enemyId: FSZombieFlamethrower
      fromWave: 9
      spawnChance: 0.05
    - enemyId: FSZombieTesla
      fromWave: 11
      spawnChance: 0.05
    - enemyId: FSZombieArmoured
      fromWave: 5
      spawnChance: 0.05
    - enemyId: FSZombieDevastator
      fromWave: 13
      spawnChance: 0.01
    - enemyId: FSZombieRevenant
      fromWave: 15
      spawnChance: 0.03
    prepDuration: 300
    maxCombatDuration: 1800
    factionDisplay: "Undead detected"
    waveStartSound: !type:SoundPathSpecifier
      path: /Audio/_FinalStand/WaveEvents/wave_start.ogg
    waveEndSound: !type:SoundPathSpecifier
      path: /Audio/_FinalStand/WaveEvents/wave_end.ogg
    enemyConfigs:
    # Waves 1-4: normal zombies only — slow pressure, learn the map
    - fromWave: 1
      toWave: 4
      enemyPool:
      - FSZombieNormal
    # Waves 5+: runners added — speed threat introduced
    - fromWave: 5
      enemyPool:
      - FSZombieNormal
      - FSZombieRunner
