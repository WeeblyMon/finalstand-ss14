- type: entity
  id: FSWeaponShopRiotShield
  parent: FSWeaponShopBase
  name: Riot Shield
  description: A heavy riot shield. Blocks incoming damage and repairs itself between waves.
  components:
  - type: FSShopWeapon
    weaponProtoId: FSRiotShield
    price: 2500
    category: Riot Shield
    statDamage: 30
    statFireRate: 0
    statAccuracy: 0
    statCapacity: 0
    upgrades:
    - id: shield-thorns
      name: Thorns
      description: Reflects 10% of absorbed damage back to the attacker per level.
      maxLevel: 2
      baseCost: 4000
      type: Thorns
      valuePerLevel: 0.1
    - id: shield-vampire
      name: Vampire
      description: Heals you for 2.5% of damage absorbed by the shield per level.
      maxLevel: 2
      baseCost: 4500
      type: ShieldVampire
      valuePerLevel: 0.025
    - id: shield-fortification
      name: Fortification
      description: Reduces damage taken while wielding the shield by 15% per level.
      maxLevel: 3
      baseCost: 4000
      type: WielderResistance
      valuePerLevel: 0.15
    - id: shield-melee-damage
      name: Melee Damage
      description: Increases shield bash damage by 10% per level.
      maxLevel: 3
      baseCost: 3500
      type: Damage
      valuePerLevel: 0.1
    - id: shield-durability
      name: Durability
      description: Doubles the shield's hit point threshold before it breaks.
      maxLevel: 3
      baseCost: 2500
      type: ShieldDurability
      valuePerLevel: 1.0
  - type: Sprite
    sprite: Objects/Weapons/Melee/shields.rsi
    state: riot-icon
    scale: 1,1
