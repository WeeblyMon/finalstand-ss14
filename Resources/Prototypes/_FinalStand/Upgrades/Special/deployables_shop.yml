# ── SCI Deployables ──────────────────────────────────────────────────────────────────────────
- type: entity
  id: FSDeployableShopNullField
  parent: FSWeaponShopBase
  name: Null Field Emitter
  description: A portable stasis-field emitter. Slows enemies caught in its radius. Diminishing returns - overlapping fields don't stack.
  components:
  - type: FSShopWeapon
    weaponProtoId: FSNullFieldItem
    requiresScience: true
    singlePurchase: true
    price: 3000
    category: Area Denial Deployable
    statDamage: 0
    statFireRate: 0
    statAccuracy: 0
    statCapacity: 0
    upgrades:
    - id: null-field-capacity
      name: Extra Charge
      description: Carry one additional Null Field charge.
      maxLevel: 1
      baseCost: 3000
      type: DeployableCapacity
      valuePerLevel: 1
  - type: Sprite
    sprite: _FinalStand/Objects/Devices/NullField.rsi
    state: icon
    scale: 1,1

- type: entity
  id: FSDeployableShopDamageBeacon
  parent: FSWeaponShopBase
  name: Damage Beacon
  description: A portable targeting beacon. Amplifies damage dealt to enemies in its radius. Diminishing returns - overlapping beacons don't stack.
  components:
  - type: FSShopWeapon
    weaponProtoId: FSDamageBeaconItem
    requiresScience: true
    singlePurchase: true
    price: 3500
    category: Area Denial Deployable
    statDamage: 0
    statFireRate: 0
    statAccuracy: 0
    statCapacity: 0
    upgrades:
    - id: damage-beacon-capacity
      name: Extra Charge
      description: Carry one additional Damage Beacon charge.
      maxLevel: 1
      baseCost: 3000
      type: DeployableCapacity
      valuePerLevel: 1
  - type: Sprite
    sprite: _FinalStand/Objects/Devices/DamageBeacon.rsi
    state: icon
    scale: 1,1

- type: entity
  id: FSDeployableShopLandmine
  parent: FSWeaponShopBase
  name: Landmines
  description: Proximity mines that arm a few seconds after planting and detonate once. They shred anything organic in the blast and leave the station untouched.
  components:
  - type: FSShopWeapon
    weaponProtoId: FSLandmineItem
    requiresScience: false
    singlePurchase: true
    price: 6500
    category: Area Denial Deployable
    statDamage: 70
    statFireRate: 0
    statAccuracy: 0
    statCapacity: 30
    upgrades:
    - id: landmine-capacity
      name: Extra Mines
      description: Carry one additional mine per level.
      maxLevel: 2
      baseCost: 4000
      type: DeployableCapacity
      valuePerLevel: 1
    - id: landmine-damage
      name: Dense Filler
      description: Each level adds a quarter of the mine's base blast damage.
      maxLevel: 3
      baseCost: 5000
      type: LandmineDamage
      valuePerLevel: 2.5
    - id: landmine-detonations
      name: Reusable Core
      description: The mine re-arms itself after going off, one extra time per level.
      maxLevel: 2
      baseCost: 3000
      type: LandmineDetonations
      valuePerLevel: 1
    - id: landmine-regen
      name: Field Fabricator
      description: Restock one more mine each wave.
      maxLevel: 2
      baseCost: 4000
      type: DeployableRegen
      valuePerLevel: 1
    - id: landmine-he
      name: High Explosive
      description: Widens the blast to cover a three by three area.
      maxLevel: 1
      baseCost: 10000
      type: LandmineHighExplosive
      valuePerLevel: 1
  - type: Sprite
    sprite: Objects/Misc/landmine.rsi
    state: landmine
    scale: 1,1

- type: entity
  id: FSDeployableShopAmmoBox
  parent: FSWeaponShopBase
  name: Ammo Resupply Box
  description: A portable resupply crate with a limited pool of uses. Its owner can lock it so only they can draw from it.
  components:
  - type: FSShopWeapon
    weaponProtoId: FSAmmoBoxItem
    requiresScience: false
    singlePurchase: true
    price: 5000
    category: Support Deployable
    statDamage: 0
    statFireRate: 0
    statAccuracy: 0
    statCapacity: 40
    upgrades:
    - id: ammo-box-uses
      name: Deeper Stock
      description: One extra resupply use per level.
      maxLevel: 2
      baseCost: 4000
      type: AmmoBoxUses
      valuePerLevel: 1
    - id: ammo-box-speed
      name: Quick Release
      description: Cuts the time it takes to draw a resupply.
      maxLevel: 3
      baseCost: 3000
      type: AmmoBoxSpeed
      valuePerLevel: 0.7
  - type: Sprite
    sprite: _FinalStand/Objects/Devices/AmmoBox.rsi
    state: base
    scale: 1,1

# ── Medical Deployables ──────────────────────────────────────────────────────────────────────
- type: entity
  id: FSDeployableShopMediDrone
  parent: FSWeaponShopBase
  name: Medi-Drone
  description: A healing drone that follows you and beams wounded allies nearby up to half health. Burns out when its charge runs dry.
  components:
  - type: FSShopWeapon
    weaponProtoId: FSMediDroneItem
    requiresResearch: FSMedicalMediDrone
    requiresMedical: true
    singlePurchase: true
    price: 3000
    category: Medical Deployable
    statDamage: 0
    statFireRate: 0
    statAccuracy: 0
    statCapacity: 0
    upgrades:
    - id: medi-drone-capacity
      name: Spare Drone
      description: Carry one more Medi-Drone for when the first burns out.
      maxLevel: 1
      baseCost: 3000
      type: DeployableCapacity
      valuePerLevel: 1
  - type: Sprite
    sprite: _FinalStand/Objects/Medical/medidrone.rsi
    state: full
    scale: 1,1
