# ── FSZombie types ──────────────────────────────────────────────────────────

- type: entity
  id: FSZombieBase
  parent: SimpleSpaceMobBase
  abstract: true
  suffix: FinalStand
  components:
  - type: Body
  - type: InitialBody
    # organs come from BodyOrgansnull
  - type: InputMover
  - type: MobMover
  - type: HTN
    rootTask:
      task: FinalStandEnemyCompound
    # FINALSTAND: 1s minimum replan interval — balances fast door/obstacle recovery
    # against stop-start twitching. Original 3s caused multi-second stalls at open airlocks.
    planCooldown: 1.0
    blackboard:
      NavPry: !type:Bool
        false
      NavSmash: !type:Bool
        true
      NavInteract: !type:Bool
        false
  - type: NpcFactionMember
    factions:
    - FSZombie
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    animation: WeaponArcClaw
    soundHit:
      path: /Audio/Weapons/Xeno/alien_claw_flesh3.ogg
    damage:
      types:
        Slash: 10
  - type: Sprite
    drawdepth: Mobs
    sprite: _FinalStand/Mobs/Zombies/zombie.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: base
  - type: FSZombieVisuals
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.25
        density: 235
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Blood
        Quantity: 20
  - type: Tag
    # FS: StunImmune blocks ALL vanilla stun sources (batons, flashes, slipping, etc.) so players
    # can't trivialise waves by farming free stuns from station gear. FS shop upgrades (Concussion,
    # Heavy Concussion, etc.) bypass this via FSStunOverrideSystem which strips + restores the tag
    # for the duration of the stun call.
    tags:
    - StunImmune
  - type: MovementIgnoreGravity
  - type: Stamina
    baseCritThreshold: 100
    stunTime: 0.3
    decay: 45
  - type: WaveSpawnedTag
  - type: IgnoreSlowOnDamage
  - type: FSWaveDamageScale
  - type: ConveyorImmune
  - type: ContainmentFieldImmune
  - type: FSMoneyOnHitCap
    maxMoneyPerPlayer: 450
  - type: Climbing
  - type: Flammable
    fireSpread: false

# Shared stat base for foot-soldier tier zombies — no FSVaporiseWeak here so that
# only Normal and Runner (which add it explicitly) are vaporisable.
- type: entity
  id: FSZombieFootsoldierBase
  parent: FSZombieBase
  abstract: true
  components:
  - type: MobThresholds
    thresholds:
      0: Alive
      75: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.0
    baseSprintSpeed: 2.5
  - type: FSEnemyValue
    killCredits: 150

- type: entity
  id: FSZombieNormal
  parent: FSZombieFootsoldierBase
  suffix: Normal
  name: zombie
  components:
  - type: FSVaporiseWeak

- type: entity
  id: FSZombieRunner
  parent: FSZombieFootsoldierBase
  suffix: Runner
  name: runner zombie
  components:
  - type: FSVaporiseWeak
  - type: FSEnemyIcon
    iconPath: /Textures/_FinalStand/Mobs/ZombieIcons/runner.png
  - type: Sprite
    drawdepth: Mobs
    sprite: _FinalStand/Mobs/Zombies/runner.rsi/sprinter_zombie.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: base
  - type: FSZombieVisuals
    simpleSpriteMode: true
  - type: MobThresholds
    thresholds:
      0: Alive
      40: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.6
    baseSprintSpeed: 4.4
  - type: FSEnemyValue
    killCredits: 180

- type: entity
  id: FSZombieArmoured
  parent: FSZombieFootsoldierBase
  suffix: Armoured
  name: armoured zombie
  components:
  - type: FSEnemyIcon
    iconPath: /Textures/_FinalStand/Mobs/ZombieIcons/armoured-zombie.png
  - type: Sprite
    drawdepth: Mobs
    sprite: _FinalStand/Mobs/Zombies/armoured.rsi/armored_zombie_1.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: base
  - type: FSZombieVisuals
    simpleSpriteMode: true
  - type: MobThresholds
    thresholds:
      0: Alive
      150: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 1.2
    baseSprintSpeed: 1.5
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.5
        Slash: 0.6
        Piercing: 0.7
  - type: FSEnemyValue
    killCredits: 300
  - type: FSMoneyOnHitCap
    maxMoneyPerPlayer: 750
  - type: FSArmor
    maxHPRatio: 1.0
    regenRate: 10
  - type: FSArmouredDeflect
  - type: PointLight
    enabled: false
    color: "#AAAAAA"
    radius: 2.0
    energy: 3.0
    softness: 1.0
  - type: FSDeathLoot
    drops:
    - proto: FSResearchDisk
      chance: 0.0005

# TODO(finalstand): add ArmorComponent when FSZombieDestroyer is implemented
# maxHPRatio: 0.7, regenRate: 10 (tankier by design — targets infrastructure)
- type: entity
  id: FSZombieDestroyer
  parent: FSZombieBase
  suffix: Destroyer
  name: destroyer zombie
  abstract: true
  components:
  - type: MobThresholds
    thresholds:
      0: Alive
      500: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 1.0
    baseSprintSpeed: 1.3
  - type: FSEnemyValue
    killCredits: 525
  - type: FSMoneyOnHitCap
    maxMoneyPerPlayer: 1500

# TODO(finalstand): add ArmorComponent when FSZombieBerserker is implemented
# maxHPRatio: 0.2, regenRate: 10 (light armor — enrage mechanic is the real threat)
# NOTE: Berserker enrages at 50% HP regardless of armor state.
- type: entity
  id: FSZombieBerserker
  parent: FSZombieBase
  suffix: Berserker
  name: berserker zombie
  abstract: true
  components:
  - type: MobThresholds
    thresholds:
      0: Alive
      200: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.5
    baseSprintSpeed: 3.5
  - type: FSEnemyValue
    killCredits: 450
  - type: FSMoneyOnHitCap
    maxMoneyPerPlayer: 1500

- type: entity
  id: FSZombieGiant
  parent: FSZombieBase
  suffix: Giant
  name: giant zombie
  # HP scaling: ScaleEnemyHp is called explicitly in WaveGameRuleSystem.StartCombatPhase
  # when spawning boss waves, same as normal enemies. MobThresholdsComponent present via
  # inheritance from FSZombieBase → ScaleEnemyHp will apply the correct wave multiplier.
  components:
  - type: FSEnemyIcon
    iconPath: /Textures/_FinalStand/Mobs/ZombieIcons/giantzombie.png
  - type: MobThresholds
    thresholds:
      0: Alive
      800: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.0
    baseSprintSpeed: 2.5
  - type: FSEnemyValue
    killCredits: 1500
  - type: FSMoneyOnHitCap
    maxMoneyPerPlayer: 1500
  - type: FSDeathLoot
    drops:
    # Both listed: a child component merges field-wise with its parent, so the base's disk
    # is not inherited alongside a new entry.
    - proto: ArtifactFragment
      chance: 1.0
    - proto: FSResearchDisk
      chance: 0.0005
  - type: FSArmor
    maxHPRatio: 0.4
    regenRate: 10
  - type: Sprite
    drawdepth: Mobs
    sprite: _FinalStand/Mobs/Zombies/tank.rsi
    layers:
    - map: ["giantzombie_torso"]
      state: torso
    - map: ["giantzombie_head"]
      state: head
    - map: ["giantzombie_left_arm"]
      state: left_arm
    - map: ["giantzombie_right_arm"]
      state: right_arm
    - map: ["giantzombie_left_leg"]
      state: left_leg
    - map: ["giantzombie_right_leg"]
      state: right_leg
  - type: FSGiantZombieVisuals
  # Hitbox scaled to 1.5x normal zombie radius (0.25 * 1.5 = 0.375).
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.375
        density: 235
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: FSGiantStomp
  - type: Tag
    tags:
    - StunImmune
    - FootstepSound
  - type: FootstepModifier
    footstepSoundCollection:
      params:
        volume: 3
      collection: FSGiantZombieFootstep

# ── Giant zombie debris — spawned on floor when parts are blown off ──────────

- type: entity
  id: FSGiantZombieGibBase
  abstract: true
  categories: [ HideSpawnMenu ]
  components:
  - type: Physics
    bodyType: Dynamic
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.15
        mask: []
        layer: []
  - type: TimedDespawn
    lifetime: 8.0

- type: entity
  id: FSGiantZombieArmFloor
  parent: FSGiantZombieGibBase
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _FinalStand/Mobs/Zombies/tank_bodyparts.rsi
    state: arm_removed

- type: entity
  id: FSGiantZombieHeadFloor
  parent: FSGiantZombieGibBase
  categories: [ HideSpawnMenu ]
