# ── Energy shotgun laser (+100% vs BulletLaser Heat 13 → 40) ─────────────────
- type: entity
  parent: BulletLaser
  id: FSBulletLaserShotgun
  categories: [ HideSpawnMenu ]
  components:
  - type: Appearance
  - type: FSNoStructureDamage
  # Second hard fixture so walls actually deflect it; FSRicochetSystem vetoes it against mobs.
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.15,-0.3,0.15,0.3"
        hard: false
        mask:
        - Opaque
        - Impassable
        - BulletImpassable
      bounce:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.15,-0.3,0.15,0.3"
        hard: true
        restitution: 1
        friction: 0
        density: 2
        mask:
        - BulletImpassable
      fly-by:
        shape: !type:PhysShapeCircle
          radius: 1.5
        layer:
        - Impassable
        - MidImpassable
        - HighImpassable
        - LowImpassable
        hard: false
  - type: Projectile
    damage:
      types:
        Heat: 102
  - type: PointLight
    castShadows: false
    color: "#FF6600"
    radius: 1.5
    energy: 4.0

- type: entity
  parent: FSBulletLaserShotgun
  id: FSBulletLaserShotgunFragment
  categories: [ HideSpawnMenu ]
  components:
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.15,-0.3,0.15,0.3"
        hard: false
        mask:
        - Opaque
        - Impassable
