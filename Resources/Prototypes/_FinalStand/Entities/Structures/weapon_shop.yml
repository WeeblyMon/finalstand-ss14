- type: entity
  id: FSWeaponShopBase
  abstract: true
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.2,-0.2,0.2,0.2"
        density: 100
        mask:
        - ItemMask
        layer:
        - WallLayer
  - type: Sprite
    drawdepth: SmallObjects
  - type: ActivatableUI
    key: enum.FSShopWeaponUiKey.Key
  - type: UserInterface
    interfaces:
      enum.FSShopWeaponUiKey.Key:
        type: FSShopWeaponBoundUserInterface

- type: entity
  id: FSWeaponShopViper
  parent: FSWeaponShopBase
  name: Viper
  description: A Syndicate-modified 9mm pistol. Semi-auto and full-auto.
  components:
  - type: FSShopWeapon
    weaponProtoId: WeaponPistolViper
    price: 3000
    starterAmmoProtoId: MagazinePistolHighCapacity
    starterAmmoCount: 2
    category: 9mm Semi/Full-Auto Pistol
    statDamage: 35
    statFireRate: 80
    statAccuracy: 55
    statCapacity: 75
    upgrades:
    - id: viper-hair-trigger
      name: Hair Trigger
      description: Lighter pull increases fire rate by 1.5/level.
      maxLevel: 5
      baseCost: 450
      type: FireRate
      valuePerLevel: 1.5
    - id: viper-extended-mag
      name: Extended Mag
      description: Adds 5 rounds to magazine capacity per level.
      maxLevel: 5
      baseCost: 450
      type: MagazineSize
      valuePerLevel: 5
    - id: viper-recoil-pad
      name: Recoil Pad
      description: Reduces max spread by 0.3° per level for tighter bursts.
      maxLevel: 5
      baseCost: 450
      type: Accuracy
      valuePerLevel: 0.3
    - id: viper-akimbo
      name: Akimbo
      description: Dual wield. A second Viper spawns in your off-hand. Fire alternates between both. Accuracy suffers.
      maxLevel: 1
      baseCost: 2400
      type: Akimbo
      valuePerLevel: 1
    - id: viper-hollow-point
      name: Hollow Point
      description: Bullets slow hit enemies by 30% for 2 seconds. Hitting again resets the timer.
      maxLevel: 1
      baseCost: 800
      type: Slowing
      valuePerLevel: 1
    - id: viper-recoil-comp
      name: Recoil Compensator
      description: Dynamic recoil reduction. (Coming soon.)
      maxLevel: 1
      baseCost: 450
      type: Recoil
      valuePerLevel: 1
      isStub: true
  - type: Sprite
    sprite: Objects/Weapons/Guns/Pistols/viper.rsi
    state: base
    scale: 1,1

