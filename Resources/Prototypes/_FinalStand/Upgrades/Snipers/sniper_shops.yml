    weaponProtoId: WeaponRifleEstoc
    price: 70000
    starterAmmoProtoId: MagazineRifle
    starterAmmoCount: 2
    category: .20 Burst-Fire DMR
    statDamage: 75
    statFireRate: 50
    statAccuracy: 80
    statCapacity: 65
    upgrades:
    - id: estoc-full-auto
      name: Custom Receiver
      description: Fully automatic conversion. Removes burst mode.
      maxLevel: 1
      baseCost: 9000
      type: FullAuto
      valuePerLevel: 1
    - id: estoc-damage
      name: Match Grade Ammo
      description: Precision-loaded ammunition increases damage by 35% per level.
      maxLevel: 4
      baseCost: 5500
      type: Damage
      valuePerLevel: 0.35
    - id: estoc-extended-mag
      name: Extended Magazine
      description: Extended magazine adds 10 rounds per level.
      maxLevel: 2
      baseCost: 5500
      type: MagazineSize
      valuePerLevel: 10
    - id: estoc-hv-rounds
      name: HV Rounds
      description: High-velocity ammunition increases projectile speed by 50% per level.
      maxLevel: 2
      baseCost: 6500
      type: Range
      valuePerLevel: 10
    - id: estoc-fast-hands
      name: Fast Hands
      description: Decreases reload time by 10% per level.
      maxLevel: 3
      baseCost: 5000
      type: ReloadSpeed
      valuePerLevel: 0.1
    - id: estoc-lucky-shot
      name: Lucky Shot
      description: Adds a 5% critical hit chance per level.
      maxLevel: 5
      baseCost: 4500
      type: CritChance
      valuePerLevel: 0.05
    - id: estoc-pierce
      name: Piercing Rounds
      description: Armor-piercing rounds pierce through enemies. Each level adds one additional target.
      maxLevel: 2
      baseCost: 7000
      type: Pierce
      valuePerLevel: 1
  - type: Sprite
    sprite: Objects/Weapons/Guns/Rifles/estoc.rsi
    state: base
    rotation: 45
    scale: 1,1

