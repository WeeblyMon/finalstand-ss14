# Broadsword weapons on Monolith's mount sizes. Ballistics are Monolith's combat guns, retuned for zombies; Engineering builds them at the Mech Bay.
# Energy guns are Goob-Station's; Science prints them. Every gun runs off a cell the mech tops up from its own power.
- type: Tag
  id: LightMechMount

- type: Tag
  id: MediumMechMount

- type: Tag
  id: HeavyMechMount

- type: entity
  id: FSBaseMechWeapon
  parent: BaseMechEquipment
  abstract: true
  components:
  - type: Battery
    maxCharge: 100
    startingCharge: 100
  - type: Appearance
  - type: AmmoCounter

- type: entity
  id: FSBaseMechWeaponLight
  parent: FSBaseMechWeapon
  abstract: true
  components:
  - type: Tag
    tags:
    - LightMechMount

- type: entity
  id: FSBaseMechWeaponMedium
  parent: FSBaseMechWeapon
  abstract: true
  components:
  - type: Tag
    tags:
    - MediumMechMount

- type: entity
  id: FSBaseMechWeaponHeavy
  parent: FSBaseMechWeapon
  abstract: true
  components:
  - type: Tag
    tags:
    - HeavyMechMount

- type: entity
  id: FSMechWeaponAutocannon
  parent: FSBaseMechWeaponLight
  name: LAC-29 35mm autocannon
  description: The everyman's mech rifle. Steady armour-piercing rounds. Light mount.
  components:
  - type: FSMechMountVisual
    state: assaultrifle
  - type: Sprite
    sprite: _FinalStand/Objects/Mech/tgmc_mecha_weapons.rsi
    state: assaultrifle64x32
  - type: Gun
    projectileSpeed: 40
    fireRate: 2.5
    minAngle: 0
    maxAngle: 15
    angleIncrease: 1
    angleDecay: 15
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/_FinalStand/Weapons/Mech/slammer.ogg
  - type: Battery
    maxCharge: 180
    startingCharge: 180
  - type: BatteryAmmoProvider
    proto: FSMech35mmBullet
    fireCost: 10

- type: entity
  id: FSMechWeaponRotary
  parent: FSBaseMechWeaponLight
  name: RAC-6 rotary machine gun
  description: A six-barrel gatling gun. Buries a crowd in rounds up close. Light mount.
  components:
  - type: FSMechMountVisual
    state: smg
  - type: Sprite
    sprite: _FinalStand/Objects/Mech/tgmc_mecha_weapons.rsi
    state: smg64x32
  - type: Gun
    projectileSpeed: 30
    fireRate: 14
    minAngle: 0
    maxAngle: 35
    angleIncrease: 1
    angleDecay: 20
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/minigun.ogg
  - type: BatteryAmmoProvider
    proto: FSMechRotaryBullet
    fireCost: 3

- type: entity
  id: FSMechWeaponShotgun
  parent: FSBaseMechWeaponLight
  name: SH-0.5 shotgun
  description: A mech-grade shotgun throwing six heavy pellets a shot. Light mount.
  components:
  - type: FSMechMountVisual
    state: shotgun
  - type: Sprite
    sprite: _FinalStand/Objects/Mech/tgmc_mecha_weapons.rsi
    state: shotgun64x32
  - type: Gun
    projectileSpeed: 30
    fireRate: 2
    minAngle: 0
    maxAngle: 30
    angleIncrease: 10
    angleDecay: 5
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/lmg.ogg
  - type: BatteryAmmoProvider
    proto: FSMechPelletSpread
    fireCost: 8

- type: entity
  id: FSMechWeaponDMR
  parent: FSBaseMechWeaponMedium
  name: DMR-90mm autocannon
  description: A heavy autocannon whose shells burst on impact. Medium mount.
  components:
  - type: FSMechMountVisual
    state: sniper
  - type: Sprite
    sprite: _FinalStand/Objects/Mech/tgmc_mecha_weapons.rsi
    state: sniper64x32
  - type: Gun
    projectileSpeed: 45
    fireRate: 2
    minAngle: 0
    maxAngle: 10
    angleIncrease: 1.5
    angleDecay: 10
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/_FinalStand/Weapons/Mech/uaf_57mm.ogg
  - type: Battery
    maxCharge: 200
    startingCharge: 200
  - type: BatteryAmmoProvider
    proto: FSMech90mmShell
    fireCost: 17

- type: entity
  id: FSMechWeaponMetronome
  parent: FSBaseMechWeaponHeavy
  name: 220mm "Metronome" burst cannon
  description: Fires three high-explosive shells, then cools down. Heavy mount.
  components:
  - type: FSMechMountVisual
    state: heavycannon
  - type: Sprite
    sprite: _FinalStand/Objects/Mech/tgmc_mecha_weapons.rsi
    state: heavycannon64x32
  - type: Gun
    projectileSpeed: 40
    fireRate: 3
    burstFireRate: 3
    shotsPerBurst: 3
    burstCooldown: 2
    minAngle: 0
    maxAngle: 12
    angleIncrease: 1
    angleDecay: 20
    selectedMode: Burst
    availableModes:
    - Burst
    soundGunshot:
      path: /Audio/_FinalStand/Weapons/Mech/120mm_mortar.ogg
  - type: Battery
    maxCharge: 300
    startingCharge: 300
  - type: BatteryAmmoProvider
    proto: FSMech120mmShell
    fireCost: 17
  - type: FSMechCycleSound
    sound:
      path: /Audio/Weapons/Guns/Cock/lmg_cock.ogg

- type: entity
  id: FSMechWeaponBazooka
  parent: FSBaseMechWeaponHeavy
  name: R3 "Bazooka" rocket system
  description: Slow, unguided rockets with a wide blast. Heavy mount.
  components:
  - type: FSMechMountVisual
    state: rpg
  - type: Sprite
    sprite: _FinalStand/Objects/Mech/tgmc_mecha_weapons.rsi
    state: rpg64x32
  - type: Gun
    fireRate: 0.6
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/rpgfire.ogg
  - type: Battery
    maxCharge: 500
    startingCharge: 500
  - type: BatteryAmmoProvider
    proto: FSMechRocket
    fireCost: 42
  - type: FSMechCycleSound
    sound:
      path: /Audio/Weapons/Guns/MagIn/rifle_load.ogg
    delay: 0.45

- type: entity
  id: FSMechWeaponFiredart
  parent: FSBaseMechWeaponLight
  name: CH-PS "Firedart" laser
  description: The standard mounted laser. Cheap to run. Light mount.
  components:
  - type: FSMechMountVisual
    state: laserrifle
  - type: Sprite
    state: mecha_laser
  - type: Gun
    fireRate: 2
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser.ogg
  - type: BatteryAmmoProvider
    proto: FSMechRedLaser
    fireCost: 2

- type: entity
  id: FSMechWeaponSolaris
  parent: FSBaseMechWeaponMedium
  name: CH-LC "Solaris" laser cannon
  description: A fast-firing mounted laser that drinks power. Medium mount.
  components:
  - type: FSMechMountVisual
    state: laserrifle
  - type: Sprite
    sprite: _FinalStand/Objects/Mech/tgmc_mecha_weapons.rsi
    state: laserrifle64x32
  - type: Gun
    fireRate: 3
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser.ogg
  - type: BatteryAmmoProvider
    proto: FSMechRedMediumLaser
    fireCost: 5

- type: entity
  id: FSMechWeaponPulseRifle
  parent: FSBaseMechWeaponMedium
  name: eZ-14 heavy pulse rifle
  description: Fires heavy pulse bolts. Medium mount.
  components:
  - type: FSMechMountVisual
    state: laserrifle
  - type: Sprite
    state: mecha_pulse
  - type: Gun
    fireRate: 2
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser3.ogg
  - type: BatteryAmmoProvider
    proto: FSMechPulse
    fireCost: 7

- type: entity
  id: FSMechWeaponTesla
  parent: FSBaseMechWeaponHeavy
  name: P-X tesla cannon
  description: Throws slow balls of lightning that arc between zombies. Heavy mount.
  components:
  - type: FSMechMountVisual
    state: tow
  - type: Sprite
    state: mecha_wholegen
  - type: Gun
    projectileSpeed: 6
    fireRate: 0.8
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/Effects/Lightning/lightningshock.ogg
      params:
        variation: 0.2
  - type: BatteryAmmoProvider
    proto: FSMechTeslaBullet
    fireCost: 16
  - type: FSMechCycleSound
    sound:
      path: /Audio/_FinalStand/Weapons/Mech/tesla_charge.ogg
    delay: 0.1

- type: entity
  id: FSMechWeaponRavager
  parent: FSBaseMechWeaponHeavy
  name: RAVAGER plasma cannon
  description: Sprays wide, short-lived plasma bolts. Devastating up close. Heavy mount.
  components:
  - type: FSMechMountVisual
    state: flamer
  - type: Sprite
    sprite: _FinalStand/Objects/Mech/tgmc_mecha_weapons.rsi
    state: flamer64x32
  - type: Gun
    projectileSpeed: 25
    minAngle: 0
    maxAngle: 30
    fireRate: 1.5
    angleIncrease: 3
    angleDecay: 15
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser_cannon2.ogg
  - type: Battery
    maxCharge: 300
    startingCharge: 300
  - type: BatteryAmmoProvider
    proto: FSMechPlasmaBolt
    fireCost: 17

- type: entity
  id: FSMech35mmBullet
  parent: BaseBullet
  name: 35mm round
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 960
        Structural: 1200
  - type: TimedDespawn
    lifetime: 3

- type: entity
  id: FSMechRotaryBullet
  parent: BaseBullet
  name: .45 round
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 330
  - type: TimedDespawn
    lifetime: 2

- type: entity
  id: FSMechPellet
  parent: BaseBullet
  name: heavy pellet
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles2.rsi
    state: buckshot
  - type: Projectile
    damage:
      types:
        Piercing: 480

- type: entity
  id: FSMechPelletSpread
  parent: FSMechPellet
  categories: [ HideSpawnMenu ]
  components:
  - type: ProjectileSpread
    proto: FSMechPellet
    count: 6
    spread: 15

- type: entity
  id: FSMech90mmShell
  parent: BaseBulletTrigger
  name: 90mm shell
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 1500
  - type: Sprite
    sprite: _FinalStand/Objects/Mech/mech_shell.rsi
    layers:
    - state: base-projectile
  - type: PointLight
    radius: 3.5
    energy: 0.5
    color: orange
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Default
    totalIntensity: 12
    intensitySlope: 4
    maxIntensity: 3
    maxTileBreak: 0
  - type: TimedDespawn
    lifetime: 4

- type: entity
  id: FSMech120mmShell
  parent: BulletRocket
  name: 120mm shell
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 1350
        Blunt: 900
  - type: Sprite
    sprite: _FinalStand/Objects/Mech/mech_shell.rsi
    layers:
    - state: base-projectile
  - type: Explosive
    explosionType: Default
    maxIntensity: 8
    intensitySlope: 6
    totalIntensity: 20
    maxTileBreak: 0
  - type: TimedDespawn
    lifetime: 5

- type: entity
  id: FSMechRocket
  parent: BulletRocket
  name: 280mm rocket
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Blunt: 2400
        Heat: 1200
  - type: Explosive
    explosionType: Default
    maxIntensity: 15
    intensitySlope: 4
    totalIntensity: 80
    maxTileBreak: 0
  - type: TimedDespawn
    lifetime: 6

- type: entity
  id: FSMechPlasmaBolt
  parent: BaseBullet
  name: plasma bolt
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles_tg.rsi
    layers:
    - state: omnilaser
      shader: unshaded
  - type: Projectile
    damage:
      types:
        Heat: 1350
  - type: PointLight
    radius: 2
    energy: 1
    color: "#d94cff"
  - type: TimedDespawn
    lifetime: 0.8

- type: entity
  id: FSMechWeaponSkyfall
  parent: FSBaseMechWeaponHeavy
  name: '"Skyfall" swarm pod'
  description: Fires twelve micro-missiles that climb, then dive onto zombies the mech can see. Long reload. Heavy mount.
  components:
  - type: FSMechMountVisual
    state: missilerack
  - type: Sprite
    sprite: Objects/Specific/Mech/mecha_equipment.rsi
    state: mecha_missilerack_six
  - type: Gun
    projectileSpeed: 9
    fireRate: 20
    burstFireRate: 20
    shotsPerBurst: 12
    burstCooldown: 8
    minAngle: 30
    maxAngle: 70
    angleIncrease: 4
    angleDecay: 20
    selectedMode: Burst
    availableModes:
    - Burst
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/rocket_launcher.ogg
      params:
        volume: -8
        pitch: 1.4
  - type: Battery
    maxCharge: 600
    startingCharge: 600
  - type: BatteryAmmoProvider
    proto: FSSkyfallMissile
    fireCost: 8
  - type: FSSkyfallLauncher
  - type: FSMechCycleSound
    sound:
      path: /Audio/Weapons/Guns/MagIn/m41_reload.ogg

- type: entity
  id: FSSkyfallMissile
  parent: BaseBullet
  name: micro-missile
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    noRot: false
    layers:
    - texture: /Textures/_FinalStand/Effects/Particles/dot.png
      color: "#00000070"
      scale: 0.5, 0.5
    - sprite: Objects/Weapons/Guns/Projectiles/projectiles2.rsi
      state: frag
      scale: 0.7, 0.7
      map: [ "missile" ]
  - type: Projectile
    damage:
      types:
        Blunt: 300
        Heat: 240
  - type: FSSkyfallMissile
    splashDamage:
      types:
        Heat: 180
  - type: TimedDespawn
    lifetime: 3

- type: entity
  id: FSSkyfallBlast
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    drawdepth: Effects
    sprite: Effects/explosion.rsi
    layers:
    - state: explosionfast
      shader: unshaded
      scale: 0.35, 0.35
  - type: PointLight
    radius: 2
    energy: 2.5
    color: "#ffb35c"
  - type: EmitSoundOnSpawn
    sound:
      path: /Audio/Effects/explosion_small1.ogg
      params:
        volume: -8
        variation: 0.15
  - type: TimedDespawn
    lifetime: 0.48

- type: entity
  parent: RedLaser
  id: FSMechRedLaser
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanBasicDamage
    damage:
      types:
        Heat: 420

- type: entity
  parent: RedMediumLaser
  id: FSMechRedMediumLaser
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanBasicDamage
    damage:
      types:
        Heat: 510

- type: entity
  parent: Pulse
  id: FSMechPulse
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanBasicDamage
    damage:
      types:
        Heat: 1050

- type: entity
  parent: TeslaGunBullet
  id: FSMechTeslaBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    deleteOnCollide: false
    damage:
      types:
        Piercing: 420
    soundHit:
      path: /Audio/Weapons/Guns/Hits/bullet_hit.ogg
