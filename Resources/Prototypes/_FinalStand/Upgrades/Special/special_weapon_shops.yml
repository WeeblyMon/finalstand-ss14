# ── Special Weapon Shops ──────────────────────────────────────────────────────
# Top-tier end-game weapons. Significantly more expensive than snipers.

- type: entity
  id: FSWeaponShopL6Saw
  parent: FSWeaponShopBase
  name: L6 SAW
  description: Waffle Corp's answer to every problem. 300 rounds of suppressive .30 fire. It doesn't stop.
  components:
  - type: FSShopWeapon
    requiresResearch: FSOrdnanceL6ModernAutomaticSaw
    weaponProtoId: FSWeaponLightMachineGunL6
    price: 140000
    starterAmmoProtoId: FSMagazineLightRifleBox
    starterAmmoCount: 2
    category: .30 Light Machine Gun
    statDamage: 60
    statFireRate: 75
    statAccuracy: 45
    statCapacity: 90
    upgrades:
    - id: l6-fire-rate
      name: Shredder
      description: Optimized cycling increases fire rate by 1.5/level.
      maxLevel: 3
      baseCost: 10000
      type: FireRate
      valuePerLevel: 1.5
    - id: l6-accuracy
      name: Bipod
      description: Folding bipod tightens spread by 12° per level.
      maxLevel: 3
      baseCost: 9000
      type: Accuracy
      valuePerLevel: 12.0
    - id: l6-mag-size
      name: Extended Belt
      description: Larger ammo drum adds 50 rounds per level.
      maxLevel: 3
      baseCost: 10000
      type: MagazineSize
      valuePerLevel: 50
    - id: l6-reload-speed
      name: Speed Belt
      description: Quick-release mechanism reduces reload time by 20% per level.
      maxLevel: 3
      baseCost: 9000
      type: ReloadSpeed
      valuePerLevel: 0.2
    - id: l6-overclocked
      name: Overclocked
      description: Sustained fire spools the barrel, ramping fire rate up to +1.2/level at full heat. The barrel glows red as it spools. Heat bleeds off when you stop firing.
      maxLevel: 3
      baseCost: 18000
      type: Overclocked
      valuePerLevel: 1
    - id: l6-damage
      name: Heavy Slug
      description: Dense subsonic rounds increase damage by 20% per level.
      maxLevel: 4
      baseCost: 11000
      type: Damage
      valuePerLevel: 0.2
  - type: Sprite
    sprite: Objects/Weapons/Guns/LMGs/l6.rsi
    state: base
    scale: 1,1

- type: entity
  id: FSWeaponShopHydra
  parent: FSWeaponShopBase
  name: Hydra
  description: Six-chamber rotary grenade launcher. Load it, spin it, pray. Uses standard grenades.
  components:
  - type: FSShopWeapon
    requiresResearch: FSOrdnanceHydra
    weaponProtoId: WeaponLauncherHydraFS
    price: 160000
    starterAmmoProtoId: FSBoxHydraGrenade
    starterAmmoCount: 2
    category: Rotary Grenade Launcher
    statDamage: 85
    statFireRate: 30
    statAccuracy: 60
    statCapacity: 40
    upgrades:
    - id: hydra-full-auto
      name: Full Auto
      description: Converts the drum to continuous-fire mode. Hold the trigger to keep it spinning.
      maxLevel: 1
      baseCost: 12000
      type: FullAuto
      valuePerLevel: 1
    - id: hydra-fire-rate
      name: Rapid Cycling
      description: Faster drum rotation increases fire rate by 0.5/level.
      maxLevel: 3
      baseCost: 10000
      type: FireRate
      valuePerLevel: 0.5
    - id: hydra-mag-size
      name: Extended Drum
      description: Expanded drum adds 2 grenade chambers per level.
      maxLevel: 3
      baseCost: 10000
      type: MagazineSize
      valuePerLevel: 2
    - id: hydra-reload-speed
      name: Rapid Reload
      description: Streamlined loading cuts reload time by 20% per level.
      maxLevel: 3
      baseCost: 9000
      type: ReloadSpeed
      valuePerLevel: 0.2
    - id: hydra-barrage
      name: Barrage Mode
      description: Sustained fire spools the launcher, ramping fire rate and explosive output up to maximum heat. Heat bleeds off when you stop firing.
      maxLevel: 3
      baseCost: 18000
      type: Barrage
      valuePerLevel: 1
  - type: Sprite
    sprite: Objects/Weapons/Guns/Launchers/hydra_launcher.rsi
    state: icon
    scale: 1,1

- type: entity
  id: FSWeaponShopRpg
  parent: FSWeaponShopBase
  name: RPG-7
  description: Ancient. Loud. Devastating. One rocket, one problem solved. Uses rocket cartridges.
  components:
  - type: FSShopWeapon
    requiresResearch: FSOrdnanceRpg7
    weaponProtoId: FSWeaponLauncherRocket
    price: 150000
    starterAmmoProtoId: FSBoxRPGRocket
    starterAmmoCount: 2
    category: Single-Shot Rocket Launcher
    statDamage: 95
    statFireRate: 10
    statAccuracy: 70
    statCapacity: 10
    upgrades:
    - id: rpg-reload-speed
      name: Quick Load
      description: Practiced technique reduces reload time by 25% per level.
      maxLevel: 3
      baseCost: 9000
      type: ReloadSpeed
      valuePerLevel: 0.25
    - id: rpg-blast-radius
      name: Blast Radius
      description: Larger warhead increases explosion radius by 2m per level.
      maxLevel: 3
      baseCost: 12000
      type: Radius
      valuePerLevel: 2
    - id: rpg-armor-break
      name: Armor Break
      description: Explosive force damages armour integrity. Each level strips 25% of the target's maximum armour within the blast radius.
      maxLevel: 2
      baseCost: 14000
      type: ArmorShred
      valuePerLevel: 0.25
    - id: rpg-velocity
      name: Rocket Velocity
      description: Higher-thrust propellant increases rocket travel speed significantly.
      maxLevel: 3
      baseCost: 11000
      type: Range
      valuePerLevel: 10
    - id: rpg-shaped-charge
      name: Shaped Charge
      description: Optimised warhead geometry concentrates the blast, dramatically raising peak damage at the point of impact.
      maxLevel: 1
      baseCost: 22000
      type: ShapedCharge
      valuePerLevel: 1
  - type: Sprite
    sprite: Objects/Weapons/Guns/Launchers/rocket.rsi
    state: base
    scale: 1,1

- type: entity
  id: FSWeaponShopTeslaGun
  parent: FSWeaponShopBase
  name: Tesla Gun
  description: The power of the primordial element of lightning in your hands. Self-recharging energy weapon.
  components:
  - type: FSShopWeapon
    requiresResearch: FSOrdnanceTeslaCannon
    weaponProtoId: WeaponTeslaGunFS
    price: 175000
    category: Self-Recharging Tesla Cannon
    statDamage: 70
    statFireRate: 25
    statAccuracy: 80
    statCapacity: 60
    upgrades:
    - id: tesla-charge-speed
      name: Capacitor Boost
      description: Upgraded capacitors double recharge rate per level.
      maxLevel: 3
      baseCost: 12000
      type: SelfChargeSpeed
      valuePerLevel: 2.0
    - id: tesla-energy-capacity
      name: Energy Cell Upgrade
      description: Expanded power cell reduces energy cost per shot. +3-4 extra shots per level.
      maxLevel: 3
      baseCost: 12000
      type: MagazineSize
      valuePerLevel: 50
    - id: tesla-pull-strength
      name: Graviton Core
      description: Graviton emitter creates a gravity well around the orb, pulling nearby enemies inward with increasing force per level.
      maxLevel: 3
      baseCost: 14000
      type: GravitonCore
      valuePerLevel: 1
    - id: tesla-arc-range
      name: Extended Arc
      description: Modified field emitter extends the range lightning chains from the orb by 2m per level.
      maxLevel: 3
      baseCost: 13000
      type: TeslaArcRange
      valuePerLevel: 2
    - id: tesla-fire-rate
      name: Overcharged Coil
      description: Tuned discharge coil increases fire rate by 0.5/level.
      maxLevel: 3
      baseCost: 11000
      type: FireRate
      valuePerLevel: 0.5
  - type: Sprite
    sprite: Objects/Weapons/Guns/Battery/tesla_gun.rsi
    state: base
    scale: 1,1

- type: entity
  id: FSWeaponShopXrayCannon
  parent: FSWeaponShopBase
  name: X-Ray Cannon
  description: Experimental energy weapon that punches through solid matter. Self-recharging. No ammo required.
  components:
  - type: FSShopWeapon
    requiresResearch: FSOrdnanceXrayCannon
    weaponProtoId: WeaponXrayCannonFS
    price: 175000
    category: Self-Recharging X-Ray Cannon
    statDamage: 75
    statFireRate: 30
    statAccuracy: 90
    statCapacity: 80
    upgrades:
    - id: xray-self-charge
      name: Resonant Cell
      description: Tuned resonator doubles self-recharge rate per level.
      maxLevel: 3
      baseCost: 11000
      type: SelfChargeSpeed
      valuePerLevel: 2.0
    - id: xray-accuracy
      name: Collimator
      description: Precision collimator tightens the beam by 10° per level.
      maxLevel: 3
      baseCost: 10000
      type: Accuracy
      valuePerLevel: 10.0
    - id: xray-fire-rate
      name: Pulse Accelerator
      description: Faster charge cycling increases fire rate by 0.5/level.
      maxLevel: 3
      baseCost: 11000
      type: FireRate
      valuePerLevel: 0.5
    - id: xray-damage
      name: Overloaded Emitter
      description: Higher energy output increases damage by 20% per level.
      maxLevel: 4
      baseCost: 12000
      type: Damage
      valuePerLevel: 0.2
    - id: xray-pierce
      name: Deep Penetration
      description: Beam punches through additional targets per level.
      maxLevel: 3
      baseCost: 13000
      type: Pierce
      valuePerLevel: 1
    - id: xray-dot
      name: Radiation Coating
      description: Irradiated targets emit radiation, taking ticking damage while marked. Duration and intensity scale per level.
      maxLevel: 3
      baseCost: 16000
      type: RadiationCoating
      valuePerLevel: 1
  - type: Sprite
    sprite: Objects/Weapons/Guns/Battery/xray.rsi
    state: base
    scale: 1,1

- type: entity
  id: FSWeaponShopMinigun
  parent: FSWeaponShopBase
  name: Minigun
  description: Vzzzzzt! Rahrahrahrah! Vrrrrr! 1000 rounds of .10 rifle. Nothing survives the spin-up.
  components:
  - type: FSShopWeapon
    requiresResearch: FSOrdnanceMinigun
    weaponProtoId: FSWeaponMinigun
    price: 200000
    category: .10 Rotary Heavy Machine Gun
    statDamage: 55
    statFireRate: 90
    statAccuracy: 30
    statCapacity: 95
    upgrades:
    - id: minigun-fire-rate
      name: Overclocked Barrel
      description: Tuned rotation motor increases fire rate by 1.5/level.
      maxLevel: 10
      baseCost: 10000
      type: FireRate
      valuePerLevel: 1.5
    - id: minigun-knockback
      name: Knockback Rage
      description: Increased round velocity adds 10% knockback per level.
      maxLevel: 3
      baseCost: 11000
      type: Knockback
      valuePerLevel: 1
    - id: minigun-iron-beast
      name: Iron Beast
      description: While firing at below 50% health, you take 20% less damage. Requires sustained fire to maintain.
      maxLevel: 1
      baseCost: 22000
      type: IronBeast
      valuePerLevel: 1
    - id: minigun-damage
      name: Depleted Core
      description: Heavier core ammunition increases damage by 20% per level.
      maxLevel: 5
      baseCost: 12000
      type: Damage
      valuePerLevel: 0.2
    - id: minigun-accuracy
      name: Gyro Stabilizer
      description: Active gyroscopic compensation tightens spread by 7° per level.
      maxLevel: 3
      baseCost: 10000
      type: Accuracy
      valuePerLevel: 7.0
    - id: minigun-ammo-drum
      name: Extended Drum
      description: Larger rotating drum adds 250 rounds per level.
      maxLevel: 4
      baseCost: 12000
      type: MagazineSize
      valuePerLevel: 250
  - type: Sprite
    sprite: Objects/Weapons/Guns/HMGs/minigun.rsi
    state: icon
    scale: 1,1

# No requiresResearch - the Harvester is the RP source that feeds the research tree itself.
- type: entity
  id: FSWeaponShopHarvester
  parent: FSWeaponShopBase
  name: Harvester
  description: An experimental purple energy weapon that harvests residual bio-radiation from its targets, feeding it back to the station's research systems.
  components:
  - type: FSShopWeapon
    weaponProtoId: WeaponHarvesterFS
    price: 500
    category: Sustained-Fire Bio-Radiation Beam
    statDamage: 35
    statFireRate: 100
    statAccuracy: 90
    statCapacity: 80
    upgrades:
    - id: harvester-damage
      name: Amplified Emitter
      description: Boosts beam damage by 15% per level.
      maxLevel: 5
      baseCost: 12000
      type: Damage
      valuePerLevel: 0.15
  - type: Sprite
    sprite: _FinalStand/Objects/Weapons/Guns/Harvester.rsi
    state: icon
    scale: 1,1
