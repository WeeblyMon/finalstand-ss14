- type: body
  name: "reptilian"
  id: Reptilian
  root: chest
  slots:
    head:
      part: HeadReptilian
      connections:
      - chest
      organs:
        brain: OrganHumanBrain
        eyes: OrganHumanEyes
        visualHead: OrganReptilianVisualHead
        visualEyes: OrganReptilianVisualEyes
    chest:
      part: ChestReptilian
      organs:
        heart: OrganAnimalHeart
        lungs: OrganHumanLungs
        visualChest: OrganReptilianVisualChest
      connections:
      - right arm
      - left arm
      - groin
      - head # Shitmed
    groin:
      part: GroinReptilian
      connections:
      - right leg
      - left leg
      organs:
        stomach: OrganReptilianStomach
        liver: OrganAnimalLiver
        kidneys: OrganHumanKidneys
        visualGroin: OrganReptilianVisualGroin
    right arm:
      part: RightArmReptilian
      connections:
      - right hand
      organs:
        visualRArm: OrganReptilianVisualRArm
    left arm:
      part: LeftArmReptilian
      connections:
      - left hand
      organs:
        visualLArm: OrganReptilianVisualLArm
    right hand:
      part: RightHandReptilian
      organs:
        visualRHand: OrganReptilianVisualRHand
    left hand:
      part: LeftHandReptilian
      organs:
        visualLHand: OrganReptilianVisualLHand
    right leg:
      part: RightLegReptilian
      connections:
      - right foot
      organs:
        visualRLeg: OrganReptilianVisualRLeg
    left leg:
      part: LeftLegReptilian
      connections:
      - left foot
      organs:
        visualLLeg: OrganReptilianVisualLLeg
    right foot:
      part: RightFootReptilian
      organs:
        visualRFoot: OrganReptilianVisualRFoot
    left foot:
