# Shitmed Change: reorganized to use composition
# Base animal body parts used by _Shitmed animal prototypes (goliath, dragon, etc.)

- type: entity
  abstract: true
  parent: BasePart
  id: PartAnimalBase
  components:
  - type: Sprite
    sprite: Mobs/Species/Reptilian/parts.rsi
  - type: Icon
    sprite: Mobs/Species/Reptilian/parts.rsi
  - type: StaticPrice
    price: 50

- type: entity
  parent: PartAnimalBase
  id: HandsAnimal
  name: animal hands
  components:
  - type: Sprite
    layers:
    - state: l_hand
    - state: r_hand
  - type: Icon
    state: l_hand
  - type: Organ
    category: HandLeft
  - type: HandOrgan
    handID: left
    data:
      location: Left

- type: entity
  parent: PartAnimalBase
  id: LegsAnimal
  name: animal legs
  components:
  - type: Sprite
    layers:
    - state: l_leg
    - state: r_leg
  - type: Icon
    state: l_leg
  - type: Organ
    category: LegLeft
  - type: MovementBodyPart

- type: entity
  parent: PartAnimalBase
  id: FeetAnimal
  name: animal feet
  components:
  - type: Sprite
    layers:
    - state: r_foot
    - state: l_foot
  - type: Icon
    state: l_foot
  - type: Organ
    category: FootLeft

- type: entity
  parent: [ PartAnimalBase, BaseChest ]
  id: ChestAnimal
  name: animal chest
  components:
  - type: Sprite
    layers:
    - state: chest_m
  - type: Organ
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 10
      - ReagentId: Blood
        Quantity: 20

- type: entity
  parent: [ PartAnimalBase, BaseGroin ]
  id: GroinAnimal
  name: animal groin
  components:
  - type: Sprite
    layers:
    - state: groin_m
  - type: Organ
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 10
      - ReagentId: Blood
        Quantity: 20
