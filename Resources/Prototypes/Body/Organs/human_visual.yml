# Visual organs for the human species.
# These are purely visual entities placed in body part organ slots.
# VisualOrganComponent provides sprite layer data for the body entity's sprite.
# VisualOrganMarkingsComponent handles markings (hair, tattoos, etc.) for each layer.

- type: entity
  id: OrganHumanVisualHead
  parent: OrganBaseHead
  name: head
  categories: [ HideSpawnMenu ]
  components:
  - type: VisualOrgan
    data:
      sprite: Mobs/Species/Human/parts.rsi
      state: head_m
    sexStateOverrides:
      Male: head_m
      Female: head_f
  - type: VisualOrganMarkings
    markingData:
      layers:
      - Head
      - Hair
      - FacialHair
      - Snout
      - SnoutCover
      - HeadSide
      - HeadTop
      group: Human

