- type: entity
  id: FSWeaponShopEnergyShotgun
  parent: FSWeaponShopBase
  name: Energy Shotgun
  description: A prototype energy weapon with lethal and stun fire modes. Self-powered — no ammo needed.
  components:
  - type: FSShopWeapon
    weaponProtoId: FSWeaponEnergyShotgun
    price: 50000
    category: Self-Recharging Energy Shotgun
    statDamage: 65
    statFireRate: 30
    statAccuracy: 50
    statCapacity: 100
    upgrades:
    - id: eshottie-extra-pellets
      name: Wide Beam
      description: Adds 1 extra plasma bolt per shot per level. More coverage per trigger pull.
      maxLevel: 3
      baseCost: 7500
      type: PelletCount
      valuePerLevel: 1
    - id: eshottie-tight-choke
      name: Focusing Lens
      description: Narrows beam spread by 1° per level for tighter plasma bursts.
      maxLevel: 3
      baseCost: 7500
      type: AngleMax
      valuePerLevel: 1.0
    - id: eshottie-incendiary
      name: Incendiary Beam
      description: Plasma bolts ignite targets on hit.
      maxLevel: 1
      baseCost: 13150
      type: SetOnFire
      valuePerLevel: 1
    - id: eshottie-extended-cell
      name: Extended Cell
      description: Reduces energy cost per shot, squeezing more shots per charge. Max level yields ~13 shots before reload.
      maxLevel: 3
      baseCost: 7500
      type: MagazineSize
      valuePerLevel: 15.0
    - id: eshottie-damage
      name: High-Energy Cell
      description: Increases bolt damage by 10% per level.
      maxLevel: 5
      baseCost: 7500
      type: Damage
      valuePerLevel: 0.1
    - id: eshottie-rapid-charge
      name: Rapid Charge
      description: Self-recharge rate ×2 per level (×8 at max). More shots between engagements.
      maxLevel: 3
      baseCost: 7500
      type: SelfChargeSpeed
      valuePerLevel: 2.0
    - id: eshottie-overcharge
      name: Overcharge Shot
      description: Every 3rd shot fires a single massive plasma bolt instead of the normal spread. On impact, the bolt bursts into a forward cone of shards.
      maxLevel: 1
      baseCost: 22500
      type: OverchargeShot
      valuePerLevel: 1
  - type: Sprite
    sprite: Objects/Weapons/Guns/Battery/energy_shotgun.rsi
    state: base
    scale: 1,1
