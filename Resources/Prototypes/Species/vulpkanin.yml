- type: species
  id: Vulpkanin
  name: species-name-vulpkanin
  roundStart: true
  prototype: MobVulpkanin
  sprites: MobVulpkaninSprites
  markingLimits: MobVulpkaninMarkingLimits
  defaultSkinTone: "#5a3f2d"
  dollPrototype: MobVulpkaninDummy
  skinColoration: Hues
  maleFirstNames: names_vulpkanin_male
  femaleFirstNames: names_vulpkanin_female
  lastNames: names_vulpkanin_last
  minHeight: 0.90
  defaultHeight: 1
  maxHeight: 1.20
  minWidth: 0.90
  defaultWidth: 1
  maxWidth: 1.10

- type: speciesBaseSprites
  id: MobVulpkaninSprites
  sprites:
    Special: MobHumanoidAnyMarking
    Head: MobVulpkaninHead
    Face: MobHumanoidAnyMarking
    Hair: MobHumanoidAnyMarking
    FacialHair: MobHumanoidAnyMarking
    Snout: MobHumanoidAnyMarking
    Underwear: MobHumanoidAnyMarking
    Undershirt: MobHumanoidAnyMarking
    Chest: MobVulpkaninChest
    Groin: MobVulpkaninGroin
    Eyes: MobVulpkaninEyes
    HeadTop: MobHumanoidAnyMarking
    HeadSide: MobHumanoidAnyMarking
    Tail: MobHumanoidAnyMarking
    LArm: MobVulpkaninLArm
    RArm: MobVulpkaninRArm
    LHand: MobVulpkaninLHand
    RHand: MobVulpkaninRHand
    LLeg: MobVulpkaninLLeg
    RLeg: MobVulpkaninRLeg
    LFoot: MobVulpkaninLFoot
    RFoot: MobVulpkaninRFoot

- type: markingPoints
  id: MobVulpkaninMarkingLimits
  points:
    Hair:
      points: 1
      required: false
    FacialHair:
      points: 1
      required: false
    Head:
      points: 3
      required: false
    HeadTop:
      points: 1
      required: true
      defaultMarkings: [ VulpEar ] # FS: was `default:` (wrong field name, silently ignored — no ears applied)
    Snout:
      points: 1
      required: true
      defaultMarkings: [ VulpSnout ]
    Tail:
      points: 1
      required: true
      defaultMarkings: [ VulpTailVulp ]
    LeftArm:
      points: 2
      required: false
    RightArm:
      points: 2
      required: false
    LeftHand:
      points: 2
      required: false
    RightHand:
      points: 2
      required: false
    LeftLeg:
      points: 2
      required: false
    RightLeg:
      points: 2
      required: false
    LeftFoot:
      points: 2
      required: false
    RightFoot:
      points: 2
      required: false
    Underwear:
      points: 1
      required: false
    Undershirt:
      points: 1
      required: false

- type: humanoidBaseSprite
  id: MobVulpkaninHead
  baseSprite:
    sprite: Mobs/Species/Vulpkanin/parts.rsi
    state: head

# FS: sex-morph variants required by HumanoidVisualLayersExtension.GetSexMorph (Head/Chest/Groin).
