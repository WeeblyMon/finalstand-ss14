# ── Laser Carbine Shop ───────────────────────────────────────────────────────
# Full-auto energy rifle. Sprays laser bolts, drains its cell fast, full of tricks.

- type: entity
  parent: FSWeaponShopBase
  id: FSWeaponShopLaserCarbine
  name: Laser Carbine
  description: Full-automatic energy rifle. Self-powered and full of tricks, but sustained fire drains the cell fast. No ammo required.
  components:
  - type: FSShopWeapon
    weaponProtoId: FSWeaponLaserCarbine
    price: 45000
    category: fs-weapon-shop-category-self-recharging-full-auto-laser
    statDamage: 80
    statFireRate: 70
    statAccuracy: 65
    statCapacity: 95
    upgrades:
    - id: lcarbine-battery-capacity
      name: fs-upgrade-lcarbine-battery-capacity
      description: fs-upgrade-lcarbine-battery-capacity-desc
      maxLevel: 3
      baseCost: 6750
      type: MagazineSize
      valuePerLevel: 9.0
    - id: lcarbine-charge-speed
      name: fs-upgrade-lcarbine-charge-speed
      description: fs-upgrade-lcarbine-charge-speed-desc
      maxLevel: 3
      baseCost: 6750
      type: SelfChargeSpeed
      valuePerLevel: 2.0
    - id: lcarbine-multishot
      name: fs-upgrade-lcarbine-multishot
      description: fs-upgrade-lcarbine-multishot-desc
      maxLevel: 3
      baseCost: 9500
      type: Multishot
      valuePerLevel: 1
    - id: lcarbine-fire-rate
      name: fs-upgrade-lcarbine-fire-rate
      description: fs-upgrade-lcarbine-fire-rate-desc
      maxLevel: 3
      baseCost: 6750
      type: FireRate
      valuePerLevel: 0.5
    - id: lcarbine-damage
      name: fs-upgrade-lcarbine-damage
      description: fs-upgrade-lcarbine-damage-desc
      maxLevel: 4
      baseCost: 8000
      type: Damage
      valuePerLevel: 0.2
    - id: lcarbine-overload
      name: fs-upgrade-lcarbine-overload
      description: fs-upgrade-lcarbine-overload-desc
      maxLevel: 3
      baseCost: 13000
      type: OverloadRound
      valuePerLevel: 1
    - id: lcarbine-homing
      name: fs-upgrade-lcarbine-homing
      description: fs-upgrade-lcarbine-homing-desc
      maxLevel: 2
      baseCost: 14000
      type: HomingBolts
      valuePerLevel: 1
  - type: Sprite
    sprite: Objects/Weapons/Guns/Battery/laser_gun.rsi
    state: base
    scale: 1,1
