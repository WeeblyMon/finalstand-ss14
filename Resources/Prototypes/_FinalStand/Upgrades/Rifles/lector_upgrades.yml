# ── Lector Shop ──────────────────────────────────────────────────────────────
# The Punisher. Every shot is heavy and impactful. Rewards sustained fire on single targets.
# TODO(finalstand): add Lector burst fire upgrade when designed

- type: entity
  parent: FSWeaponShopBase
  id: FSWeaponShopLecter
  name: Lecter
  description: Gas-operated full-auto combat rifle. High stopping power per shot, rewarding accuracy. Uses .20 rifle magazines.
  components:
  - type: FSShopWeapon
    weaponProtoId: FSWeaponRifleLecter
    price: 20000
    starterAmmoProtoId: FSMagazineRifle
    starterAmmoCount: 2
    category: .20 Full-Auto Rifle
    statDamage: 85
    statFireRate: 55
    statAccuracy: 65
    statCapacity: 60
    upgrades:
    - id: lecter-damage
      name: fs-upgrade-lecter-damage
      description: fs-upgrade-lecter-damage-desc
      maxLevel: 7
      baseCost: 3000
      type: Damage
      valuePerLevel: 0.15
    - id: lecter-recoil
      name: fs-upgrade-lecter-recoil
      description: fs-upgrade-lecter-recoil-desc
      maxLevel: 3
      baseCost: 3000
      type: Accuracy
      valuePerLevel: 0.5
    - id: lecter-ap
      name: fs-upgrade-lecter-ap
      description: fs-upgrade-lecter-ap-desc
      maxLevel: 1
      baseCost: 5250
      type: APRounds
      valuePerLevel: 1
    - id: lecter-reload
      name: fs-upgrade-lecter-reload
      description: fs-upgrade-lecter-reload-desc
      maxLevel: 5
      baseCost: 3000
      type: ReloadSpeed
      valuePerLevel: 0.1
    - id: lecter-overkill
      name: fs-upgrade-lecter-overkill
      description: fs-upgrade-lecter-overkill-desc
      maxLevel: 3
      baseCost: 9000
      type: Overkill
      valuePerLevel: 1
    - id: lecter-execution
      name: fs-upgrade-lecter-execution
      description: fs-upgrade-lecter-execution-desc
      maxLevel: 1
      baseCost: 5250
      type: Execution
      valuePerLevel: 1
    - id: lecter-penetrator
      name: fs-upgrade-lecter-penetrator
      description: fs-upgrade-lecter-penetrator-desc
      maxLevel: 4
      baseCost: 5250
      type: Pierce
      valuePerLevel: 1
  - type: Sprite
    sprite: Objects/Weapons/Guns/Rifles/lecter.rsi
    state: base
    scale: 1,1
