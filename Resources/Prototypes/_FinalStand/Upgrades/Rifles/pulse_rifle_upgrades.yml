# ── Pulse Rifle Shop ─────────────────────────────────────────────────────────
# The Crowd Clearer. Everything hits multiple enemies. Sustained fire overwhelms groups.

- type: entity
  parent: FSWeaponShopBase
  id: FSWeaponShopPulseRifle
  name: Pulse Rifle
  description: Full-auto energy rifle with enormous battery capacity. Built for clearing dense crowds. No ammo required.
  components:
  - type: FSShopWeapon
    weaponProtoId: FSWeaponPulseRifle
    price: 65000
    category: fs-weapon-shop-category-self-recharging-full-auto-pulse-rifle
    statDamage: 75
    statFireRate: 35
    statAccuracy: 100
    statCapacity: 100
    upgrades:
    - id: pulse-damage
      name: fs-upgrade-pulse-damage
      description: fs-upgrade-pulse-damage-desc
      maxLevel: 5
      baseCost: 9750
      type: Damage
      valuePerLevel: 0.15
    - id: pulse-fire-rate
      name: fs-upgrade-pulse-fire-rate
      description: fs-upgrade-pulse-fire-rate-desc
      maxLevel: 3
      baseCost: 9750
      type: FireRate
      valuePerLevel: 0.3
    - id: pulse-fullAuto
      name: fs-upgrade-pulse-fullAuto
      description: fs-upgrade-pulse-fullAuto-desc
      maxLevel: 1
      baseCost: 9750
      type: FullAuto
      valuePerLevel: 1
    - id: pulse-charge-speed
      name: fs-upgrade-pulse-charge-speed
      description: fs-upgrade-pulse-charge-speed-desc
      maxLevel: 3
      baseCost: 9750
      type: SelfChargeSpeed
      valuePerLevel: 2.0
    - id: pulse-cascade
      name: fs-upgrade-pulse-cascade
      description: fs-upgrade-pulse-cascade-desc
      maxLevel: 1
      baseCost: 17050
      type: PulseCascade
      valuePerLevel: 1
    - id: pulse-penetrator
      name: fs-upgrade-pulse-penetrator
      description: fs-upgrade-pulse-penetrator-desc
      maxLevel: 4
      baseCost: 9750
      type: Pierce
      valuePerLevel: 1
  - type: Sprite
    sprite: Objects/Weapons/Guns/Battery/pulse_rifle.rsi
    state: base
    scale: 1,1
