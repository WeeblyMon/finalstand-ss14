# DIE SNAKE CASE
- type: body
  id: Human
  name: "human"
  root: chest
  slots:
    head:
      part: HeadHuman
      connections:
      - chest
      organs:
        brain: OrganHumanBrain
        eyes: OrganHumanEyes
        visualHead: OrganHumanVisualHead
        visualEyes: OrganHumanVisualEyes
    chest:
      part: ChestHuman
      connections:
      - groin
      - right arm
      - left arm
      - head # Shitmed
      organs:
        heart: OrganHumanHeart
        lungs: OrganHumanLungs
        visualChest: OrganHumanVisualChest
    groin:
      part: GroinHuman
      connections:
      - right leg
      - left leg
      organs:
        stomach: OrganHumanStomach
        liver: OrganHumanLiver
        kidneys: OrganHumanKidneys
        visualGroin: OrganHumanVisualGroin
    right arm:
      part: RightArmHuman
      connections:
      - right hand
      organs:
        visualRArm: OrganHumanVisualRArm
    left arm:
      part: LeftArmHuman
      connections:
      - left hand
      organs:
        visualLArm: OrganHumanVisualLArm
    right hand:
      part: RightHandHuman
      organs:
        visualRHand: OrganHumanVisualRHand
    left hand:
      part: LeftHandHuman
      organs:
        visualLHand: OrganHumanVisualLHand
    right leg:
      part: RightLegHuman
      connections:
      - right foot
      organs:
        visualRLeg: OrganHumanVisualRLeg
    left leg:
      part: LeftLegHuman
      connections:
      - left foot
      organs:
        visualLLeg: OrganHumanVisualLLeg
    right foot:
      part: RightFootHuman
      organs:
        visualRFoot: OrganHumanVisualRFoot
    left foot:
      part: LeftFootHuman
      organs:
        visualLFoot: OrganHumanVisualLFoot