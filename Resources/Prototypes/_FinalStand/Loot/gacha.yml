# ── The cache itself ─────────────────────────────────────────────────────────────────────────
- type: entity
  id: FSGachaCache
  parent: BaseStructure
  name: smuggler's cache
  description: A welded-shut crate wired into a jury-rigged lock. Cracking it takes time and makes noise; the previous owner left a payment slot for the impatient.
  components:
  - type: Sprite
    drawdepth: Objects
    sprite: Structures/Storage/closet.rsi
    layers:
    - state: generic
      map: [ "body" ]
    - state: generic_door
      map: [ "door" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.FSGachaCacheVisuals.Looted:
        body:
          True: { state: generic_open }
          False: { state: generic }
        door:
          True: { visible: false }
          False: { visible: true }
  - type: FSGachaCache
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 130
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  id: FSGachaCacheSpawner
  parent: MarkerBase
  name: smuggler's cache spawner
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: Structures/Storage/closet.rsi
      state: generic
  - type: RandomSpawner
    prototypes:
    - FSGachaCache
    chance: 0.55
    offset: 0
