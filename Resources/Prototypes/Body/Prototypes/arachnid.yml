- type: body
  id: Arachnid
  name: "arachnid"
  root: chest
  slots:
    head:
      part: HeadArachnid
      connections:
      - chest
      organs:
        brain: OrganHumanBrain
        eyes: OrganArachnidEyes
        visualHead: OrganArachnidVisualHead
        visualEyes: OrganArachnidVisualEyes
    chest:
      part: ChestArachnid
      organs:
        heart: OrganArachnidHeart
        lungs: OrganAnimalLungs
        visualChest: OrganArachnidVisualChest
      connections:
      - right arm
      - left arm
      - head # Shitmed
      - groin
    groin:
      part: GroinArachnid
      connections:
      - right leg
      - left leg
      organs:
        stomach: OrganArachnidStomach
        liver: OrganArachnidLiver
        kidneys: OrganArachnidKidneys
        visualGroin: OrganArachnidVisualGroin
    right arm:
      part: RightArmArachnid
      connections:
      - right hand
      organs:
        visualRArm: OrganArachnidVisualRArm
    left arm:
      part: LeftArmArachnid
      connections:
      - left hand
      organs:
        visualLArm: OrganArachnidVisualLArm
    right hand:
      part: RightHandArachnid
      organs:
        visualRHand: OrganArachnidVisualRHand
    left hand:
      part: LeftHandArachnid
      organs:
        visualLHand: OrganArachnidVisualLHand
    right leg:
      part: RightLegArachnid
      connections:
      - right foot
      organs:
        visualRLeg: OrganArachnidVisualRLeg
    left leg:
      part: LeftLegArachnid
