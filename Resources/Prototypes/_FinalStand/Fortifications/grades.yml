# Material grades, Rust-style: each is poured into the structure with the Engineer's Hammer. Health is relative to steel.
- type: fsUpgrade
  id: FSGradeSteel
  name: fs-grade-steel
  description: fs-grade-steel-desc
  slot: Grade
  icon:
    sprite: Objects/Materials/Sheets/metal.rsi
    state: steel

- type: fsUpgrade
  id: FSGradePlasteel
  name: fs-grade-plasteel
  description: fs-grade-plasteel-desc
  slot: Grade
  icon:
    sprite: Objects/Materials/Sheets/metal.rsi
    state: plasteel
  requires: FSGradeSteel
  cost:
    Plasteel: 3
  hits: 5
  health: 2
  plateMaterial: Plasteel
  state: plasteel
  cracks: _FinalStand/Structures/Walls/Barricades/plasteel_barricade_cracks.rsi

- type: fsUpgrade
  id: FSGradeUranium
  name: fs-grade-uranium
  description: fs-grade-uranium-desc
  slot: Grade
  icon:
    sprite: Objects/Materials/Sheets/other.rsi
    state: uranium
  requires: FSGradePlasteel
  cost:
    Uranium: 3
  hits: 8
  health: 3
  repairDelay: 2
  plateMaterial: Plasteel
  state: plasteel
  color: "#b9f28c"
  cracks: _FinalStand/Structures/Walls/Barricades/plasteel_barricade_cracks.rsi
