- type: entity
  parent: BaseItem
  id: FSChemLauncher
  name: chem launcher
  description: Lobs canisters of field chemistry. Support clouds dose the crew, hostile clouds eat the horde, and every kill nearby tops the reserve back up. Z swaps formula.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Launchers/china_lake.rsi
    layers:
    - state: icon
      color: "#a8e6c0"
  - type: Item
    size: Large
    shape:
    - 0,0,3,1
  - type: Clothing
    sprite: Objects/Weapons/Guns/Launchers/china_lake.rsi
    quickEquip: false
    slots:
    - back
    - suitStorage
  - type: Gun
    fireRate: 1.25
    projectileSpeed: 14
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/grenade_launcher.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/empty.ogg
    clumsyProof: true
  - type: FSChemLauncher
    slots:
    - FSFormulaCombatStim
    - FSFormulaMendingMist
    - FSFormulaCorrosive
  - type: AmmoCounter
  - type: Appearance

- type: latheRecipe
  id: FSChemLauncher
  result: FSChemLauncher
  completetime: 8
  materials:
    Steel: 800
    Plastic: 300
    Glass: 200

