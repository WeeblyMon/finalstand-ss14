- type: entity
  name: baseball bat
  parent: [BaseItem, BaseMinorContraband]
  id: BaseBallBat
  description: A robust baseball bat.
  components:
  - type: FSMeleeJuice # FINALSTAND
    light:
      anticipation: 0.07
      hitstop: 0.06
      reach: 1.1
      trauma: 0.3
      knockback: 9
      knockbackDuration: 0.2
      flinchDuration: 0.25
      flinchSpeed: 0.3
      hitEffect: FSMeleeHitBurst
      killEffect: FSMeleeKillBlood
      hitEmitter: FSMeleeBluntDust
      killEmitter: FSMeleeBloodBurst
      killSound:
        collection: FSMeleeBoneBreak
      moveAnticipation: 0.85
      moveImpact: 0.65
      moveRecovery: 0.9
      recoveryTime: 0.35
      trailColor: "#c8c0b088"
      trailWidth: 0.07
      trailDuration: 0.12
    comboHits: 2
    finisher:
      anticipation: 0.12
      hitstop: 0.1
      reach: 1.2
      trauma: 0.55
      knockback: 18
      knockbackDuration: 0.2
      flinchDuration: 0.5
      flinchSpeed: 0.2
      hitEffect: FSMeleeHitShatter
      killEffect: FSMeleeKillBlood
      hitEmitter: FSMeleeBluntDust
      killEmitter: FSMeleeBloodBurst
      killSound:
        collection: FSMeleeBoneBreak
      moveAnticipation: 0.85
      moveImpact: 0.65
      moveRecovery: 0.9
      recoveryTime: 0.35
      trailColor: "#c8c0b088"
      trailWidth: 0.07
      trailDuration: 0.12
      damageMultiplier: 1.5
  - type: Sprite
    sprite: Objects/Weapons/Melee/baseball_bat.rsi
    state: icon
  - type: MeleeWeapon
    soundSwing: # FINALSTAND
      collection: FSMeleeSwishHeavy
      params:
        volume: -5
        variation: 0.05
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 10
    soundHit: # FINALSTAND
      collection: FSMeleeBluntHit
      params:
        volume: -3
        variation: 0.06
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 5
  - type: Item
    size: Normal
    shape:
    - 0,0,0,3
    storedSprite:
      state: storage
      sprite: Objects/Weapons/Melee/baseball_bat.rsi
  - type: Tool
    qualities:
    - Rolling
    speedModifier: 0.75 # a bit unwieldly but does the job
  - type: Clothing
    quickEquip: false
    slots:
    - back
    - suitStorage
  - type: Construction
    graph: WoodenBat
    node: bat
  - type: UseDelay
    delay: 1
  - type: PhysicalComposition
    materialComposition:
      Wood: 250
  - type: Tag
    tags:
    - BaseballBat
  - type: Crit
    baseCritChance: 0.05

- type: entity
  name: incomplete baseball bat
  parent: BaseItem
  id: IncompleteBaseBallBat
  description: A few planks of wood stuck together.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/incomplete_bat.rsi
    state: icon
  - type: Item
    size: Normal
    shape:
    - 0,0,0,3
    storedSprite:
      state: storage
      sprite: Objects/Weapons/Melee/incomplete_bat.rsi
    sprite: Objects/Weapons/Melee/incomplete_bat.rsi
  - type: Construction
    graph: WoodenBat
    node: incompleteBat

- type: entity
  name: knockback stick
  parent: BaseBallBat
  id: WeaponMeleeKnockbackStick
  description: And then he spleefed all over.
  categories: [ DoNotMap ]
  components:
  - type: MeleeThrowOnHit
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 1
