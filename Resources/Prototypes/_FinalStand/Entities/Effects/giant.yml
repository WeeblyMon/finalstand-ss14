# ── Giant boss VFX and projectile ────────────────────────────────────────────────────────────
- type: entity
  id: FSGiantEffectBase
  abstract: true
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    anchored: true
  - type: TimedDespawn
    lifetime: 1

- type: entity
  id: FSEffectGiantLaunchSmoke
  parent: FSGiantEffectBase
  name: dust cloud
  components:
  - type: Sprite
    drawdepth: Effects
    noRot: true
    sprite: _FinalStand/Effects/GiantLaunchSmoke.rsi
    state: effect
  - type: TimedDespawn
    lifetime: 0.78

- type: entity
  id: FSEffectGiantImpact
  parent: FSGiantEffectBase
  name: impact wave
  components:
  - type: Sprite
    drawdepth: Effects
    noRot: true
    scale: 1.6,1.6
    sprite: _FinalStand/Effects/GiantImpactSmoke.rsi
    state: effect
  - type: TimedDespawn
    lifetime: 0.66

- type: entity
  id: FSEffectBoulderImpact
  parent: FSGiantEffectBase
  name: wall dust
  components:
  - type: Sprite
    drawdepth: Effects
    noRot: true
    sprite: _FinalStand/Effects/GiantBoulderImpact.rsi
    state: effect
  - type: TimedDespawn
    lifetime: 0.55

- type: entity
  id: FSGiantTelegraphRing
  parent: FSGiantEffectBase
  name: impact zone
  components:
  - type: Sprite
    drawdepth: FloorObjects
    noRot: true
    scale: 1.8,1.8
    sprite: _FinalStand/Effects/GiantTelegraph.rsi
    state: ring
  - type: TimedDespawn
    lifetime: 2.5

- type: entity
  id: FSGiantLaneMarker
  parent: FSGiantEffectBase
  name: danger lane
  components:
  - type: Sprite
    drawdepth: FloorObjects
    noRot: true
    sprite: _FinalStand/Effects/GiantLane.rsi
    state: lane
  - type: TimedDespawn
    lifetime: 1.2

- type: entity
  id: FSGiantFist
  parent: FSGiantEffectBase
  name: cocked fist
  components:
  - type: Sprite
    drawdepth: Mobs
    scale: 2,2
    sprite: _FinalStand/Effects/GiantFist.rsi
    state: fist
  - type: TimedDespawn
    lifetime: 0.6

- type: entity
  id: FSGiantBoulder
  name: hurled debris
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    drawdepth: Mobs
    noRot: true
    sprite: _FinalStand/Objects/Weapons/Guns/Projectiles/GiantBoulder.rsi
    state: boulder
  - type: FSGiantBoulder
  - type: Physics
    bodyType: Dynamic
    linearDamping: 0
    angularDamping: 0
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeCircle
          radius: 0.45
        hard: false
        mask:
        - Impassable
        - BulletImpassable
  - type: Projectile
    deleteOnCollide: false
    onlyCollideWhenShot: true
    damage:
      types:
        Blunt: 45
  - type: TimedDespawn
    lifetime: 4
