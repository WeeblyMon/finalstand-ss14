- type: entity
  id: OrganReptilianVisualHead
  parent: OrganBaseHead
  name: head
  categories: [ HideSpawnMenu ]
  components:
  - type: VisualOrgan
    data:
      sprite: Mobs/Species/Reptilian/parts.rsi
      state: head_m
    sexStateOverrides:
      Male: head_m
      Female: head_f
  - type: VisualOrganMarkings
    markingData:
      layers:
      - Head
      - Hair
      - FacialHair
      - Snout
      - SnoutCover
      - HeadSide
      - HeadTop
      group: Reptilian

