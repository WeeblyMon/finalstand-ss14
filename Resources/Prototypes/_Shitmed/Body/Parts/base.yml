# body part with regular organic destruction
- type: entity
  abstract: true
  parent: BasePartInorganic
  id: BasePart
  components:
  - type: ParentOrgan
  - type: ChildOrgan
  - type: GibbableOrgan
  - type: Organ
  - type: Injurable
    damageContainer: Biological # Shitmed Change
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: Blood
        Quantity: 10
  # Goob edit: Food/BadFood removed - FoodComponent not in vanilla SS14

# organic torsos have higher health
# this doesn't affect gibbing bodies as there is code to prevent torso gibbing while part of a body
- type: entity
  abstract: true
  parent: BaseChestInorganic
  id: BaseChest
  components:
  - type: ParentOrgan
  - type: ChildOrgan
  - type: GibbableOrgan
  - type: Organ
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Heat
        damage: 400
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawnInContainer: true
        spawn:
          Ash:
            min: 1
            max: 1
      - !type:BurnBodyBehavior { }
      - !type:PlaySoundBehavior
        sound:
          collection: MeatLaserImpact
  - type: Extractable # torso is meatier
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 10
      - ReagentId: Blood
        Quantity: 20

- type: entity
  abstract: true
  id: BaseGroin
  parent: BaseGroinInorganic
  components:
  - type: ParentOrgan
  - type: ChildOrgan
  - type: GibbableOrgan
  - type: Organ
