# ── Laser Carbine Shop ───────────────────────────────────────────────────────
# Full-auto energy rifle. Sprays laser bolts, drains its cell fast, full of tricks.

- type: entity
  id: FSWeaponShopLaserCarbine
  parent: FSWeaponShopBase
  name: Laser Carbine
  description: Full-automatic energy rifle. Self-powered and full of tricks, but sustained fire drains the cell fast. No ammo required.
  components:
  - type: FSShopWeapon
    weaponProtoId: FSWeaponLaserCarbine
    price: 45000
    category: Self-Recharging Full-Auto Laser
    statDamage: 80
    statFireRate: 70
    statAccuracy: 65
    statCapacity: 95
    upgrades:
    - id: lcarbine-battery-capacity
      name: Extended Cell
      description: Denser energy cell reduces cost per shot, giving more shots between recharges.
      maxLevel: 3
      baseCost: 6750
      type: MagazineSize
      valuePerLevel: 9.56
    - id: lcarbine-charge-speed
      name: Capacitor Boost
      description: Self-recharge rate ×2 per level (×8 at max). More shots between engagements.
      maxLevel: 3
      baseCost: 6750
      type: SelfChargeSpeed
      valuePerLevel: 2.0
    - id: lcarbine-multishot
      name: Split Emitter
      description: Chance per shot to fire 1-3 additional bolts, fanned within the spread cone so they don't overlap. Stacks with Homing Bolts.
      maxLevel: 4
      baseCost: 9500
      type: Multishot
      valuePerLevel: 1
    - id: lcarbine-fire-rate
      name: Overclocked Cycling
      description: Tuned capacitor discharge increases fire rate by 0.5/level.
      maxLevel: 3
      baseCost: 6750
      type: FireRate
      valuePerLevel: 0.5
    - id: lcarbine-damage
      name: Amplified Emitter
      description: Higher energy output increases damage by 20% per level.
      maxLevel: 4
      baseCost: 8000
      type: Damage
      valuePerLevel: 0.2
    - id: lcarbine-overload
      name: Overload Round
      description: Every 5th/4th/3rd shot is automatically supercharged, dealing double damage.
      maxLevel: 3
      baseCost: 13000
      type: OverloadRound
      valuePerLevel: 1
    - id: lcarbine-homing
      name: Homing Bolts
      description: Bolts steer toward the nearest enemy in flight. Higher levels turn faster and tighter.
      maxLevel: 3
      baseCost: 14000
      type: HomingBolts
      valuePerLevel: 1
  - type: Sprite
    sprite: Objects/Weapons/Guns/Battery/laser_gun.rsi
    state: base
    scale: 1,1
