# ── Laser Carbine Shop ───────────────────────────────────────────────────────
# The Techie. Shots do more than just damage. Builds momentum, lots of secondary effects.

- type: entity
  id: FSWeaponShopLaserCarbine
  parent: FSWeaponShopBase
  name: Laser Carbine
  description: Semi-automatic energy rifle. Self-powered, accurate, and full of tricks. No ammo required.
  components:
  - type: FSShopWeapon
    weaponProtoId: FSWeaponLaserCarbine
    price: 45000
    category: Self-Recharging Semi-Auto Laser
    statDamage: 50
    statFireRate: 40
    statAccuracy: 80
    statCapacity: 75
    upgrades:
    - id: lcarbine-charge-speed
      name: Capacitor Boost
      description: Self-recharge rate ×2 per level (×8 at max). More shots between engagements.
      maxLevel: 3
      baseCost: 6750
      type: SelfChargeSpeed
      valuePerLevel: 2.0
    - id: lcarbine-accuracy
      name: Focusing Lens
      description: Precision optics tighten spread by 2.5° per level.
      maxLevel: 3
      baseCost: 6750
      type: Accuracy
      valuePerLevel: 2.5
    - id: lcarbine-chain
      name: Chain Targets
      description: Beam arcs to 1 additional enemy per level on hit.
      maxLevel: 3
      baseCost: 11800
      type: BeamChaining
      valuePerLevel: 1
    - id: lcarbine-prismatic
      name: Prismatic
      description: 25%/50%/75% chance per hit to split into 3 beams that seek nearby enemies for 40% damage. Beams do not chain.
      maxLevel: 3
      baseCost: 20250
      type: Prismatic
      valuePerLevel: 1
    - id: lcarbine-mag-efficiency
      name: Mag Efficiency
      description: 10%/20%/30% chance per shot to not consume energy. Effectively extends battery life.
      maxLevel: 3
      baseCost: 6750
      type: MagEfficiency
      valuePerLevel: 1
  - type: Sprite
    sprite: Objects/Weapons/Guns/Battery/laser_gun.rsi
    state: base
    scale: 1,1
