- type: entity
  id: WaveSurvival
  parent: BaseGameRule
  components:
  - type: WaveGameRule
    killReward: 100
    waveSurvivalBonus: 500
    bossWavePrestigeReward: 50
    prepDuration: 15
    maxCombatDuration: 1800
    spawnInterval: 2
    waveStartSound: !type:SoundPathSpecifier
      path: /Audio/_FinalStand/WaveEvents/wave_start.ogg
    waveEndSound: !type:SoundPathSpecifier
      path: /Audio/_FinalStand/WaveEvents/wave_end.ogg
    enemyConfigs:
    # Waves 1-4: basic xeno swarm
    - fromWave: 1
      toWave: 4
      enemyPool:
      - FSMobXenoDrone
      - FSMobXeno
      - FSMobXenoRunner
    # Waves 5-9: heavier xenos + basic zombies mixed in
    - fromWave: 5
      toWave: 9
      enemyPool:
      - FSMobXenoDrone
      - FSMobXenoPraetorian
      - FSMobSpiderSpace
      - FSZombieNormal
      - FSZombieRunner
    # Waves 10-19: zombies take over, armoured joins
    - fromWave: 10
      toWave: 19
      enemyPool:
      - FSZombieNormal
      - FSZombieRunner
      - FSZombieArmoured
      - FSMobXenoPraetorian
    # Waves 20+: heavy zombie mix
    - fromWave: 20
      enemyPool:
      - FSZombieNormal
      - FSZombieArmoured
      - FSMobFleshJared
      - FSMobHivebotRanged
