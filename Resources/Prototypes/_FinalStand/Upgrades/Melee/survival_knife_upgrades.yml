# ── Survival Knife Shop ──────────────────────────────────────────────────────
# The starter melee. Free. Designed for early-wave economy.

- type: entity
  parent: FSWeaponShopBase
  id: FSWeaponShopSurvivalKnife
  name: Survival Knife
  description: A basic carp-killer. Free to take and cheap to improve.
  components:
  - type: FSShopWeapon
    weaponProtoId: SurvivalKnife
    price: 0
    category: fs-weapon-shop-category-melee-knife
    statDamage: 15
    statFireRate: 60
    statAccuracy: 0
    statCapacity: 0
    upgrades:
    - id: knife-quick-slash
      name: fs-upgrade-knife-quick-slash
      description: fs-upgrade-knife-quick-slash-desc
      maxLevel: 1
      baseCost: 2000
      type: AttackSpeed
      valuePerLevel: 0.33
    - id: knife-sharpened
      name: fs-upgrade-knife-sharpened
      description: fs-upgrade-knife-sharpened-desc
      maxLevel: 2
      baseCost: 3000
      type: Damage
      valuePerLevel: 0.5
    - id: knife-golden
      name: fs-upgrade-knife-golden
      description: fs-upgrade-knife-golden-desc
      maxLevel: 1
      baseCost: 500
      type: MoneyGainPercent
      valuePerLevel: 0.08
    - id: knife-bloodthirster
      name: fs-upgrade-knife-bloodthirster
      description: fs-upgrade-knife-bloodthirster-desc
      maxLevel: 2
      baseCost: 3000
      type: LifeSteal
      valuePerLevel: 0.85
    - id: knife-coup-de-grace
      name: fs-upgrade-knife-coup-de-grace
      description: fs-upgrade-knife-coup-de-grace-desc
      maxLevel: 1
      baseCost: 3500
      type: MeleeSignature
      signature: CoupDeGrace
      valuePerLevel: 1
    - id: knife-hemorrhage
      name: fs-upgrade-knife-hemorrhage
      description: fs-upgrade-knife-hemorrhage-desc
      maxLevel: 1
      baseCost: 3000
      type: MeleeSignature
      signature: Hemorrhage
      valuePerLevel: 1
    - id: knife-opportunist
      name: fs-upgrade-knife-opportunist
      description: fs-upgrade-knife-opportunist-desc
      maxLevel: 1
      baseCost: 2500
      type: MeleeSignature
      signature: Opportunist
      valuePerLevel: 0.5
  - type: Sprite
    sprite: Objects/Weapons/Melee/survival_knife.rsi
    state: icon
    scale: 1,1
