- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceGingerbread
  categories: [ HideSpawnMenu ]
  name: gingerbread appearance
  components:
  - type: Inventory
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Human/displacement.rsi
            state: jumpsuit-female
  - type: Body
    prototype: Gingerbread
  - type: HumanoidProfile
    species: Gingerbread

- type: entity
  parent:
  - AppearanceGingerbread
  - BaseSpeciesMobOrganic
  id: MobGingerbread
  name: Urist McCookie
  components:
  - type: Butcherable
    spawned:
    - id: FoodBakedCookie
      amount: 5
  - type: Damageable
    damageModifierSet: Gingerbread
  - type: DamageVisuals
    damageOverlayGroups:
      Brute:
        sprite: Mobs/Effects/brute_damage.rsi
        color: "#896e55"
      Burn:
        sprite: Mobs/Effects/burn_damage.rsi
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Sugar
        Quantity: 200
      - ReagentId: Butter
        Quantity: 400
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 100 #fairly light
        restitution: 0.0
        mask:
          - MobMask
        layer:
          - MobLayer
  - type: TypingIndicator
    proto: gingerbread

- type: entity
  name: gingerbread man
  id: MobGingerbreadAI
  parent: [ MobGingerbread, MobCombat ]
  components:
  - type: GhostRole
    name: ghost-role-information-gingerbread-name
    description: ghost-role-information-gingerbread-description
    rules: ghost-role-information-nonantagonist-rules
  - type: GhostTakeoverAvailable
  - type: NPCRetaliation
  - type: FactionException
  - type: NpcFactionMember
    factions:
    - Passive
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
