- type: entity
  id: OrganVulpkaninVisualHead
  parent: OrganBaseHead
  name: head
  categories: [ HideSpawnMenu ]
  components:
  - type: VisualOrgan
    data:
      sprite: Mobs/Species/Vulpkanin/parts.rsi
      state: head
  - type: VisualOrganMarkings
    markingData:
      layers:
      - Head
      - Hair
      - FacialHair
      - Snout
      - SnoutCover
      - HeadSide
      - HeadTop
      group: Vulpkanin

