# ── Energy Sword Shop ────────────────────────────────────────────────────────
# Endgame melee. Plasma blade. Dual-wield upgrade swaps the held EnergySword for an FSEnergySwordDouble in place,
# copying the upgrade state across (handled in FSPlayerUpgradesSystem.DualWieldEnergySword case).

- type: entity
  parent: FSWeaponShopBase
  id: FSWeaponShopEnergySword
  name: Energy Sword
  description: A concentrated-plasma blade. Carves through unarmored targets like butter.
  components:
  - type: FSShopWeapon
    weaponProtoId: EnergySword
    # FS: after the Dual Wield upgrade the player's EnergySword is replaced with an
    # FSEnergySwordDouble — accept it (and the old vanilla EnergySwordDouble, for anyone
    # who transformed before this alias existed) so the shop can keep upgrading the
    # post-transform weapon (the state already lives on the new entity).
    weaponProtoIdAliases:
    - FSEnergySwordDouble
    - EnergySwordDouble
    price: 25000
    category: fs-weapon-shop-category-melee-energy
    statDamage: 85
    statFireRate: 70
    statAccuracy: 0
    statCapacity: 0
    upgrades:
    - id: esword-quick-slash
      name: fs-upgrade-esword-quick-slash
      description: fs-upgrade-esword-quick-slash-desc
      maxLevel: 2
      baseCost: 6000
      type: AttackSpeed
      valuePerLevel: 0.2
    - id: esword-enhanced
      name: fs-upgrade-esword-enhanced
      description: fs-upgrade-esword-enhanced-desc
      maxLevel: 4
      baseCost: 15000
      type: Damage
      valuePerLevel: 0.35
    - id: esword-energy-overflow
      name: fs-upgrade-esword-energy-overflow
      description: fs-upgrade-esword-energy-overflow-desc
      maxLevel: 2
      baseCost: 8000
      type: MovementSpeed
      valuePerLevel: 0.1
    - id: esword-hyper-staminasteal
      name: fs-upgrade-esword-hyper-staminasteal
      description: fs-upgrade-esword-hyper-staminasteal-desc
      maxLevel: 1
      baseCost: 12000
      type: StaminaSteal
      valuePerLevel: 15
    - id: esword-firebrand
      name: fs-upgrade-esword-firebrand
      description: fs-upgrade-esword-firebrand-desc
      maxLevel: 3
      baseCost: 10000
      type: SetOnFire
      valuePerLevel: 3
    - id: esword-molecular-rupture
      name: fs-upgrade-esword-molecular-rupture
      description: fs-upgrade-esword-molecular-rupture-desc
      maxLevel: 1
      baseCost: 12000
      type: Pierce
      valuePerLevel: 1
    - id: esword-dual-wield
      name: fs-upgrade-esword-dual-wield
      description: fs-upgrade-esword-dual-wield-desc
      maxLevel: 1
      baseCost: 30000
      type: DualWieldEnergySword
      valuePerLevel: 0.5
  - type: Sprite
    sprite: Objects/Weapons/Melee/e_sword.rsi
    # FS: show the activated blade in the shop preview (handle + glowing blade unshaded).
    layers:
    - state: e_sword
    - state: e_sword_blade
      shader: unshaded
    scale: 1,1
