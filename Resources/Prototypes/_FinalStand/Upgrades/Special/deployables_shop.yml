# ── SCI Deployables ──────────────────────────────────────────────────────────────────────────
- type: entity
  id: FSDeployableShopNullField
  parent: FSWeaponShopBase
  name: Null Field Emitter
  description: A portable stasis-field emitter. Slows enemies caught in its radius. Diminishing returns - overlapping fields don't stack.
  components:
  - type: FSShopWeapon
    weaponProtoId: FSNullFieldItem
    requiresScience: true
    singlePurchase: true
    price: 3000
    category: Area Denial Deployable
    statDamage: 0
    statFireRate: 0
    statAccuracy: 0
    statCapacity: 0
    upgrades:
    - id: null-field-capacity
      name: Extra Charge
      description: Carry one additional Null Field charge.
      maxLevel: 1
      baseCost: 3000
      type: DeployableCapacity
      valuePerLevel: 1
  - type: Sprite
    sprite: _FinalStand/Objects/Devices/NullField.rsi
    state: icon
    scale: 1,1

- type: entity
  id: FSDeployableShopDamageBeacon
  parent: FSWeaponShopBase
  name: Damage Beacon
  description: A portable targeting beacon. Amplifies damage dealt to enemies in its radius. Diminishing returns - overlapping beacons don't stack.
  components:
  - type: FSShopWeapon
    weaponProtoId: FSDamageBeaconItem
    requiresScience: true
    singlePurchase: true
    price: 3500
    category: Area Denial Deployable
    statDamage: 0
    statFireRate: 0
    statAccuracy: 0
    statCapacity: 0
    upgrades:
    - id: damage-beacon-capacity
      name: Extra Charge
      description: Carry one additional Damage Beacon charge.
      maxLevel: 1
      baseCost: 3000
      type: DeployableCapacity
      valuePerLevel: 1
  - type: Sprite
    sprite: _FinalStand/Objects/Devices/DamageBeacon.rsi
    state: icon
    scale: 1,1

- type: entity
  id: FSDeployableShopLandmine
  parent: FSWeaponShopBase
  name: Landmines
  description: Proximity mines that arm a few seconds after planting and detonate once. They shred anything organic in the blast and leave the station untouched.
  components:
  - type: FSShopWeapon
    weaponProtoId: FSLandmineItem
    requiresScience: false
    singlePurchase: true
    price: 6500
    category: Area Denial Deployable
    statDamage: 70
    statFireRate: 0
    statAccuracy: 0
    statCapacity: 30
    upgrades:
    - id: landmine-capacity
      name: Extra Mines
      description: Carry one additional mine per level.
      maxLevel: 2
      baseCost: 4000
      type: DeployableCapacity
      valuePerLevel: 1
    - id: landmine-damage
      name: Dense Filler
      description: Each level adds a quarter of the mine's base blast damage.
      maxLevel: 3
      baseCost: 5000
      type: LandmineDamage
      valuePerLevel: 0.25
    - id: landmine-detonations
      name: Reusable Core
      description: The mine re-arms itself after going off, one extra time per level.
      maxLevel: 2
      baseCost: 3000
      type: LandmineDetonations
      valuePerLevel: 1
    - id: landmine-regen
      name: Field Fabricator
      description: Restock one more mine each wave.
      maxLevel: 2
      baseCost: 4000
      type: DeployableRegen
      valuePerLevel: 1
    - id: landmine-he
      name: High Explosive
      description: Widens the blast to cover a three by three area.
      maxLevel: 1
      baseCost: 10000
      type: LandmineHighExplosive
      valuePerLevel: 1
  - type: Sprite
    sprite: Objects/Misc/landmine.rsi
    state: landmine
    scale: 1,1

- type: entity
  id: FSDeployableShopAmmoBox
  parent: FSWeaponShopBase
  name: Ammo Resupply Box
  description: A portable resupply crate with a limited pool of uses. Its owner can lock it so only they can draw from it.
  components:
  - type: FSShopWeapon
    weaponProtoId: FSAmmoBoxItem
    requiresScience: false
    singlePurchase: true
    price: 5000
    category: Support Deployable
    statDamage: 0
    statFireRate: 0
    statAccuracy: 0
    statCapacity: 40
    upgrades:
    - id: ammo-box-uses
      name: Deeper Stock
      description: One extra resupply use per level.
      maxLevel: 2
      baseCost: 4000
      type: AmmoBoxUses
      valuePerLevel: 1
    - id: ammo-box-speed
      name: Quick Release
      description: Cuts the time it takes to draw a resupply.
      maxLevel: 3
      baseCost: 3000
      type: AmmoBoxSpeed
      valuePerLevel: 0.7
  - type: Sprite
    sprite: _FinalStand/Objects/Devices/AmmoBox.rsi
    state: base
    scale: 1,1

- type: entity
  id: FSDeployableShopSentryTurret
  parent: FSWeaponShopBase
  name: Sentry Turret
  description: A deployable autoturret firing .35 auto. Engages hostiles in line of sight on its own and stays up until the magazine is empty.
  components:
  - type: FSShopWeapon
    weaponProtoId: FSSentryTurretItem
    requiresScience: false
    singlePurchase: true
    price: 15000
    category: Support Deployable
    statDamage: 20
    statFireRate: 150
    statAccuracy: 100
    statCapacity: 200
    upgrades:
    - id: sentry-ammo
      name: Extended Belt
      description: Forty more rounds per level.
      maxLevel: 5
      baseCost: 3000
      type: SentryAmmo
      valuePerLevel: 40
    - id: sentry-firerate
      name: Cycling Servos
      description: Each level cuts a quarter off the delay between shots.
      maxLevel: 3
      baseCost: 2500
      type: SentryFireRate
      valuePerLevel: 0.25
    - id: sentry-damage
      name: Hardened Rounds
      description: Each level adds a quarter of the turret's base damage.
      maxLevel: 3
      baseCost: 4000
      type: SentryDamage
      valuePerLevel: 0.25
    - id: sentry-range
      name: Optics Package
      description: One extra tile of engagement range.
      maxLevel: 1
      baseCost: 7500
      type: SentryRange
      valuePerLevel: 1
    - id: sentry-capacity
      name: Second Case
      description: Carry one additional turret.
      maxLevel: 1
      baseCost: 10000
      type: DeployableCapacity
      valuePerLevel: 1
  - type: Sprite
    sprite: _FinalStand/Objects/Devices/SentryTurret.rsi
    state: icon
    scale: 1,1
