# ── Cutlass Shop ─────────────────────────────────────────────────────────────
# Pirate sabre. Slash-and-stamina playstyle; right click fires the flintlock that comes with it.

- type: entity
  parent: FSWeaponShopBase
  id: FSWeaponShopCutlass
  name: Cutlass
  description: A wickedly curved blade. Pairs well with flintlocks and a sense of dread.
  components:
  - type: FSShopWeapon
    weaponProtoId: FSWeaponCutlass
    price: 4000
    category: fs-weapon-shop-category-melee-sword
    statDamage: 40
    statFireRate: 55
    statAccuracy: 0
    statCapacity: 0
    upgrades:
    - id: cutlass-quick-slash
      name: fs-upgrade-cutlass-quick-slash
      description: fs-upgrade-cutlass-quick-slash-desc
      maxLevel: 3
      baseCost: 6000
      type: AttackSpeed
      valuePerLevel: 0.2
    - id: cutlass-sharpened
      name: fs-upgrade-cutlass-sharpened
      description: fs-upgrade-cutlass-sharpened-desc
      maxLevel: 3
      baseCost: 4750
      type: Damage
      valuePerLevel: 1.45
    - id: cutlass-plunder
      name: fs-upgrade-cutlass-plunder
      description: fs-upgrade-cutlass-plunder-desc
      maxLevel: 1
      baseCost: 5000
      type: MoneyGainPercent
      valuePerLevel: 0.25
    - id: cutlass-hyper-saber
      name: fs-upgrade-cutlass-hyper-saber
      description: fs-upgrade-cutlass-hyper-saber-desc
      maxLevel: 1
      baseCost: 5000
      type: StaminaSteal
      valuePerLevel: 15
    - id: cutlass-swashbuckler
      name: fs-upgrade-cutlass-swashbuckler
      description: fs-upgrade-cutlass-swashbuckler-desc
      maxLevel: 3
      baseCost: 4000
      type: CritChance
      valuePerLevel: 0.1
    - id: cutlass-quick-reload
      name: fs-upgrade-cutlass-quick-reload
      description: fs-upgrade-cutlass-quick-reload-desc
      maxLevel: 2
      baseCost: 5000
      type: MeleeSignature
      signature: QuickReload
      valuePerLevel: 1
    - id: cutlass-broadside
      name: fs-upgrade-cutlass-broadside
      description: fs-upgrade-cutlass-broadside-desc
      maxLevel: 1
      baseCost: 9000
      type: MeleeSignature
      signature: Broadside
      valuePerLevel: 1
    - id: cutlass-pirate
      name: fs-upgrade-cutlass-pirate
      description: fs-upgrade-cutlass-pirate-desc
      maxLevel: 1
      baseCost: 6500
      starter: true
      type: FlintlockCritSynergy
      valuePerLevel: 5
      spawnProtoId: WeaponPistolFlintlock
      spawnCountPerLevel: 1
    # ── Flintlock: the cutlass's right-click shot ─────
    # Spare Pistols and Powder Horn live on the cutlass; the rest go on the flintlock it fires through.
    - id: flintlock-spare-pistols
      name: fs-upgrade-flintlock-spare-pistols
      description: fs-upgrade-flintlock-spare-pistols-desc
      maxLevel: 3
      baseCost: 4000
      type: MeleeSignature
      signature: SparePistols
      valuePerLevel: 1
      requiresUpgrade: cutlass-pirate
    - id: flintlock-powder-horn
      name: fs-upgrade-flintlock-powder-horn
      description: fs-upgrade-flintlock-powder-horn-desc
      maxLevel: 3
      baseCost: 4000
      type: MeleeSignature
      signature: PowderHorn
      valuePerLevel: 0.4
      requiresUpgrade: cutlass-pirate
    - id: flintlock-through-and-through
      name: fs-upgrade-flintlock-through-and-through
      description: fs-upgrade-flintlock-through-and-through-desc
      maxLevel: 2
      baseCost: 5000
      type: Pierce
      valuePerLevel: 1
      requiresUpgrade: cutlass-pirate
      targetWeaponProtoId: WeaponPistolFlintlock
    - id: flintlock-heavier-load
      name: fs-upgrade-flintlock-heavier-load
      description: fs-upgrade-flintlock-heavier-load-desc
      maxLevel: 3
      baseCost: 3500
      type: Damage
      valuePerLevel: 0.5
      requiresUpgrade: cutlass-pirate
      targetWeaponProtoId: WeaponPistolFlintlock
    - id: flintlock-explosive-shot
      name: fs-upgrade-flintlock-explosive-shot
      description: fs-upgrade-flintlock-explosive-shot-desc
      maxLevel: 3
      baseCost: 5000
      type: ExplosiveShot
      valuePerLevel: 1
      requiresUpgrade: cutlass-pirate
      targetWeaponProtoId: WeaponPistolFlintlock
    - id: flintlock-payday
      name: fs-upgrade-flintlock-payday
      description: fs-upgrade-flintlock-payday-desc
      maxLevel: 3
      baseCost: 2500
      type: MoneyGainBonus
      valuePerLevel: 50
      requiresUpgrade: cutlass-pirate
      targetWeaponProtoId: WeaponPistolFlintlock
  - type: Sprite
    sprite: Objects/Weapons/Melee/cutlass.rsi
    state: icon
    scale: 1,1
