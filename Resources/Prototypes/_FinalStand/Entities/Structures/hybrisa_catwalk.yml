    sprite: _FinalStand/Structures/catwalk.rsi
    drawdepth: FloorTiles
    state: railroadBend
  - type: Icon
    sprite: _FinalStand/Structures/catwalk.rsi
    state: railroadBend

- type: entity
  parent: FSRailroadStraight
  id: FSRailroadBumper
  name: rail bumpers
  description: This (usually) stops minecarts and other rail vehicles at the end of a line of track.
  components:
  - type: Sprite
    sprite: _FinalStand/Structures/catwalk.rsi
    drawdepth: FloorTiles
    state: railroadBumper
  - type: Icon
    sprite: _FinalStand/Structures/catwalk.rsi
