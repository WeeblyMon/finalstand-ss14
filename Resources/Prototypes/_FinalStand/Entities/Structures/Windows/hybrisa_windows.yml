- type: entity
  parent: BaseWindowStructure
  id: FSWindowHybrisa
  name: window
  description: A glass window inside a wall frame.
  components:
  - type: Damageable
    damageModifierSet: Glass
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Sprite
    sprite: _FinalStand/Structures/Windows/hybrisa_window.rsi
    state: strata_window0
  - type: Icon
    sprite: _FinalStand/Structures/Windows/hybrisa_window.rsi
    state: strata_window0
  - type: IconSmooth
    key: windows
    additionalKeys:
    - doors
    base: strata_window
    mode: CardinalFlags
  - type: Repairable
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 600 # excessive damage destroys window and frame
        behaviors:
          - !type:PlaySoundBehavior
            sound:
              collection: WindowShatter
          - !type:DoActsBehavior
            acts: ["Destruction"]
      - trigger:
          !type:DamageTrigger
          damage: 40
        behaviors:
          - !type:PlaySoundBehavior
            sound:
              collection: WindowShatter
          - !type:SpawnEntitiesBehavior
            spawn:
              ShardGlass:
                min: 1
                max: 1
          - !type:ChangeConstructionNodeBehavior
            node: windowFrameHybrisa

