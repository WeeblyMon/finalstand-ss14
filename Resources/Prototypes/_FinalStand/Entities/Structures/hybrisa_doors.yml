- type: entity
  parent: SignalButton
  id: FSPodDoorButton
  name: door control
  description: A remote control-switch for a lockdown door.
  components:
  - type: Sprite
    drawdepth: SmallObjects
    sprite: _FinalStand/Objects/door_button.rsi
    state: doorctrl

- type: entity
  parent: FSPodDoorButton
  id: FSPodDoorButtonBigRed
  suffix: Big Red
  components:
  - type: Sprite
    drawdepth: SmallObjects
    sprite: _FinalStand/Objects/door_button_br.rsi
    state: doorctrl

- type: entity
  parent: ShuttersNormal
  id: FSShutterHybrisa
  name: shutters
  description: Heavy rolling shutters, the kind a shopfront pulls down at closing time.
  components:
  - type: Sprite
    sprite: _FinalStand/Structures/Doors/Shutters/hybrisa_shutter.rsi
    drawdepth: BlastDoors
    layers:
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]

- type: entity
  parent: FSShutterHybrisa
  id: FSShutterHybrisaOpen
  suffix: Open
  components:
  - type: Door
    state: Open
  - type: Physics
    canCollide: false
  - type: Occluder
    enabled: false
  - type: Airtight
    airBlocked: false
  - type: RadiationBlocker
    enabled: false

- type: entity
  parent: ShuttersWindow
  id: FSShutterHybrisaWindow
  name: window shutters
  description: Slatted shutters over a shopfront window. You can just about see through them.
  components:
  - type: Sprite
    sprite: _FinalStand/Structures/Doors/Shutters/window_shutter.rsi
    drawdepth: BlastDoors
    layers:
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]

- type: entity
  parent: FSShutterHybrisaWindow
  id: FSShutterHybrisaWindowOpen
  suffix: Open
  components:
  - type: Door
    state: Open
  - type: Physics
    canCollide: false
  - type: Airtight
    airBlocked: false
  - type: RadiationBlocker
    enabled: false

- type: entity
  parent: BaseStructure
  id: FSElevatorDoorBroken
  name: broken elevator door
  description: Completely broken. The elevator is not going to work.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 190
        layer:
        - MobMask
  - type: Sprite
    sprite: _FinalStand/Structures/elevator_doors.rsi
    state: elevator_left
  - type: Clickable
  - type: InteractionOutline
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 2
            max: 3
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: FSElevatorDoorBroken
  id: FSElevatorDoorBrokenRight
  suffix: Right
  components:
  - type: Sprite
    sprite: _FinalStand/Structures/elevator_doors.rsi
    state: elevator_right
