- type: entity
  abstract: true
  id: BodyOrgansSlime
  components:
  - type: InitialBody
    organs:
      Head: HeadSlime
      Torso: ChestSlime
      Lungs: OrganSlimeLungs
      Groin: GroinSlime
      Core: SentientSlimeCore
      ArmRight: RightArmSlime
      ArmLeft: LeftArmSlime
      HandRight: RightHandSlime
      HandLeft: LeftHandSlime
      LegRight: RightLegSlime
      LegLeft: LeftLegSlime
      FootRight: RightFootSlime
      FootLeft: LeftFootSlime
    relationships:
      Torso: [ ArmLeft, ArmRight, Groin, Head, Lungs ]
      Groin: [ Core, LegLeft, LegRight ]
      ArmRight: [ HandRight ]
      ArmLeft: [ HandLeft ]
      LegRight: [ FootRight ]
      LegLeft: [ FootLeft ]
