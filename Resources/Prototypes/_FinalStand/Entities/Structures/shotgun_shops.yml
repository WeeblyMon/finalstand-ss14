      valuePerLevel: 1
    - id: hushpup-reload-speed
      name: Speed Loader
      description: Faster reload per level.
      maxLevel: 5
      baseCost: 2700
      type: ReloadSpeed
      valuePerLevel: 0.1
    - id: hushpup-damage
      name: Powder Charge
      description: Heavier load increases damage dealt by 10% per level.
      maxLevel: 5
      baseCost: 2700
      type: Damage
      valuePerLevel: 0.1
    - id: hushpup-fire-rate
      name: Hair Trigger
      description: Faster cycling increases fire rate by 0.5/level.
      maxLevel: 3
