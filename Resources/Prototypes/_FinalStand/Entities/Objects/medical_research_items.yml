# Items unlocked by the medical research tree. Each is printable only once its node is bought.

- type: entity
  parent: BaseVendingMachineRestock
  id: FSMedicalDispenserRestock
  name: ChemDrobe restock box
  description: Slot into a ChemDrobe to refill its stock of empty glassware.
  components:
  - type: VendingMachineRestock
    canRestock:
    - FSMedicalDispenserInventory
  - type: Sprite
    layers:
    - state: base
    - state: green_bit
      shader: unshaded
    - state: refill_medical

- type: latheRecipe
  id: FSMedicalDispenserRestock
  result: FSMedicalDispenserRestock
  completetime: 5
  materials:
    Steel: 300
    Plastic: 200

- type: latheRecipe
  id: FSFieldHospitalItem
  result: FSFieldHospitalItem
  completetime: 6
  materials:
    Steel: 400
    Plastic: 300
    Cloth: 200
