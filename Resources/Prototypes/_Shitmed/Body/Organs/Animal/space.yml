- type: entity
  parent: OrganAnimalLungs
  id: OrganSpaceAnimalLungs
  name: space animal lungs
  components:
  - type: Organ

- type: entity
  parent: OrganAnimalHeart
  id: OrganSpaceAnimalHeart
  name: space animal heart
  components:
  - type: Organ

- type: entity
  parent: [ OrganAnimalHeart, BaseMajorContraband ]
  id: OrganGoliathHeart
  name: goliath heart
  components:
  - type: Organ
  - type: Sprite
    sprite: _Shitmed/Mobs/Species/Space/Goliath/organs.rsi
    state: heart-on

- type: entity
  parent: OrganAnimalLungs
  id: OrganDragonLungs
  name: dragon lungs
  components:
  - type: Organ

- type: entity
  parent: OrganHumanEyes
  id: OrganLaserEyes
  name: laser raptor eyes
  components:
  - type: Organ

- type: entity
  parent: [ OrganAnimalHeart, BaseMajorContraband ]
  id: OrganCobraHeart
  name: cobra gland
  components:
  - type: Organ
  - type: Sprite
    sprite: _Shitmed/Mobs/Species/Space/Cobra/organs.rsi
    state: heart-on

- type: entity
  categories: [ HideSpawnMenu ]
  id: DragonsBreathGun
  name: dragon's lung
  description: For dragon's breathing.
  components:
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 5
    rechargeSound:
      path: /Audio/Animals/space_dragon_roar.ogg
  - type: BasicEntityAmmoProvider
    proto: ProjectileDragonsBreath
    capacity: 1
    count: 1
  - type: Gun
    soundGunshot:
      path: /Audio/Animals/space_dragon_roar.ogg
    soundEmpty: null
    projectileSpeed: 5
