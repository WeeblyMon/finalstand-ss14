- type: entity
  parent: BaseStructureDynamic
  id: FSStructureLattice
  name: structural lattice
  description: Like rebar, but in space.
  components:
  - type: Sprite
    sprite: _FinalStand/Structures/structure_lattice.rsi
    state: structure_lattice_a
  - type: Icon
    sprite: _FinalStand/Structures/structure_lattice.rsi
    state: structure_lattice_a
  - type: Transform
    anchored: true
    noRot: false
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 60
        mask:
        - MachineMask
        layer:
        - GlassAirlockLayer
  - type: InteractionOutline
  - type: Damageable
    damageModifierSet: StructuralMetallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak

- type: entity
  parent: FSStructureLattice
  id: FSStructureLatticeB
  components:
  - type: Sprite
